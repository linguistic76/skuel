description: |
  One of the oldest philosophical systems — Samkhya provides the intellectual framework behind yoga. It maps consciousness (purusha) and material nature (prakriti), explaining how awareness gets entangled with thought, emotion, and identity. You don't need to memorize the Sanskrit. The insight is this: you are not your thoughts. You are what watches them.
