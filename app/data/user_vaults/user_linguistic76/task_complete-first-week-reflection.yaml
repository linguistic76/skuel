uid: task:complete-first-week-reflection
title: Complete Your First Weekly Reflection

description: |
  After your first week of daily study sessions, sit down for 15 minutes
  and answer three questions:

  1. What went well this week?
  2. What was harder than expected?
  3. What one thing will I adjust next week?

  Write the answers down — even a few sentences per question is enough.

duration_minutes: 15
priority: medium
