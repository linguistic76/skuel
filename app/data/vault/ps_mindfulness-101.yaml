  - Understand what mindfulness practice actually is (and isn't)
  - Complete a two-minute breath awareness session
  - Recognize mind wandering as normal and expected
  - Practice the gentle return — the core skill of mindfulness

content: |
  ## What Is Mindfulness?

  Mindfulness is paying attention, on purpose, to what's happening right now — without judging it.

  That's it. No incense, no mantras, no pretzel legs. Just noticing.

  You already do it sometimes. When you taste the first sip of coffee and actually *taste* it. When you hear a song and the rest of the world drops away for a few seconds. When you feel the sun on your face and just stand there.

  Mindfulness practice takes that natural capacity and trains it — the same way you'd train a muscle. Not by forcing. By repeating.

  ## Why Breath?

  You need an anchor — something to direct your attention toward. Breath works best for beginners because:

  - **It's always there.** You don't need equipment, an app, or a quiet room.
  - **It's rhythmic.** The rise and fall gives attention something to follow.
  - **It's neutral.** There's no right or wrong way to breathe. You're just noticing what's already happening.

  Breath is not the point of mindfulness. It's the training tool. The point is building the capacity to *notice* — and once you can notice your breath, you can notice your thoughts, emotions, reactions, and patterns.

  ## The Two-Minute Practice

  Here's the whole thing. Two minutes.

  1. **Sit comfortably.** Chair, floor, cushion — doesn't matter. Spine naturally upright, not rigid. Shoulders relaxed. Hands wherever they're comfortable. If you want to close your eyes, close them. If not, soften your gaze toward the floor.

  2. **Find the breath.** Don't change it. Just notice where you feel it most — the cool air at your nostrils, the rise and fall of your chest, the expansion of your belly. Pick one spot and stay there.

  3. **Follow it.** Inhale... notice. Exhale... notice. That's the whole practice. You're not counting, not controlling, not trying to breathe a certain way. Just watching.

  4. **When your mind wanders — and it will — come back.** Gently. No frustration, no self-criticism. Just: "Oh, I was thinking about dinner. Back to the breath."

  5. **After two minutes, stop.** Open your eyes. Notice how you feel. Done.

  Two minutes. That's the session. You can do it right now before reading the next section.

  ## Small Steps Beat Big Bursts

  Here's a principle that will save your practice: **two minutes daily is better than twenty minutes occasionally.**

  The most common mistake beginners make is setting the bar too high. They decide to meditate for twenty minutes, do it twice, feel restless and "bad at it," and quit.

  Two minutes is almost impossible to fail at. It's short enough that resistance doesn't have time to build. It's small enough that you can fit it anywhere — after brushing your teeth, before opening your laptop, during a break between classes.

  The goal is not duration. The goal is consistency. Once you've done two minutes a day for a week, you'll naturally want to sit longer. Let it grow on its own. Don't force it.

  ## Mind Wandering Is the Practice

  Your mind will wander. Within seconds. This is not a problem. This is the point.

  Here's what actually happens during meditation:

  1. You focus on the breath
  2. Your mind drifts — to a thought, a plan, a memory, a worry, a song stuck in your head
  3. At some point, you *notice* that you drifted
  4. You bring attention back to the breath
  5. Repeat

  Step 3 is the most important moment. That instant of noticing — "Oh, I'm not on the breath anymore" — is mindfulness happening. You just became aware of your own attention. That's the skill you're building.

  Every time you notice and return, you're doing one rep. A session where your mind wanders fifty times and you return fifty times is not a bad session. It's fifty reps.

  ## The Gentle Return

  How you come back matters as much as the fact that you come back.

  The temptation is to be harsh: "Ugh, I was distracted again. Focus!" This creates tension. Tension creates more distraction. More distraction creates more harshness. It's a spiral.

  Instead, try this:

  **Label it softly.** When you notice you've wandered, silently say "thinking" or "wandering." Not as a judgment — as a gentle observation. Like noticing it's raining. Not good, not bad. Just: raining.

  **Guide, don't yank.** Imagine your attention is a puppy on a walk. It's going to wander. You don't scream at the puppy. You gently redirect it. "This way." Same principle.

  **Attention over intensity.** The quality of your attention matters more than the force of your concentration. Gentle noticing creates awareness. Forcing attention creates tension. You're not conquering the wandering mind — you're befriending it.

  ## Your Posture (Keep It Simple)

  Posture supports the practice without becoming the practice.

  - **Spine:** Naturally upright, not rigid. Imagine a string pulling gently from the top of your head.
  - **Shoulders:** Relaxed, dropped away from your ears.
  - **Hands:** Resting wherever they're comfortable — lap, knees, armrests.
  - **Head:** Balanced on your neck, chin slightly tucked.

  You can sit in a chair (feet flat, back away from the backrest), on a cushion (cross-legged, hips higher than knees), or even lie down (with the caveat that you might fall asleep — which isn't the end of the world).

  The only rule: alert but relaxed. If you're tense, you're trying too hard. If you're slouching, you're too relaxed. Find the middle.

  Don't let posture be a barrier. If your knees hurt on the floor, sit in a chair. If you can't sit, stand. If you can't stand, lie down. The position matters far less than the fact that you showed up.

  ## Practice: Right Now

  You have three options. Pick one.

  **Option 1: Two minutes right now.**
  Set a timer for two minutes. Sit comfortably. Follow your breath. When your mind wanders, label it "thinking" and return. When the timer goes, stop.

  **Option 2: Two minutes before bed tonight.**
  Same practice, but at the end of your day. Sit on the edge of your bed. Two minutes. Breath. Notice. Return. Then sleep.

  **Option 3: Label one wander.**
  During any moment today — in line, at your desk, walking — notice when your mind wanders from what you're doing. Silently label it "wandering." That's it. One rep of awareness, no cushion required.

  Whichever you choose: do it once. Tomorrow, do it again. The practice is that simple.

  ## What's Next

  If you did two minutes today, you've started. That's not nothing — that's everything. A daily practice begins with day one.

  Once breath awareness feels familiar (give it a week), you can:
  - Extend your sessions gradually (three minutes, then five, then ten — never by force)
  - Start noticing emotions the way you notice breath (same skill, different anchor)
  - Explore how mindfulness connects to the SEL skills — self-awareness is the root that feeds self-management, social awareness, relationships, and decision-making

  The foundation you're building here — noticing what's happening, without judgment, and gently returning — is the same skill that powers everything else.

