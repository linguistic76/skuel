description: |
  James Clear's core insight — you don't rise to the level of your goals, you fall to the level of your systems. Goals set direction. Systems make progress. An atomic habit is a tiny behavior that compounds. 1% better every day is 37x better in a year. The four laws: make it obvious, make it attractive, make it easy, make it satisfying. Change your habits, change your identity.
