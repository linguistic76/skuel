  - loss aversion
source: research
sel_category: self_awareness
description: |
  Bad hits harder than good. One insult outweighs ten compliments. One failure eclipses a streak of successes. Your brain evolved to prioritize threats — useful in the wild, exhausting in modern life. Knowing this doesn't erase the bias, but it lets you pause and ask: is this actually as bad as it feels, or is my threat detector overreacting?
