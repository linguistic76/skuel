# Enhanced pyproject.toml for SKUEL with Type Safety
# Builds on existing configuration while adding enhanced type checking

[project]
name = "skuel"
version = "1.0"
description = "Knowledge Graph w/ Search + Sync"
authors = [{name = "MCF", email = "mcf@example.com"}]
requires-python = ">=3.14,<4.0"

dependencies = [
    # Web Framework
    "python-fasthtml>=0.14.3",
    "uvicorn>=0.51.0",
    # Database — pinned for operational stability.
    # The driver version is DECOUPLED from the server version: the server runs the
    # Neo4j calendar line (today neo4j:2026.06.0, ADR-067 § 3a); this last-5.x driver
    # is Bolt-forward-compatible with 2026.x servers (verified live). Bumping the
    # driver is a normal latest-stable upgrade (test against the pinned server);
    # moving to the 6.x driver is a deliberate migration (ADR-worthy), not a routine
    # bump. See docs/decisions/ADR-067-dependency-upgrade-policy.md §§ 3, 3a.
    "neo4j==5.26.0",
    # AI/LLM Integration
    "openai>=2.41.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.0",
    "langchain-neo4j>=0.9.0",
    "langchain-openai>=1.2.2",
    # Configuration & Environment
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # Content Processing
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.3.0",
    "markdown>=3.10.2",
    # Logging
    "structlog>=25.5.0",
    # File operations for FastHTML
    "aiofiles>=25.1.0",
    # Enhanced Type Safety Dependencies
    "typing-extensions>=4.16.0",
    "anthropic>=0.105.2",
    "rdflib>=7.6.0",
    "psutil>=7.2.2",
    # INTENTIONAL CAP — Deepgram 5.x+ is a breaking SDK rewrite; stay on 4.x
    # until a deliberate migration. See ADR-067 § Pins.
    "deepgram-sdk>=4.8.1,<5.0.0",
    # Security Dependencies
    "cryptography>=48.0.0",
    # Vault-agent WS client (ADR-075 B3) — direct dep, not a transitive ride on
    # deepgram/fastmcp; agent/skuel_vault_agent.py + its unit tests import it.
    "websockets>=16.1.1",
    "python-slugify>=8.0.4",
    "bcrypt>=5.0.0",
    # GraphQL API - For complex nested queries and real-time subscriptions
    "strawberry-graphql>=0.316.0",
    "weasyprint>=69.0",
    "prometheus-client>=0.25.0",
    "resend>=2.30.1",
    "huggingface-hub>=1.18.0",
    # Firefly III REST client (ADR-051)
    "httpx>=0.28.1",
    # Stripe webhook signature verification (ADR-051)
    "stripe>=15.2.0",
    "keyring>=25.7.0",
]

[project.scripts]
skuel = "skuel:app"
skuel-dev = "start_dev:run"

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mypy>=1.0.1",
    # Code Quality with Enhanced Type Checking
    "black>=26.5.1",
    "isort>=8.0.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    # Development Tools
    "jupyter>=1.1.1",
    "ipython>=9.15.0",
    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
    "testcontainers>=4.14.2",
    "mcp-neo4j-cypher>=0.6.0",
    "types-requests>=2.33.0.20260712",
    "types-markdown>=3.10.2.20260712",
    "vulture>=2.16",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
# Lint/format syntax target intentionally LAGS the runtime (requires-python = 3.14).
# Bumping to py314 triggers a codebase-wide annotation modernization (UP037/TC rules);
# that sweep is a separate, deliberate change. See ADR-067 § Deferred: py314 lint sweep.
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

# ============================================================================
# ENHANCED MYPY CONFIGURATION - Catches double-wrap bugs automatically
# ============================================================================

[tool.mypy]
# Core Python version and strictness
python_version = "3.14"
# PRAGMATIC STRICTNESS: Strict where it matters, lenient for models
strict = false  # Use per-module overrides instead
explicit_package_bases = true

# Pydantic plugin - teaches MyPy how to handle Field(default=...) properly
# This eliminates ~400 false-positive "missing argument" errors for Pydantic models
plugins = ["pydantic.mypy"]

# Core checks enabled globally
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

# Lenient global defaults (overridden per-module)
disallow_untyped_defs = false  # Only enforce in critical modules
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false  # FastHTML routes
warn_unused_ignores = true
warn_no_return = false  # Too noisy
warn_return_any = false  # Only enforce in critical modules
warn_unreachable = false  # Conflicts with the __post_init__ sentinel-default pattern and Neo4j JSON-string boundary in core/models/*. See: core/models/entity.py:82, core/models/exercises/exercise.py:89.

# No error codes are globally disabled. arg-type is enforced on all first-party
# trees (see the per-module note below); tests/examples/scripts scope-disable it.

# Allow Any for flexibility
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false  # Only enforce in critical modules
disallow_subclassing_any = false

# Protocol and typing enhancements
show_error_codes = true
error_summary = true
pretty = true
show_column_numbers = true
show_error_context = true

# Files to check (gradual migration strategy)
files = ["core", "adapters", "main.py", "services_bootstrap", "ui", "agent"]
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "__pycache__/",
    ".*\\.egg-info/",
    "tests/fixtures/",
    ".*/archive/.*",
    "z_archives/.*",
    "legacy/.*",
    ".*_old\\.py$",  # Archived service files (deprecated code)
]

# Per-module configuration for SKUEL-specific patterns

# arg-type is ENFORCED on all four first-party trees — core, services_bootstrap,
# adapters, ui — globally enabled (the global disable_error_code was deleted above)
# as of 2026-05-31, after each was swept to 0 across PRs #104–149. The former
# per-module `enable_error_code = ["arg-type"]` overrides are gone (redundant once
# global). arg-type is the mechanical enforcement layer of SKUEL's functional
# direction (frozen models, Result[T], typed payloads — ADR-035/ADR-065); see
# docs/roadmap/functional-direction.md. The only scoped EXCEPTION is the
# tests/examples/scripts block below (framework-mock noise, ~1628 sites, never swept).

[[tool.mypy.overrides]]
# Core ports — strict typing enforced (0 untyped defs as of 2026-03-27).
# warn_return_any added 2026-05-16 after fixing 10 no-any-return errors in
# content_protocols.py (getattr() → cast). Protocols are the contract;
# silent Any returns defeat the type system at the most important boundary.
module = ["core.ports.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# Core auth — warn_return_any enforced (added 2026-05-16). Auth is a
# security-critical boundary; silently propagating Any through Result
# returns hides type-mismatch bugs. Fixed 17 occurrences of cross-type
# Result propagation (`return some_result` → `return Result.fail(some_result)`,
# per CLAUDE.md error-handling guidance).
module = ["core.auth.*"]
warn_return_any = true

[[tool.mypy.overrides]]
# Core services - gradual strictness migration
module = ["core.services.*"]
disallow_any_generics = false  # Too many existing violations
disallow_untyped_defs = false  # 94 untyped defs remain — enable incrementally
warn_return_any = false  # Too noisy
check_untyped_defs = true
disallow_any_decorated = false  # Too strict for FastHTML

[[tool.mypy.overrides]]
# Result pattern infrastructure - CRITICAL for type safety
module = ["core.utils.result_simplified", "core.utils.error_boundary"]
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Core models and infrastructure - medium strictness
module = ["core.models.*", "core.infrastructure.*", "core.patterns.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
check_untyped_defs = true
disallow_any_generics = false  # Allow untyped generics in models

[[tool.mypy.overrides]]
# Utility modules - lenient for generic helper functions
module = ["core.utils.*"]
disallow_untyped_defs = false
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
# UI modules - lenient (no py.typed markers in fasthtml/fastcore).
# warn_unreachable=true: ui/ doesn't construct domain models, so it avoids
# the __post_init__ sentinel + Neo4j JSON-string patterns that make
# warn_unreachable unworkable in core/models/*. See pyproject.toml:154.
module = ["ui.*"]
disallow_untyped_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unreachable = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Bootstrap: no frozen-dataclass post-init normalization or Neo4j
# JSON-string boundary here, so warn_unreachable catches dead defensive
# code without false positives. See pyproject.toml:154 for why this is
# scoped per-module rather than enabled globally.
module = ["services_bootstrap.*"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Events and protocols - lenient (auto-generated patterns)
module = ["core.events.*", "core.protocols"]
disallow_untyped_defs = false
warn_return_any = false
# Allow common event patterns
disable_error_code = ["call-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
# Domain backends — MRO mixin conflicts (create/get/update/delete/list/create_relationship)
# are a known consequence of composing _CrudMixin, _UserEntityMixin, _SearchMixin,
# _TraversalMixin, _RelationshipCrudMixin via UniversalNeo4jBackend. The overlapping
# method signatures work correctly at runtime; suppressing [misc] avoids ~42 false positives.
module = [
    "adapters.persistence.neo4j.backends.activity_backends",
    "adapters.persistence.neo4j.backends.curriculum_backends",
    "adapters.persistence.neo4j.backends.exercise_backends",
    "adapters.persistence.neo4j.backends.sharing_backend",
    "adapters.persistence.neo4j.backends.forms_backends",
    "adapters.persistence.neo4j.backends.collab_backends",
    "adapters.persistence.neo4j.backends.misc_backends",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# FastHTML modules - allow some flexibility for framework usage
module = ["adapters.*"]
disallow_any_generics = false
disallow_untyped_decorators = false
# Still catch Result issues
warn_return_any = true

[[tool.mypy.overrides]]
# External dependencies that may not have full typing
module = [
    "neo4j.*",
    "fasthtml.*",
    "langchain.*",
    "openai.*",
    "deepgram.*",
    "anthropic.*",
    "rdflib.*",
    "psutil.*",
    "strawberry.*",
    "graphql.*",
    "huggingface_hub.*",
    "vulture.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Configuration module - ensure config typing is strict
module = ["config"]
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# GraphQL schema files - Strawberry generates __init__ methods dynamically
# MyPy doesn't understand Strawberry's @strawberry.type decorator
module = ["adapters.inbound.graphql.*"]
disable_error_code = ["call-arg", "misc"]  # Disable constructor argument checking for Strawberry types
warn_return_any = false

[[tool.mypy.overrides]]
# Tests and scripts — check_untyped_defs enforced (2026-05-17).
# Rationale: pytest verifies runtime behavior, but a test that constructs a
# wrong-typed DTO (e.g. stale kwargs after a model refactor) passes locally
# only because the test never exercised that path — MyPy catches the
# construction site itself. Same logic for one-shot scripts that wire up
# domain objects. We keep disallow_untyped_defs=false (tests don't need
# return annotations on every fixture) but turn on body-level checking.
#
# Disabled error codes (all inherent to the test/script context):
#   method-assign  — tests monkey-patch service methods with Mock/AsyncMock,
#                    which mypy correctly flags but the pattern is unavoidable.
#   type-var       — tests parameterize generics with DTOs (EntityDTO et al.)
#                    that don't satisfy the production bound; fine for fixtures.
#   misc           — Strawberry/Pydantic dynamic __init__ on test-only stubs.
#   arg-type       — tests/scripts construct wrong-typed DTOs/mocks freely (~1628
#                    sites); never in the sweep's scope. The four first-party trees
#                    (core, services_bootstrap, adapters, ui) enforce arg-type.
module = ["tests.*", "examples.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false  # too noisy for fixture helpers
warn_unused_ignores = false  # tests use # type: ignore liberally for mocks
disable_error_code = ["method-assign", "type-var", "misc", "arg-type", "import-untyped"]

# ============================================================================
# PYRIGHT CONFIGURATION
# ============================================================================
# Complements MyPy. The differentiator is reportAttributeAccessIssue +
# reportPossiblyUnboundVariable — pyright catches missing protocol attributes
# and branch-bound variables that mypy's defaults let through. `arg-type` is now
# enforced by mypy on `core/` (per-module override above, re-enabled 2026-05-29)
# but remains globally disabled for the un-swept trees (adapters/ui/
# services_bootstrap/tests/scripts); pyright's reportArgumentType is the
# cross-tree backstop for argument-type mismatches outside core/.
#
# Mode is "basic" + selectively-elevated rules. Strict mode floods on Result[T]
# inference (12k+ reportUnknown* warnings); basic mode + targeted rules is
# what actually pays for itself on this codebase.
#
# Invoke: `./dev quality` (gating) or `./dev typecheck-strict` (pyright alone).
# Baseline as of 2026-05-19: 0 errors, ~872 warnings — entirely reportArgumentType
# from MonsterUI / FastHTML missing-py.typed framework noise. All other warning
# categories (reportCallIssue, reportReturnType, reportAssignmentType, etc.) are
# at 0; the 78 real-signal warnings present on 2026-05-18 were resolved by
# fixing the underlying type issues, not by suppression.
# See: docs/patterns/linter_rules.md § Pyright

[tool.pyright]
include = ["core", "adapters", "main.py", "services_bootstrap", "ui"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scripts",
    "**/archive/**",
    "z_archives",
    "**/_old.py",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportMissingImports = "none"   # mypy owns import resolution

# Errors — high-value, low-noise (pyright catches what mypy misses)
reportAttributeAccessIssue = "error"
reportPossiblyUnboundVariable = "error"
reportInvalidStringEscapeSequence = "error"
reportInvalidTypeArguments = "error"

# Warnings — useful signal but framework-noisy (MonsterUI Button etc.)
reportArgumentType = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalOperand = "warning"
reportUnusedExpression = "warning"
reportRedeclaration = "warning"

# Silenced — Result[T] noise + FastHTML/MonsterUI lack py.typed markers
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"
reportUntypedBaseClass = "none"
reportPrivateUsage = "none"
reportGeneralTypeIssues = "none"          # mypy owns the catch-all
reportTypedDictNotRequiredAccess = "none" # noisy on intentional .get() patterns

# ============================================================================
# PYTEST CONFIGURATION - Enhanced for type safety testing
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add project root to Python path (for package-mode = false projects)
pythonpath = ["."]

# Coverage configuration
# Note: --cov-fail-under removed because different test types have different coverage expectations
# - Integration tests: Focus on core/services (high coverage expected)
# - Service tests: Include core + adapters (medium coverage expected)
# - Full suite: Includes ui/ + services_bootstrap/ (measured since 2026-07; lower
#   coverage there is expected — render code is exercised via the smoke test)
addopts = [
    "--cov=core",
    "--cov=adapters",
    "--cov=ui",
    "--cov=services_bootstrap",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # Coverage thresholds enforced per test type in run_tests.py, not globally
    "--strict-markers",
    "--strict-config",
    "-v",
    # Uncomment to enforce formatting before tests run:
    # "--ruff-format-check"
]

# Test markers for type safety testing
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "type_safety: Type safety validation tests",
    "slow: Slow running tests",
    "asyncio: Async tests"
]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Warning filters - suppress third-party deprecation warnings
filterwarnings = [
    # Testcontainers library uses deprecated internal patterns (as of v4.13.2)
    # These warnings come from the library itself, not SKUEL code
    # Will be fixed when testcontainers migrates to structured wait strategies
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
    "ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning:testcontainers",
    # Strawberry GraphQL framework internal deprecation (functools.py:995)
    # Warnings come from Strawberry's internal decorator processing, not SKUEL code
    # SKUEL code correctly uses Info[GraphQLContext, Any] pattern
    # Issue: https://github.com/strawberry-graphql/strawberry/issues/2851 (partially fixed in 0.288.1)
    "ignore:Argument name-based matching of 'info' is deprecated:DeprecationWarning",
    # Suppress AsyncMock internal cleanup warnings (false positives from unittest.mock)
    "ignore::RuntimeWarning:unittest.mock",
]

# ============================================================================
# COVERAGE CONFIGURATION - Track type safety coverage
# ============================================================================

[tool.coverage.run]


source = ["."]
omit = [
    "*/back_ups/*",
    "*/backup/*",
    "*/.backup/*",
    "*/backups/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/site-packages/*",
    "*/.pytest_cache/*",
    "*/tests/*",
    "*/test_*",
    "*/.git/*",
    "*/.tox/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


# ============================================================================
# RUFF CONFIGURATION - Fast linter with type checking support
# ============================================================================

[tool.ruff]
# Matches requires-python (3.14). TC002/TC003/UP037 are explicitly suppressed
# in the ignore list below to keep their deferred sweeps isolated: the TC moves
# are runtime-risky (Pydantic/FastHTML resolve annotations at runtime) and UP037
# is a ~890-site annotation-modernization sweep that belongs in its own change.
target-version = "py314"
line-length = 100
include = ["*.py", "*.pyi"]
exclude = [
    ".venv",
    "backup_archive",
    "neo4j-import",  # Neo4j Docker container data directory (permission denied)
    "docs/archive",  # Archived/deprecated code - not actively maintained
    "zarchives",     # Archived code - not actively maintained
    "__pycache__",
    "migrations",
    "*.egg-info",
    ".claude/skills",  # Claude Code skills templates (documentation, not production code)
    "scripts/migrate_dsl_error_handling.py",  # Contains regex patterns that confuse ruff's parser
]

[tool.ruff.lint]
select = [
    # Core Python quality
    "F",     # Pyflakes - syntax errors, undefined names
    "E",     # pycodestyle (errors) - PEP 8 violations
    "W",     # pycodestyle (warnings) - PEP 8 warnings

    # Code organization
    "I",     # isort - import sorting
    "N",     # pep8-naming - naming conventions
    "UP",    # pyupgrade - modern Python syntax

    # Bug prevention
    "B",     # flake8-bugbear - likely bugs and design problems
    "SIM",   # flake8-simplify - unnecessary complexity
    "RET",   # flake8-return - return statement issues (NEW!)

    # Performance
    "PERF",  # Perflint - performance anti-patterns (NEW!)

    # Modernization
    "FURB",  # refurb - modernization suggestions (NEW!)

    # Type safety
    "TCH",   # flake8-type-checking - TYPE_CHECKING imports
    "ANN",   # flake8-annotations - type hints

    # Code quality
    "ARG",   # flake8-unused-arguments - unused function arguments
    "PTH",   # flake8-use-pathlib - prefer pathlib over os.path
    "ASYNC", # flake8-async - async/await issues
    "LOG",   # flake8-logging-format - logging best practices

    # Ruff-specific
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Type annotation flexibility (strict mode via mypy instead)
    # Note: ANN101 and ANN102 were removed from Ruff (deprecated - self/cls annotations not recommended)
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed

    # Complexity rules (handled by code review)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison

    # Formatting (handled by ruff format)
    "E501",    # Line too long - handled by formatter

    # Return statement rules (selective ignoring)
    "RET505",  # Unnecessary `elif` after `return` - sometimes clearer
    "RET506",  # Unnecessary `elif` after `raise` - sometimes clearer

    # Performance rules (selective ignoring)
    # None currently - all PERF rules are valuable for SKUEL

    # FURB rules (selective ignoring)
    "FURB103", # `open` and `read` can be replaced by `Path.read_text()` - sometimes less clear
    "FURB110", # `if` statement can be replaced with `any()` - sometimes less readable
    "FURB113", # `try`-`except` can be replaced with `contextlib.suppress()` - explicit better

    # Async rules (SKUEL uses asyncio, not trio/anyio)
    "ASYNC240", # Blocking pathlib in async - trivial local FS ops, no anyio dependency
    "ASYNC250", # Blocking input() in async - only in interactive scripts

    # SKUEL-specific ignores (January 2026)
    "RUF022",  # __all__ sorting - we use semantic grouping with comments
    "TC001",   # TYPE_CHECKING imports - false positives for runtime imports
    "TC002",   # move third-party import into TYPE_CHECKING — deferred py314 sweep (runtime-risky w/ Pydantic/FastHTML)
    "TC003",   # move stdlib import into TYPE_CHECKING — deferred py314 sweep (runtime-risky w/ Pydantic/FastHTML)
    "UP037",   # remove quotes from type annotations — deferred py314 sweep (~890 sites, own change)
    "UP046",   # Generic[T] syntax - keep existing pattern for compatibility
    "UP047",   # TypeVar in function signatures - keep existing pattern for consistency with UP046
]

# ============================================================================
# SKUEL ARCHITECTURE ENFORCEMENT (January 2025)
# ============================================================================
# Lambda functions: E731 is ENABLED - enforces SKUEL "no lambda" policy
# Additional SKUEL-specific rules enforced via custom scripts (see scripts/lint_skuel.py):
#   - SKUEL003: Deprecated .is_err usage (use .is_error instead)
#   - SKUEL011: hasattr() in production code (use explicit type checks)
#   - SKUEL007: String-based Result.fail() (use Errors factory)

fixable = ["ALL"]

# ============================================================================
# PHASE 8.1: SKUEL ARCHITECTURE ENFORCEMENT (October 3, 2025)
# ============================================================================
# Custom linting rules to enforce SKUEL architectural patterns:
# - Phase 5: No APOC in domain services
# - Phase 7: Semantic-first development
# - Type safety and code quality

[tool.ruff.lint.per-file-ignores]
# Standard test/example ignores
"tests/**/*.py" = ["ANN", "ARG001", "ARG002", "S101", "E731", "RUF012", "SIM117", "B017", "PTH110"]  # Tests: fixtures, mocking, os.path allowed
"tests/integration/**/*.py" = ["ANN", "ARG002", "S101", "RUF012", "SIM117", "B017"]  # Integration tests: unused fixtures + broad exceptions
"main.py" = ["T201"]                                          # Main entry point can use print

# FastHTML UI files - star imports are intentional design pattern
"adapters/inbound/*ui*.py" = ["F405", "RUF001", "ARG001", "ARG004", "ANN202"]  # UI components + request param + no return types
"adapters/inbound/*_routes.py" = ["F405", "ARG001", "ANN202", "F811"]  # Route handlers + FastHTML + duplicate imports
"adapters/inbound/*_api.py" = ["RUF003", "ARG001", "ARG005", "ANN202"]  # API routes + unused params (incl lambda) + no return types

# UI component files - PascalCase function names are intentional (FastHTML convention)
"adapters/inbound/*_components.py" = ["N802"]       # UI component functions use PascalCase
"ui/*.py" = ["N802", "RUF001", "RUF002"]              # Shared UI components use PascalCase + Unicode icons
"ui/**/*.py" = ["F405", "N802", "RUF001", "RUF002", "RUF012", "ARG001", "ARG002", "ANN", "PERF401"]  # UI: PascalCase + Unicode + class defaults

# Templates and examples are documentation (Phase 8.1)
"templates/**/*.py" = ["ANN", "ARG"]
"examples/**/*.py" = ["ANN", "T201", "ARG", "E731", "RUF001"]  # Examples can use lambdas + Unicode

# Core utilities with special import patterns
"core/utils/result_simplified.py" = ["E402"]  # Has from __future__ import before docstring (correct per PEP 8)

# Standalone scripts — the narrow, justified set (pruned 2026-07 from a broad
# 11-code list that also masked E999 syntax errors):
#   E402 — scripts run directly and require setup before imports
#           (sys.path.insert() for core.* imports, load_dotenv() before
#           core.config). Standard standalone-script practice.
#   ARG  — unused interface/callback parameters (argparse handlers, protocol
#           conformance); scripts are utilities, not API contracts.
#   RUF001/002/003 — intentional Unicode/emoji in CLI output (✅⚠️→×), same
#           precedent as the targeted infra-file ignores above.
"scripts/*.py" = ["E402", "ARG", "RUF001", "RUF002", "RUF003"]  # Scripts: setup imports, CLI emoji

# Infrastructure files - intentional Unicode in documentation
"test_graphql_complexity.py" = ["RUF001", "RUF003"]  # GraphQL tests use × multiplication symbol
"core/services/journal_core_service.py" = ["RUF001"]  # Journal service uses Unicode symbols
"core/services/audio_transcription_service.py" = ["RUF001"]  # Emojis in log messages for readability (✅⚠️ℹ️)
"adapters/inbound/auth/session.py" = ["RUF001"]  # Session management uses Unicode indicators
"core/infrastructure/routes/intelligence_route_factory.py" = ["RUF002"]  # Math symbols (×) in docstring calculations

# Mock data - unused parameters reserved for future real implementation
"core/mock_data/**/*.py" = ["ARG001"]           # Mock functions will use user_uid/period when implemented

# Files with intentional unused parameters (protocols, future implementation, or framework requirements)
"core/models/validation_rules.py" = ["ARG001", "ARG002"]  # Pydantic field_validators require cls but may not use it
"core/services/dsl/*.py" = ["ARG002", "SIM116"]   # DSL visitor pattern + if/elif chains for mapping
"core/services/intelligence/*.py" = ["ARG001", "ARG002"]  # Calculator methods reserve params for future
"core/models/query/_cypher_generator.py" = ["ARG002", "ARG004", "RUF002", "PERF401"]  # Query builder signatures + math symbols in docs
"core/models/query/cypher/*.py" = ["ARG001", "ARG002", "RUF002", "PERF401"]  # Cypher query modules + math symbols
"adapters/persistence/neo4j_adapter.py" = ["ARG002"]  # Adapter method signatures
"adapters/vault/*.py" = ["ARG002"]  # Filesystem adapter implements VaultBridgePort; user_uid unused in single-user local impl
"core/services/*_service.py" = ["ARG002", "PERF401"]  # Service method signatures implement protocols
"core/services/unified_ingestion_service.py" = ["E402", "F402"]  # Imports after constants + loop var shadowing
"core/services/*/[!_]*.py" = ["ARG002", "ARG004", "RUF012", "PERF401", "SIM102", "SIM108", "SIM116"]  # Nested service modules + class config
"core/services/infrastructure/*.py" = ["ARG002"]  # Infrastructure helpers
"core/infrastructure/**/*.py" = ["ARG001", "ARG002", "PERF401", "SIM116", "RUF002", "B021"]  # Route factories + batch helpers
"core/services/relationships/*.py" = ["ARG002", "PERF401", "SIM108"]  # Relationship services + patterns
"core/services/user/*.py" = ["ARG002", "PERF", "F822"]  # User services implement protocols + complex context ops
"core/models/search/*.py" = ["ARG001", "ARG002", "RUF012", "E741"]  # Search scoring methods + class config + var names


# Core utilities - various patterns
"core/utils/api_responses.py" = ["B021", "F822"]  # f-string docstrings + legacy re-exports
"core/models/relationships/*.py" = ["F822", "ARG003", "PERF401"]  # Re-exports + class methods + performance patterns

# GraphQL schema - Strawberry patterns
"adapters/inbound/graphql/*.py" = ["RUF001", "ARG", "F811", "F822", "PERF", "SIM105"]  # Framework patterns + subscriptions

# Core models - query models have protocol-based interfaces
"core/models/query/_query_models.py" = ["ARG001"]  # Query model protocols need consistent signatures

# Domain services MUST NOT use APOC (Phase 5 compliance - enforced by custom script)
"core/services/**/*.py" = []

# Adapters CAN use APOC (infrastructure layer)
"adapters/**/*.py" = []

# ============================================================================
# DEFERRED IMPLEMENTATIONS - Tracked in docs/reference/DEFERRED_IMPLEMENTATIONS.md
# ============================================================================
# These files have intentionally unused parameters reserved for future implementation.
# Each violation is tagged in code (DEFERRED-ARG-*, FUTURE-IMPL-*, STUB-*, API-COMPAT-*)
# and documented with implementation requirements in DEFERRED_IMPLEMENTATIONS.md
#
# Search for implementations: rg "# DEFERRED:" --type py
# Search for all tags: rg "docs/reference/DEFERRED_IMPLEMENTATIONS.md" --type py

# Deferred to Phase 3B (DEFERRED-ARG-001)
"core/services/adaptive_lp/adaptive_lp_recommendations_service.py" = ["ARG002"]

# Future personalization (FUTURE-IMPL-001 through FUTURE-IMPL-009)
"core/services/goals/goal_recommendation_service.py" = ["ARG002"]  # 4 unused: user_uid, domain (multiple methods)
"core/services/goals/goals_progress_service.py" = ["ARG002"]       # FUTURE-IMPL-008: current_streak
"core/services/lp/lp_progress_service.py" = ["ARG002"]             # FUTURE-IMPL-009: newly_mastered_ku

# Stub/placeholder methods (STUB-001 through STUB-006)
"core/services/askesis/context_retriever.py" = ["ARG002"]          # STUB-001, STUB-002, STUB-003
"core/services/askesis/query_processor.py" = ["ARG002"]            # STUB-004, STUB-005
"core/services/user/user_context_intelligence.py" = ["ARG002"]     # STUB-006

# API compatibility (API-COMPAT-001)
"adapters/inbound/response_helpers.py" = ["ARG001"]                # FastHTML - headers param for API consistency
"adapters/inbound/_pathstep_template_routes_helpers.py" = ["ARG001"]  # FastHTML route handlers — request/current_user injected by decorators

# ============================================================================
# SKUEL PATTERN EXCEPTIONS (January 2025)
# ============================================================================
# Lambda exceptions: E731 (Do not assign a lambda expression, use a def)
"core/utils/sort_functions.py" = ["F811"]     # Named sort functions, duplicate defs for backwards compat
"core/infrastructure/utils/factory_functions.py" = []  # Named factories, no lambdas
"core/utils/mock_decorators.py" = ["E731"]    # Mock utilities can use lambdas

# hasattr() exceptions: Checked via custom SKU002 rule
# Allowed in: core/utils/sort_functions.py (duck typing for generic utilities)
# Allowed in: core/utils/mock_decorators.py (testing function metadata)

[tool.ruff.lint.isort]
known-first-party = [
    "adapters", "config", "database",
    "events", "models", "monitoring", "ports", "services",
    "tests", "utils"
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["rt", "ft", "Div", "H1", "P", "Button", "Form", "Input"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "fasthtml.common.ft"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80
