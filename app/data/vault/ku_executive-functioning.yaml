description: |
  The brain's management system — planning, organizing, prioritizing, managing time, and controlling impulses. These skills develop through adolescence and aren't fully mature until your mid-twenties. That's not a flaw. It's an opportunity. Every time you plan a project, resist a distraction, or break a big task into steps, you're building executive function. SKUEL builds this deliberately.
