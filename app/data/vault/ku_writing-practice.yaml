description: |
  Writing is thinking made visible. When you write, you discover what you actually believe — as opposed to what you think you believe. Journaling, reflection, free-writing — these aren't school assignments. They're tools for self-knowledge. Ray Dalio journals his principles. Marcus Aurelius wrote meditations. You don't write because you have something to say. You write to find out what you have to say.
