description: |
  The greater jihad — jihad al-nafs — is the struggle against your own lower self. Not the version on the news. The real one. Every tradition has this idea: the hardest battle is against your own ego, laziness, and base desires. In Islam it's jihad. In yoga it's tapas. In Christianity it's spiritual warfare. The enemy isn't outside. The enemy is the part of you that chooses comfort over growth.
