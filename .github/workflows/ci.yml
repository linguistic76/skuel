name: CI

# Single CI workflow for SKUEL. Replaces the former quality.yml + docs.yml.
#
# Why one workflow with a gate: branch protection requires a check that runs on
# EVERY PR. The heavy jobs (mypy, docs) are path-scoped, so on their own they
# would never report on an unrelated PR and would deadlock a required check.
# The `gate` job always runs and aggregates their results, so "CI Gate" is the
# one safe required status check.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # PR comments (mypy failures, docs results)

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      cypher: ${{ steps.filter.outputs.cypher }}
      neo4j_config: ${{ steps.filter.outputs.neo4j_config }}
      js: ${{ steps.filter.outputs.js }}
      audit: ${{ steps.filter.outputs.audit }}
      css: ${{ steps.filter.outputs.css }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so paths-filter can resolve the pre-push commit on
          # push events (base below); shallow clones can miss it.
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3 (pinned: third-party action)
        with:
          # On push, diff only the pushed commits (ignored on pull_request,
          # where the PR base is used). Without this, pushes to any long-lived
          # branch would diff against main and over-trigger the jobs.
          base: ${{ github.ref }}
          filters: |
            py:
              - 'app/**/*.py'
              - 'app/pyproject.toml'
              - 'app/uv.lock'
              # Generated artifacts: a hand edit of one alone must still
              # trigger the unit-test drift guard that rejects it.
              - 'app/docs/reference/GRAPH_CONTRACT.yaml'
              - 'app/docs/reference/BASESERVICE_METHOD_INDEX.md'
              # The blocked_by anchor file (scripts/detect_bloat.py reads its
              # headings): a heading rename alone must still trigger the
              # Dead-Code Gate (lint) and the live sentinel in
              # tests/unit/scripts/test_detect_bloat.py that reject a dangling
              # pointer — otherwise the docs-only skip merges it green and the
              # weekly janitor is the first reader (Codex P2, PR #1191).
              - 'app/docs/roadmap/deferred-work.md'
              # Same shape, different reader: tests/unit/docs/
              # test_activity_template_docs.py derives the six Activity-Template
              # field tables, the type/prefix/attachment rows and the enum
              # vocabularies FROM this guide, so a docs-only edit to a table is
              # exactly the change that breaks the drift test — and would skip
              # unit_tests without this line. Only the guide is listed: the
              # module reads it by path, and its docs-wide table glob is a
              # residual (a table planted in a NEW doc is unreachable by any
              # filter), the same residual deferred-work.md's entry carries.
              - 'app/docs/guides/ACTIVITY_TEMPLATE_AUTHORING.md'
              # Same shape again: tests/unit/docs/test_status_table_docs.py
              # derives the per-type status table FROM this guide. The
              # ingestion validator enforces that table, so a wrong cell is a
              # rule an author is held to — and a docs-only edit to it is
              # exactly the change that breaks the drift test.
              - 'app/docs/guides/YAML_AUTHORING_GUIDE.md'
              # Same shape once more: tests/unit/docs/
              # test_api_validation_status_docs.py DRIVES each helper this guide
              # names and asserts the status column matches. The column is a
              # contract a client integrator branches on, so a docs-only edit to
              # a cell is exactly the change that must run the drift test.
              - 'app/docs/patterns/API_VALIDATION_PATTERNS.md'
              # The uv.lock pinning guard's inputs (tests/unit/
              # test_workflow_uv_lock_pinning.py). It reads EVERY workflow, not
              # just ci.yml (unlike the filters below), and follows what those
              # workflows invoke: the shell scripts and the local composite
              # actions. All three are transitive inputs — the guard's verdict
              # changes when any of them does. Scoped narrower, a PR touching
              # only one would skip unit_tests, and the gate accepts skips, so
              # the guard would go silently unrun on exactly the change that
              # breaks it. Patterns are CLASSES, not names, so PR #932's
              # osv-scanner rename of audit_dependencies.sh cannot re-open it.
              # Coverage is asserted by the guard itself, not maintained here.
              - '.github/workflows/**'
              - '.github/actions/**'
              # All of scripts/, not just its *.sh (which the pinning guard
              # above needs — this is a superset): ShellCheck (lint job)
              # discovers shell scripts by shebang as well as suffix (see
              # scripts/shellcheck_tracked.py), and path filters cannot read
              # file contents, so the conventional homes of shell programs
              # trigger wholesale — scripts/, the dev entrypoint, the hook
              # dirs. A shell script landed outside every class here would
              # dodge only its OWN PR's lint run: the check scans ALL tracked
              # files, so the next py-touching PR catches it. Unconditional
              # lint was considered and rejected — the docs-only skip is a
              # deliberate design of this filter block.
              - 'app/scripts/**'
              - 'app/dev'
              - 'app/.claude/hooks/**'
            docs:
              - 'app/docs/**'
              - 'app/.claude/skills/**'
              - 'app/scripts/docs_*.py'
              - 'app/scripts/skills_validator.py'
              - '.github/workflows/ci.yml'
            ui:
              # Client-side render surface: static assets, UI render code, the
              # smoke test itself, and dependency pins. A JS-only change (e.g. the
              # skuel.js infinite-loop bug) must still trigger the render smoke test.
              - 'app/static/**'
              - 'app/ui/**'
              - 'app/scripts/smoke_test.py'
              - 'app/pyproject.toml'
              - 'app/uv.lock'
              - '.github/workflows/ci.yml'
            cypher:
              # Executable Cypher outside .py files: migrations and index DDL are
              # loaded and exercised by integration tests, so a Cypher-only PR
              # must still trigger the integration suite (Codex review, PR #701).
              - 'app/**/*.cypher'
              - '.github/workflows/ci.yml'
            neo4j_config:
              # Neo4j server configuration, which is executable input to the
              # integration suite even though it is neither .py nor .cypher.
              # The APOC procedure allowlist is enforced by these files ALONE
              # (there is no apoc.conf), and tests/integration/
              # test_apoc_allowlist_lockdown.py builds its container FROM them —
              # so a compose-only PR that widens or deletes the allowlist is
              # exactly the regression that suite exists to catch. Scoped
              # narrower, that PR would trigger no py/cypher change,
              # integration_tests would skip, and the gate accepts skips: the
              # lockdown test would go silently unrun on the one change that
              # breaks it. Same reasoning as the cypher filter (PR #701) and
              # the workflow paths in py above.
              - 'infrastructure/docker-compose.yml'
              - 'app/docker-compose.yml'
              - '.github/workflows/ci.yml'
            js:
              # Vitest surface (PR #717): the JS under test, the suite itself,
              # and the Node toolchain pins. Mirrors the cypher filter — a
              # JS-only PR must still run the vitest suite even though every
              # py-gated job skips.
              - 'app/static/js/**'
              - 'app/tests/js/**'
              - 'app/package.json'
              - 'app/package-lock.json'
              - 'app/.nvmrc'
              - 'app/.npmrc'
              - 'app/vitest.config.js'
              - '.github/workflows/ci.yml'
            css:
              # css_freshness surface (ADR-084): the committed output.css must
              # stay in sync with input.css AND with every tree Tailwind scans
              # for class literals — the @source roots in input.css (ui/,
              # adapters/inbound/, core/, static/js/) — plus the Tailwind CLI
              # pins. A class-string-only .py change can alter the compiled
              # CSS, so the filter mirrors the @source globs, not just the
              # css files.
              - 'app/static/css/**'
              - 'app/ui/**'
              - 'app/adapters/inbound/**'
              - 'app/core/**'
              - 'app/static/js/**'
              - 'app/package.json'
              - 'app/package-lock.json'
              - '.github/workflows/ci.yml'
            audit:
              # dep_audit's own tooling (Codex, PR #797): a PR that changes
              # only the audit script or the accepted-findings list must still
              # run the job it modifies — the gate accepts skips, so without
              # this filter the security check could be edited unexercised.
              # The JS surface rides this filter too (PR #932 step 5): one
              # script now scans both lockfiles, and the py filter knows
              # nothing about package-lock.json, so without these a JS-only
              # lock change would skip the consolidated audit — the same
              # diff-gating blind spot that produced dependency-audit.yml.
              # All app/-prefixed: dorny/paths-filter evaluates from the
              # repository root, so bare filenames would silently match nothing.
              - 'app/scripts/audit_dependencies.sh'
              - 'app/osv-scanner.toml'
              - 'app/package.json'
              - 'app/package-lock.json'
              - '.github/actions/install-osv-scanner/action.yml'
              - '.github/workflows/ci.yml'

  mypy:
    # Job id stays `mypy` (the gate's needs list keys on it); the display name
    # reflects that both type checkers run here since the CI↔quality parity
    # work — pyright's 0-error baseline (2026-05-18) was previously unguarded.
    name: Type Check (MyPy + Pyright)
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    # Pin every uv command in this job to the committed lock. See the canonical
    # note on the install step below; the short version is that `uv sync` is not
    # the only command that re-locks — `uv run` does too, so flagging the sync
    # alone would leave the hole open one step later (Codex, PR #935).
    #
    # Job-level env rather than a flag per invocation: this job has ~20 `uv run`
    # calls across the file and enumerating them is the kind of hand-maintained
    # list that goes stale the first time someone adds a step.
    #
    # NOT set on dep_audit — see that job for why it would break the CVE gate.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      # --frozen: install uv.lock exactly as committed. This is the canonical
      # note for every `uv sync` in this file (Codex, PR #931).
      #
      # A bare `uv sync` LOCKS before syncing — it has neither --locked ("assert
      # the lock will remain unchanged") nor --frozen ("sync without updating
      # the lock"). So on a cache miss with uv.lock behind pyproject.toml it
      # re-resolves and REWRITES the lock in the runner workspace, and every
      # check below then measures a resolution nobody reviewed.
      #
      # --frozen rather than --locked, deliberately: this step is skipped on a
      # cache hit, and the cache key hashes uv.lock ALONE — so a PR that edits
      # pyproject.toml without re-locking keeps the same key and can land on a
      # cache warmed by an earlier PR, skipping the step entirely. --locked here
      # would therefore be a staleness detector that fires or not depending on
      # cache state; a gate that goes green on a re-run is worse than no gate.
      # Staleness is detected once, deterministically, by the dep_audit job.
      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      - name: Cache MyPy incremental state
        uses: actions/cache@v6
        with:
          path: app/.mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-${{ github.ref_name }}-
            mypy-${{ runner.os }}-py3.14-

      - name: Run MyPy
        id: mypy
        working-directory: app
        run: |
          set -o pipefail
          uv run mypy . | tee mypy_output.txt

      # Runs even when MyPy failed (mirrors the lint job: one CI run surfaces
      # every violation category), but not when setup itself failed.
      - name: Run Pyright
        if: ${{ !cancelled() && steps.mypy.outcome != 'skipped' }}
        working-directory: app
        run: uv run pyright

      # Attribution guard: keyed on the MyPy step's own outcome, not job-level
      # failure() — a Pyright-only failure must not post a "MyPy failed"
      # comment over a passing mypy_output.txt.
      - name: Upload MyPy output on failure
        if: ${{ !cancelled() && steps.mypy.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mypy-output
          path: app/mypy_output.txt
          retention-days: 14

      - name: Comment on PR if MyPy failed
        if: ${{ !cancelled() && steps.mypy.outcome == 'failure' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('app/mypy_output.txt', 'utf8');
            } catch (e) {
              output = '(MyPy output unavailable)';
            }
            // Trim to fit within PR comment limits (~64KB)
            const MAX = 50000;
            if (output.length > MAX) {
              output = output.slice(0, MAX) + '\n\n... (truncated — see "mypy-output" artifact for full log)';
            }

            const body = [
              '## ❌ MyPy Type Check Failed',
              '',
              'The zero-error MyPy baseline regressed on this PR.',
              '',
              'Run locally to reproduce:',
              '```bash',
              'cd app',
              'uv run mypy .',
              '```',
              '',
              '<details><summary>MyPy output</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              'See [`docs/patterns/mypy_pragmatic_strategy.md`](../blob/main/app/docs/patterns/mypy_pragmatic_strategy.md) for the suppression / fix playbook.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  # Lint — the mechanical rule set ./dev quality runs locally, minus the type
  # checkers (their own job above) and the checks other jobs own (dep_audit,
  # content_boundary, validate_documentation): Ruff format + check, the SKUEL
  # architecture linter, the Cypher linter, the route-security audit, the
  # raw-headers audit, the dead-code gate, and ShellCheck. Before this job
  # existed none of these ran in CI, so a PR authored without a local
  # ./dev lint merged with zero lint coverage.
  # tests/unit/scripts/test_quality_ci_parity.py asserts this job (plus the
  # others named above) covers every ./dev quality check — extend BOTH sides.
  lint:
    name: Lint
    needs: changes
    # cypher too (Codex, PR #701): keeps a Cypher-only PR inside the lint job.
    # cypher_linter.py lints standalone .cypher files (indexes, migrations,
    # bulk-upsert templates) since 2026-07, so this filter is load-bearing.
    # js too (Codex, PR #1057): audit_font_sizes.py scans static/js/*.js — a
    # Tailwind @source tree — so a JS-only PR must still run the lint job.
    if: needs.changes.outputs.py == 'true' || needs.changes.outputs.cypher == 'true' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    # Pin every uv command in this job to the committed lock (see the mypy job
    # for the full note). `uv run` re-locks just like `uv sync`, so the flag on
    # the install step alone would not hold. Not set on dep_audit.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      # The checks below keep running after one fails (but not if setup itself
      # failed — `steps.fmt.outcome == 'skipped'` in that case), so a PR author
      # sees every category of violation in a single run.
      - name: Ruff format check
        id: fmt
        working-directory: app
        run: uv run ruff format --check

      - name: Ruff lint
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run ruff check

      - name: SKUEL architecture linter
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/lint_skuel.py --strict --quiet

      - name: Cypher linter
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/cypher_linter.py --errors-only --strict

      - name: Route security audit
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/audit_route_security.py

      # Publication-gate registry completeness. Asserts every surface composing a
      # gate helper is CLASSIFIED — not that it is correctly gated, which is
      # measured by tests/integration/test_publication_gate_output_invariant.py.
      - name: Publication gate registry audit
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/audit_publication_gate.py

      # Raw headers audit — H1/H2 findings are advisory; only Html(Head())
      # violations (hand-assembled documents bypassing BasePage/AuthPage) fail.
      - name: Raw headers audit
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/audit_raw_headers.py

      # Font-size audit — arbitrary text-[Npx] outside the ADR-084 exception
      # ledger. Strict since PR6 (campaign complete — burndown zero): any
      # arbitrary font size outside the pinned ledger fails the job.
      - name: Font-size audit
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/audit_font_sizes.py --strict


      # Dead-code gate — fails only on WARNING-tier findings; staged work
      # registered in the PLANNED tiers never fails (see BLOAT_DETECTION.md).
      - name: Dead-code gate
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/detect_bloat.py --check

      # Same discovery + severity as ./dev quality check 9 — shellcheck-py (dev
      # group) vendors the binary, so no apt install step is needed here.
      - name: ShellCheck (tracked shell scripts)
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/shellcheck_tracked.py

  # Dependency CVE audit: osv-scanner over BOTH locked ecosystems (uv.lock +
  # package-lock.json, all severities, accepted findings in app/osv-scanner.toml
  # with reasons + ignoreUntil expiries — ADR-067 § 6e) via the same script as
  # ./dev audit-deps and ./dev quality check 8. Gated on the py filter —
  # pyproject / uv.lock changes are what move the Python resolution, and a
  # REQUIRED-on-py-changes job also catches newly published CVEs on every
  # ordinary Python PR — plus the audit filter, which carries the JS lockfile
  # and the dispositions file, so a JS-only lock change or an audit-tooling
  # edit always exercises this job too.
  dep_audit:
    name: Dependency CVE Audit
    needs: changes
    if: needs.changes.outputs.py == 'true' || needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    # NO `env: UV_FROZEN` here, unlike every other uv job above — and this is
    # load-bearing, not an oversight. The audit script's staleness gate is
    # `uv lock --check`, and UV_FROZEN does not conflict with it loudly — it
    # silently DOWNGRADES it to a validity-only check ("only checked for
    # validity, not whether it is up-to-date", exit 0 — measured on uv 0.10.9).
    # Declared here, the required CVE gate would pass vacuously over a stale
    # lock: the PR #935 defect class with a green face. The script refuses to
    # run if either lock env var is set, and the uv-lock pinning guard
    # (tests/unit/test_workflow_uv_lock_pinning.py) enforces the absence.
    #
    # No venv, no cache, no sync: pip-audit left with the osv-scanner
    # consolidation, so the script's only uv command is that `uv lock --check`.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install osv-scanner
        uses: ./.github/actions/install-osv-scanner

      - name: Audit locked dependencies (both ecosystems)
        working-directory: app
        run: bash scripts/audit_dependencies.sh

  validate_documentation:
    name: Validate Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # allow the "Comment on PR" step to post results

    # Pin every uv command in this job to the committed lock (see the mypy job
    # for the full note). `uv run` re-locks just like `uv sync`, so the flag on
    # the install step alone would not hold. Not set on dep_audit.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for accurate freshness checks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      - name: Check documentation freshness (critical only)
        id: freshness
        working-directory: app
        run: |
          echo "Running documentation freshness check..."
          uv run python scripts/docs_freshness.py --critical-only || echo "freshness_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Validate skills metadata
        id: skills
        working-directory: app
        run: |
          echo "Running skills metadata validation..."
          uv run python scripts/skills_validator.py || echo "skills_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      # The drift test (tests/unit/scripts/test_generate_cross_reference_index.py)
      # lives in unit_tests, which the `py` filter gates — but this generator's
      # inputs are doc-side (skills_metadata.yaml + docs/patterns/*.md frontmatter
      # + the artifact itself), all reachable by a docs-only PR that skips
      # unit_tests entirely. Its sibling artifacts solved this by joining the `py`
      # filter, which works for one file each; here the input set is a whole docs
      # directory, and putting docs/patterns/** into `py` would erode the
      # deliberate docs-only skip wholesale. So the SAME test file runs here — the
      # full file, not a bare `--check` byte-compare, because the honesty guards
      # catch doc-side corruption a byte-compare cannot: a pattern doc whose YAML
      # breaks is dropped from the render silently, leaving the artifact "fresh"
      # while the mapping is lost (Codex P2 x2, PR #1213).
      - name: Check CROSS_REFERENCE_INDEX drift
        id: xref_drift
        working-directory: app
        run: |
          echo "Running the CROSS_REFERENCE_INDEX drift + honesty guards..."
          uv run pytest tests/unit/scripts/test_generate_cross_reference_index.py -q --no-cov || echo "xref_drift_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for broken documentation links (optional)
        id: broken_links
        working-directory: app
        run: |
          echo "Checking for broken links..."
          # Count missing references in freshness output
          MISSING=$(uv run python scripts/docs_freshness.py --json | python -c "import sys, json; data = json.load(sys.stdin); print(data.get('missing_refs_count', 0))")
          echo "Found $MISSING broken link(s)"

          if [ "$MISSING" -gt 10 ]; then
            echo "⚠️ Warning: $MISSING broken documentation links found"
            echo "broken_links_warning=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Generate review schedule
        id: review
        working-directory: app
        run: |
          echo "Generating documentation review schedule..."
          OVERDUE=$(uv run python scripts/docs_review_scheduler.py --json | python -c "import sys, json; data = json.load(sys.stdin); print(data.get('overdue_docs', 0))")
          echo "Found $OVERDUE overdue documentation(s)"

          if [ "$OVERDUE" -gt 0 ]; then
            echo "📅 $OVERDUE document(s) are overdue for review"
            uv run python scripts/docs_review_scheduler.py
          fi
        continue-on-error: true

      - name: Comment on PR with results
        # Only comment when there is something to report — a clean docs PR is
        # covered by the green check, no comment needed (avoids per-push spam).
        if: >-
          github.event_name == 'pull_request' &&
          (steps.freshness.outputs.freshness_failed == 'true' ||
          steps.skills.outputs.skills_failed == 'true' ||
          steps.xref_drift.outputs.xref_drift_failed == 'true' ||
          steps.broken_links.outputs.broken_links_warning == 'true')
        continue-on-error: true  # never red the job if commenting is unavailable (e.g. fork PRs)
        uses: actions/github-script@v9
        with:
          script: |
            const freshnessStatus = '${{ steps.freshness.outputs.freshness_failed }}' === 'true' ? '❌' : '✅';
            const skillsStatus = '${{ steps.skills.outputs.skills_failed }}' === 'true' ? '❌' : '✅';
            const xrefStatus = '${{ steps.xref_drift.outputs.xref_drift_failed }}' === 'true' ? '❌' : '✅';
            const brokenLinksWarning = '${{ steps.broken_links.outputs.broken_links_warning }}' === 'true';

            let comment = `## Documentation Quality Checks\n\n`;
            comment += `${freshnessStatus} **Documentation Freshness** (critical issues only)\n`;
            comment += `${skillsStatus} **Skills Metadata Validation**\n`;
            comment += `${xrefStatus} **CROSS_REFERENCE_INDEX Drift**\n`;

            if (brokenLinksWarning) {
              comment += `\n⚠️ **Warning**: More than 10 broken documentation links found\n`;
            }

            comment += `\n---\n`;
            comment += `<details>\n<summary>View detailed results</summary>\n\n`;
            comment += `Run \`uv run python scripts/docs_freshness.py\` locally for full freshness report.\n`;
            comment += `Run \`uv run python scripts/skills_validator.py\` locally for validation details.\n`;
            comment += `</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if critical issues found
        # Blocks on documentation-freshness OR skills-validation errors. Both
        # steps run with continue-on-error so the PR-comment step above can
        # report them first; this step is the single chokepoint that reds the
        # job. The validator exits non-zero only on errors (not soft warnings),
        # so the 500-line monolith cap etc. still pass — same errors-vs-warnings
        # split as ./dev quality.
        if: >-
          steps.freshness.outputs.freshness_failed == 'true' ||
          steps.skills.outputs.skills_failed == 'true' ||
          steps.xref_drift.outputs.xref_drift_failed == 'true'
        run: |
          freshness_failed="${{ steps.freshness.outputs.freshness_failed }}"
          skills_failed="${{ steps.skills.outputs.skills_failed }}"
          xref_drift_failed="${{ steps.xref_drift.outputs.xref_drift_failed }}"
          echo "Documentation freshness: $([ "$freshness_failed" == "true" ] && echo '❌ FAILED' || echo '✅ passed')"
          echo "Skills validation:       $([ "$skills_failed" == "true" ] && echo '❌ FAILED' || echo '✅ passed')"
          echo "CROSS_REFERENCE_INDEX:   $([ "$xref_drift_failed" == "true" ] && echo '❌ STALE' || echo '✅ fresh')"
          echo ""
          if [ "$freshness_failed" == "true" ]; then
            echo "::error::Critical documentation freshness issues found"
            echo "  Run locally: uv run python scripts/docs_freshness.py --critical-only"
          fi
          if [ "$skills_failed" == "true" ]; then
            echo "::error::Skills validation errors found (.claude/skills/*/SKILL.md)"
            echo "  Run locally: uv run python scripts/skills_validator.py"
          fi
          if [ "$xref_drift_failed" == "true" ]; then
            echo "::error::CROSS_REFERENCE_INDEX drift/honesty guards failed"
            echo "  Run locally: uv run pytest tests/unit/scripts/test_generate_cross_reference_index.py"
            echo "  If merely stale: uv run python scripts/generate_cross_reference_index.py"
          fi
          exit 1

  # Documentation metrics — main pushes only (skipped on PRs, as before).
  documentation_metrics:
    name: Generate Metrics
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Pin every uv command in this job to the committed lock (see the mypy job
    # for the full note). `uv run` re-locks just like `uv sync`, so the flag on
    # the install step alone would not hold. Not set on dep_audit.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        working-directory: app
        run: uv sync --frozen --no-install-project

      - name: Generate documentation metrics
        working-directory: app
        run: |
          echo "# Documentation Metrics" > docs_metrics.md
          echo "" >> docs_metrics.md
          echo "Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> docs_metrics.md
          echo "" >> docs_metrics.md

          # Freshness metrics
          echo "## Freshness Status" >> docs_metrics.md
          uv run python scripts/docs_freshness.py --json > freshness.json
          python -c "
          import json
          with open('freshness.json') as f:
              data = json.load(f)
          print(f'- Total docs tracked: {data[\"total_docs\"]}')
          print(f'- Stale docs: {data[\"stale_docs\"]}')
          print(f'- Fresh docs: {data[\"fresh_docs\"]}')
          print(f'- Code-based: {data[\"code_based_docs\"]}')
          print(f'- Conceptual: {data[\"conceptual_docs\"]}')
          print(f'- Hybrid: {data[\"hybrid_docs\"]}')
          " >> docs_metrics.md
          echo "" >> docs_metrics.md

          # Skills metrics
          echo "## Skills Status" >> docs_metrics.md
          uv run python scripts/skills_validator.py --json > skills.json
          python -c "
          import json
          with open('skills.json') as f:
              data = json.load(f)
          print(f'- Total skills: {data[\"total_skills\"]}')
          print(f'- Checks passed: {data[\"passed_checks\"]}/{data[\"total_checks\"]}')
          print(f'- Errors: {len([e for e in data[\"errors\"] if e[\"severity\"] == \"error\"])}')
          print(f'- Warnings: {data[\"warnings\"]}')
          " >> docs_metrics.md
          echo "" >> docs_metrics.md

          # Review schedule
          echo "## Review Schedule" >> docs_metrics.md
          uv run python scripts/docs_review_scheduler.py --json > review.json
          python -c "
          import json
          with open('review.json') as f:
              data = json.load(f)
          print(f'- Total tracked docs: {data[\"total_tracked_docs\"]}')
          print(f'- Overdue: {data[\"overdue_docs\"]}')
          print(f'- Upcoming (30 days): {data[\"upcoming_docs\"]}')
          print(f'- Current: {data[\"current_docs\"]}')
          " >> docs_metrics.md

          cat docs_metrics.md

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation-metrics
          path: app/docs_metrics.md
          retention-days: 90

  unit_tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    # Pin every uv command in this job to the committed lock (see the mypy job
    # for the full note). `uv run` re-locks just like `uv sync`, so the flag on
    # the install step alone would not hold. Not set on dep_audit.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      - name: Run unit tests
        working-directory: app
        run: uv run pytest tests/unit/ -x --tb=short -q

  # Integration tests — the only tier that executes real Cypher against Neo4j
  # (unit tests mock the driver). Runs the same command as ./dev test-integration:
  # testcontainers spins up the pinned neo4j image via the runner's Docker daemon
  # (preinstalled on ubuntu-latest). addopts is cleared to skip coverage collection,
  # matching scripts/run_tests.py — pass rate is the quality metric here.
  integration_tests:
    name: Integration Tests
    needs: changes
    if: >-
      needs.changes.outputs.py == 'true' || needs.changes.outputs.cypher == 'true'
      || needs.changes.outputs.neo4j_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25  # testcontainer startup can hang on daemon issues; suite itself is ~2-4 min
    # Pin every uv command in this job to the committed lock (see the mypy job
    # for the full note). `uv run` re-locks just like `uv sync`, so the flag on
    # the install step alone would not hold. Not set on dep_audit.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      - name: Run integration tests
        working-directory: app
        run: uv run pytest tests/integration/ -x --tb=short -q --override-ini=addopts=

  smoke:
    name: Render Smoke Test
    needs: changes
    if: needs.changes.outputs.py == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # Pin every uv command in this job to the committed lock (see the mypy job
    # for the full note). `uv run` re-locks just like `uv sync`, so the flag on
    # the install step alone would not hold. Not set on dep_audit.
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      # google-chrome-stable is preinstalled on GitHub ubuntu-latest runners.
      - name: Show Chrome version
        run: google-chrome-stable --version

      # Renders the unauthenticated pages (no server / no Neo4j) and loads them in
      # headless Chrome — fails if any page never reaches idle (infinite JS loop /
      # runaway sync work, e.g. the lucide MutationObserver freeze).
      - name: Run render smoke test
        working-directory: app
        run: uv run python scripts/smoke_test.py

  js_tests:
    name: JS Tests
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 24 (LTS). Range, not bare '24', so setup-node cannot select an
          # older cached 24.0–24.14 (check-latest is false) below jsdom 30's
          # ^24.15.0 floor — mirrors engines.node exactly. Moves in lockstep with
          # dependency-audit.yml's js_audit job (ADR-067 § 2 / § 6c). Keeps jsdom
          # on 30 / undici on 8.x.
          node-version: '^24.15.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Vitest over static/js (PR #717): skuel.js evaluated in jsdom via the
      # tests/js/helpers/load-skuel.js harness. Runs in ~1s, no Docker.
      - name: Run vitest suite
        working-directory: app
        run: npm run test:js

  # Compiled-CSS freshness (ADR-084): output.css is a committed build artifact
  # loaded directly in production, so any change to input.css or the scanned
  # class-bearing trees must ship its recompile in the same PR. Recompiles and
  # fails on drift — a stale output.css silently drops newly-used utilities.
  css_freshness:
    name: CSS Freshness
    needs: changes
    if: needs.changes.outputs.css == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same pin rationale as js_tests: range form mirrors engines.node,
          # moves in lockstep with dependency-audit.yml (ADR-067 § 2 / § 6c).
          node-version: '^24.15.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Rebuild production CSS
        working-directory: app
        run: npm run css:prod

      - name: Verify committed output.css is fresh
        working-directory: app
        run: git diff --exit-code -- static/css/output.css

  # Deliberately NOT gated by the `changes` path filter: a content-only PR (e.g.
  # a force-added app/docs/content/*.md or app/data/user_vaults/*.md, with no
  # Python change) would skip the py-gated jobs, so the boundary must be checked
  # unconditionally on every PR. Stdlib + git only — no venv/uv install needed.
  content_boundary:
    name: Content Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Content boundary guard
        working-directory: app
        run: python scripts/audit_content_boundary.py

      # Untracked-reference guard — nothing tracked may cite the gitignored
      # plans/ scratch tier (CLAUDE.md § Documentation Architecture). It lives in
      # THIS always-on job rather than lint on purpose: it scans every tracked
      # file, and a citation can land in a .md, a docstring, or .envrc alike.
      # Under lint's `py` filter a docs-only PR would skip it — precisely the
      # blind spot that let 13 docs-side citations accumulate unnoticed.
      # Stdlib-only, so bare `python` is enough (same as the guard above).
      - name: Untracked-reference guard
        working-directory: app
        run: python scripts/audit_untracked_refs.py

  # Always-on aggregator. This is the single status to mark required in branch
  # protection. Passes when every required job succeeded OR was legitimately
  # skipped (path not touched); fails on ANY other result value.
  gate:
    name: CI Gate
    needs: [changes, mypy, lint, dep_audit, validate_documentation, unit_tests, integration_tests, smoke, content_boundary, js_tests, css_freshness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          results=(
            "changes=${{ needs.changes.result }}"
            "mypy=${{ needs.mypy.result }}"
            "lint=${{ needs.lint.result }}"
            "dep_audit=${{ needs.dep_audit.result }}"
            "validate_documentation=${{ needs.validate_documentation.result }}"
            "unit_tests=${{ needs.unit_tests.result }}"
            "integration_tests=${{ needs.integration_tests.result }}"
            "smoke=${{ needs.smoke.result }}"
            "content_boundary=${{ needs.content_boundary.result }}"
            "js_tests=${{ needs.js_tests.result }}"
            "css_freshness=${{ needs.css_freshness.result }}"
          )
          echo "${results[*]}"
          # ALLOW-LIST: only 'success' and 'skipped' pass — 'skipped' is a job
          # whose path filter did not match, and must stay green or docs-only
          # PRs deadlock. EVERYTHING else fails: 'failure', 'cancelled', an
          # empty result (a job that never reported), and any value GitHub adds
          # later. The previous check was a deny-list over the two known bad
          # literals, so when the 2026-08-06 Actions outage killed `changes`
          # with the undocumented result 'abandoned' — skipping every gated job
          # — the gate greenlighted zero coverage (PR #967). The failing job
          # and its literal value are named so the next unknown result
          # diagnoses itself from this step's log.
          failed=0
          for entry in "${results[@]}"; do
            job="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Required job '${job}' did not pass: needs.${job}.result='${result}' (only 'success' or 'skipped' may pass the gate)"
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CI Gate passed — all required jobs succeeded or were skipped."
