description: |
  Purity of body, mind, and environment. Saucha starts with the obvious — clean your room, eat real food, move your body. Then it goes deeper: clean up your thinking. Notice mental clutter, gossip, noise. A clear space supports a clear mind. This is the first niyama because everything else builds on a foundation that isn't polluted.
