name: Codex Review Gate

# ============================================================================
# Required merge gate enforcing Codex review on app-code (Python) PRs.
#
# TWO-TIER GATE:
#   Tier 1 — Python files changed: gate is RED until `codex-considered` label
#     is applied, regardless of whether `@codex review` was posted. Codex
#     review is mandatory for any PR touching .py files.
#   Tier 2 — No Python files (docs/tooling only): gate passes unless a human
#     posted `@codex review` and it hasn't been considered yet. No friction on
#     routine non-code PRs.
#
# Codex is ADVISORY — the gate requires its review was *considered*, never that
# it was *agreed with*. Claude (the LLM) arbitrates what is actually true and
# clears the gate by:
#   1. reading the Codex review (via scripts/request_codex_review.sh <PR#>),
#   2. posting a short "Codex consideration" note (accept / reject + why),
#   3. applying the label:  gh pr edit <PR#> --add-label codex-considered
# A new commit drops the label (changed code must be re-considered).
#
# WHY A COMMIT STATUS (not a job check-run): the gate must react to the
# `@codex review` comment, i.e. the `issue_comment` event. A job's check-run
# from an issue_comment run does NOT attach to the PR's head commit, so branch
# protection wouldn't see it — but a status POSTed to the head SHA does. So the
# required context `Codex Review Gate` is published as a commit status here; the
# `evaluate` job's own check-run is incidental and not required.
#
# NOTE: `main` keeps admin-bypass, so this is a strong, visible, auditable gate
# and discipline, not an unbreakable lock. Set enforce_admins=true for a hard
# lock (also blocks legitimate bypasses, e.g. a Kody billing failure).
# ============================================================================

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write        # POST the "Codex Review Gate" commit status
  pull-requests: write   # drop the considered-label on new commits

jobs:
  evaluate:
    name: evaluate   # incidental — the REQUIRED context is the commit status posted below
    # issue_comment fires on issues too; only act on PR comments.
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Codex Review Gate
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;

            // A new commit invalidates any prior consideration — drop the label.
            if (context.eventName === 'pull_request' && context.payload.action === 'synchronize') {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: 'codex-considered',
                });
              } catch (e) { /* label not present — fine */ }
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            const sha = pr.head.sha;
            const considered = (pr.labels || []).some(l => l.name === 'codex-considered');

            // Was a Codex review REQUESTED by a human? Exclude bot authors — the
            // Codex connector's own footer contains the literal "@codex review".
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const requested = comments.some(c =>
              c.user && c.user.type === 'User' && /@codex\s+review/i.test(c.body || '')
            );

            // Does this PR touch Python (app-code) files? If so, Codex review
            // is mandatory — the gate is RED until codex-considered is applied,
            // regardless of whether @codex review was explicitly posted.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const hasPythonFiles = files.some(f => f.filename.endsWith('.py'));

            let state, description;
            if (considered) {
              state = 'success';
              description = 'Codex review considered (codex-considered label set).';
            } else if (requested) {
              // Codex was summoned but the verdict hasn't been read yet.
              state = 'failure';
              description = 'Codex review requested — read it, then add the codex-considered label.';
            } else if (hasPythonFiles) {
              // Python files changed: Codex review is required even if not yet requested.
              state = 'failure';
              description = 'Python files changed — run scripts/request_codex_review.sh to summon Codex before merging.';
            } else {
              // Docs/tooling only: no Codex request → gate passes.
              state = 'success';
              description = 'No Python files changed and no Codex review requested — gate not applicable.';
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state,
              context: 'Codex Review Gate',
              description,
            });
            core.info(`Codex Review Gate → ${state}: ${description}`);
