# Enhanced pyproject.toml for SKUEL with Type Safety
# Builds on existing configuration while adding enhanced type checking

[project]
name = "skuel"
version = "1.0"
description = "Knowledge Graph w/ Search + Sync"
authors = [{name = "MCF", email = "mcf@example.com"}]
requires-python = ">=3.14,<4.0"

dependencies = [
    # Web Framework
    "python-fasthtml>=0.14.3",
    "uvicorn>=0.51.0",
    # Database — pinned for operational stability.
    # The driver version is DECOUPLED from the server version: the server runs the
    # Neo4j calendar line (today neo4j:2026.06.0, ADR-067 § 3a); this last-5.x driver
    # is Bolt-forward-compatible with 2026.x servers (verified live). Bumping the
    # driver is a normal latest-stable upgrade (test against the pinned server);
    # moving to the 6.x driver is a deliberate migration (ADR-worthy), not a routine
    # bump. See docs/decisions/ADR-067-dependency-upgrade-policy.md §§ 3, 3a.
    "neo4j==5.26.0",
    # AI/LLM Integration
    # No LangChain: SKUEL talks to the provider SDKs directly behind ChatCompletionPort /
    # EmbeddingClientOperations (ADR-063), and retrieval is hand-written parameterized Cypher
    # below UniversalNeo4jBackend rather than LLM-generated (text2cypher) — see
    # docs/roadmap/askesis-tool-selection-queries.md for why. Four declared-but-never-imported
    # langchain-* packages were removed 2026-07-27.
    "openai>=2.41.0",
    # Configuration & Environment
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Content Processing
    "pyyaml>=6.0.3",
    "python-frontmatter>=1.3.0",
    "markdown>=3.10.2",
    # Logging
    "structlog>=25.5.0",
    # File operations for FastHTML
    "aiofiles>=25.1.0",
    # Enhanced Type Safety Dependencies
    "typing-extensions>=4.16.0",
    "anthropic>=0.105.2",
    "rdflib>=7.6.0",
    "psutil>=7.2.2",
    # INTENTIONAL CAP — Deepgram 5.x+ is a breaking SDK rewrite; stay on 4.x
    # until a deliberate migration. See ADR-067 § Pins.
    "deepgram-sdk>=4.8.1,<5.0.0",
    # Security Dependencies
    "cryptography>=50.0.0",
    # Vault-agent WS client (ADR-075 B3) — direct dep, not a transitive ride on
    # deepgram/fastmcp; agent/skuel_vault_agent.py + its unit tests import it.
    "websockets>=16.1.1",
    "python-slugify>=8.0.4",
    "bcrypt>=5.0.0",
    "weasyprint>=69.0",
    "prometheus-client>=0.25.0",
    "resend>=2.30.1",
    "huggingface-hub>=1.18.0",
    # Firefly III REST client (ADR-051)
    "httpx>=0.28.1",
    # Stripe webhook signature verification (ADR-051)
    "stripe>=15.2.0",
    "keyring>=25.7.0",
    # Embeddings-adapter deps — direct, NOT a transitive ride. Both were previously
    # supplied only by the (unused) langchain-* tree; removing it exposed them as
    # undeclared. numpy: adapters/external/embeddings/huggingface_adapter.py:33.
    # tenacity (@retry on the embedding calls): huggingface_adapter.py:35 +
    # openai_adapter.py:33. Declared 2026-07-27 — do not drop as "unused".
    "numpy>=2.4.6",
    "tenacity>=9.1.4",
]

[project.scripts]
skuel = "skuel:app"
skuel-dev = "start_dev:run"

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mypy>=1.0.1",
    # Code Quality with Enhanced Type Checking
    "black>=26.5.1",
    "isort>=8.0.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    # Development Tools
    "jupyter>=1.1.1",
    "ipython>=9.15.0",
    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
    "testcontainers>=4.14.2",
    "mcp-neo4j-cypher>=0.6.0",
    "types-requests>=2.33.0.20260712",
    "types-markdown>=3.10.2.20260712",
    # CommonMark parser backing scripts/health/dead_doc_links.py's fenced-code pass.
    # Dev-only: that checker runs from `./dev health-links`, never in the app. Declared
    # direct rather than leaned on transitively (it arrives via rich) — a hand-written
    # fence walker accrued 5 container-handling bugs in review (PR #872), and CommonMark
    # container rules are a parser's job. Python-Markdown (`markdown`, a main dep) is not
    # a substitute: it exposes no per-fence source line map.
    "markdown-it-py>=4.2.0",
    # PyYAML ships no inline types; 6 files in MyPy's scope import `yaml`. Previously
    # supplied transitively by neo4j-graphrag <- langchain-neo4j; declared direct
    # 2026-07-27 when that tree was removed. Dropping it fails the CI MyPy job.
    "types-pyyaml>=6.0.12.20260518",
    "vulture>=2.16",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    # Vendors the official ShellCheck binary as a wheel — `uv run shellcheck` works
    # with no system package, same toolchain locally and in CI. Backs quality check 9.
    "shellcheck-py>=0.11.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
# Lint/format syntax target intentionally LAGS the runtime (requires-python = 3.14).
# Bumping to py314 triggers a codebase-wide annotation modernization (UP037/TC rules);
# that sweep is a separate, deliberate change. See ADR-067 § Deferred: py314 lint sweep.
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

# ============================================================================
# ENHANCED MYPY CONFIGURATION - Catches double-wrap bugs automatically
# ============================================================================

[tool.mypy]
# Core Python version and strictness
python_version = "3.14"
# PRAGMATIC STRICTNESS: Strict where it matters, lenient for models
strict = false  # Use per-module overrides instead
explicit_package_bases = true

# Pydantic plugin - teaches MyPy how to handle Field(default=...) properly
# This eliminates ~400 false-positive "missing argument" errors for Pydantic models
plugins = ["pydantic.mypy"]

# Core checks enabled globally
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

# Lenient global defaults (overridden per-module)
disallow_untyped_defs = false  # Only enforce in critical modules
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false  # FastHTML routes
warn_unused_ignores = true
warn_no_return = false  # Too noisy
warn_return_any = false  # Only enforce in critical modules
warn_unreachable = false  # Conflicts with the __post_init__ sentinel-default pattern and Neo4j JSON-string boundary in core/models/*. See: core/models/entity.py:82, core/models/exercises/exercise.py:89.

# No error codes are globally disabled. arg-type is enforced on all first-party
# trees (see the per-module note below); tests/scripts scope-disable it.

# Allow Any for flexibility
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false  # Only enforce in critical modules
disallow_subclassing_any = false

# Protocol and typing enhancements
show_error_codes = true
error_summary = true
pretty = true
show_column_numbers = true
show_error_context = true

# Files to check (gradual migration strategy)
files = ["core", "adapters", "main.py", "services_bootstrap", "ui", "agent"]
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "__pycache__/",
    ".*\\.egg-info/",
    "tests/fixtures/",
    ".*/archive/.*",
    "z_archives/.*",
    "legacy/.*",
    ".*_old\\.py$",  # Archived service files (deprecated code)
]

# Per-module configuration for SKUEL-specific patterns

# arg-type is ENFORCED on all four first-party trees — core, services_bootstrap,
# adapters, ui — globally enabled (the global disable_error_code was deleted above)
# as of 2026-05-31, after each was swept to 0 across PRs #104–149. The former
# per-module `enable_error_code = ["arg-type"]` overrides are gone (redundant once
# global). arg-type is the mechanical enforcement layer of SKUEL's functional
# direction (frozen models, Result[T], typed payloads — ADR-035/ADR-065); see
# docs/roadmap/functional-direction.md. The only scoped EXCEPTIONS are the
# tests.*/scripts.* blocks below (framework-mock noise, never swept; the
# suppression audit re-measures the counts weekly).

[[tool.mypy.overrides]]
# Core ports — strict typing enforced (0 untyped defs as of 2026-03-27).
# warn_return_any added 2026-05-16 after fixing 10 no-any-return errors in
# content_protocols.py (getattr() → cast). Protocols are the contract;
# silent Any returns defeat the type system at the most important boundary.
module = ["core.ports.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# Core auth — warn_return_any enforced (added 2026-05-16). Auth is a
# security-critical boundary; silently propagating Any through Result
# returns hides type-mismatch bugs. Fixed 17 occurrences of cross-type
# Result propagation (`return some_result` → `return Result.fail(some_result)`,
# per CLAUDE.md error-handling guidance).
module = ["core.auth.*"]
warn_return_any = true

[[tool.mypy.overrides]]
# Core services - gradual strictness migration
module = ["core.services.*"]
disallow_any_generics = false  # Too many existing violations
disallow_untyped_defs = false  # 94 untyped defs remain — enable incrementally
warn_return_any = false  # Too noisy
check_untyped_defs = true
disallow_any_decorated = false  # Too strict for FastHTML

[[tool.mypy.overrides]]
# Result pattern infrastructure - CRITICAL for type safety
module = ["core.utils.result_simplified", "core.utils.error_boundary"]
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Core models and infrastructure - medium strictness
module = ["core.models.*", "core.infrastructure.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
check_untyped_defs = true
disallow_any_generics = false  # Allow untyped generics in models

[[tool.mypy.overrides]]
# Utility modules - lenient for generic helper functions
module = ["core.utils.*"]
disallow_untyped_defs = false
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
# UI modules - lenient (no py.typed markers in fasthtml/fastcore).
# warn_unreachable=true: ui/ doesn't construct domain models, so it avoids
# the __post_init__ sentinel + Neo4j JSON-string patterns that make
# warn_unreachable unworkable in core/models/*. See pyproject.toml:154.
module = ["ui.*"]
disallow_untyped_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unreachable = true
# No disable_error_code: `import-untyped` was suppressed here and measured 0 errors
# (PR #876) — a code that suppresses nothing only hides the FIRST real one.

[[tool.mypy.overrides]]
# Bootstrap: no frozen-dataclass post-init normalization or Neo4j
# JSON-string boundary here, so warn_unreachable catches dead defensive
# code without false positives. See pyproject.toml:154 for why this is
# scoped per-module rather than enabled globally.
module = ["services_bootstrap.*"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Events and protocols - lenient (auto-generated patterns)
module = ["core.events.*"]
disallow_untyped_defs = false
warn_return_any = false
# `call-arg` and `no-untyped-def` were suppressed here and measured 0 errors each
# (PR #876). `disallow_untyped_defs = false` above already covers the untyped-def
# leniency this block wanted; the codes only stood to hide the first real violation.

[[tool.mypy.overrides]]
# Domain backends — an MRO conflict from composing the relationship mixins via
# UniversalNeo4jBackend. The overlapping signatures work correctly at runtime.
# Measured backlog (`./dev health-mypy`, 2026-08-09): misc 8 — every one of them
# `get_related_entities` declared incompatibly across _RelationshipQueryMixin and
# _RelationshipOrderedMixin, in activity_backends (6) and curriculum_backends (2).
# Five more cluster modules (exercise/sharing/forms/collab/misc_backends) were
# listed here until 2026-08-09; each measured 0 [misc] and left the list — the
# audit now verifies every pattern's membership, and a member earning nothing
# only stands to eat that module's first real violation.
# The former figure here was "~42 false positives" across a different mixin set
# (_CrudMixin/_UserEntityMixin/_SearchMixin/_TraversalMixin/_RelationshipCrudMixin,
# on create/get/update/delete/list/create_relationship); that conflict no longer
# occurs.
module = [
    "adapters.persistence.neo4j.backends.activity_backends",
    "adapters.persistence.neo4j.backends.curriculum_backends",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# FastHTML modules - allow some flexibility for framework usage
module = ["adapters.*"]
disallow_any_generics = false
disallow_untyped_decorators = false
# Still catch Result issues
warn_return_any = true

[[tool.mypy.overrides]]
# External dependencies that may not have full typing
module = [
    "neo4j.*",
    "fasthtml.*",
    "openai.*",
    "deepgram.*",
    "anthropic.*",
    "huggingface_hub.*",
    "vulture.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Tests — check_untyped_defs enforced (2026-05-17).
# Rationale: pytest verifies runtime behavior, but a test that constructs a
# wrong-typed DTO (e.g. stale kwargs after a model refactor) passes locally
# only because the test never exercised that path — MyPy catches the
# construction site itself. We keep disallow_untyped_defs=false (tests don't
# need return annotations on every fixture) but turn on body-level checking.
#
# Disabled error codes (all inherent to the test context):
#   method-assign  — tests monkey-patch service methods with Mock/AsyncMock,
#                    which mypy correctly flags but the pattern is unavoidable.
#   type-var       — tests parameterize generics with DTOs (EntityDTO et al.)
#                    that don't satisfy the production bound; fine for fixtures.
#   misc           — test doubles that monkey-patch read-only model properties,
#                    call unbound methods on stub harnesses, and untyped
#                    generator fixtures (measured 2026-08-09: 24 sites).
#   arg-type       — tests construct wrong-typed DTOs/mocks freely; never in the
#                    sweep's scope. The four first-party trees (core,
#                    services_bootstrap, adapters, ui) enforce arg-type.
# Measured (`./dev health-mypy`, 2026-08-09): arg-type 2449,
# method-assign 123, type-var 33, misc 24. Until 2026-08-09 this block also
# covered examples.* (every code measured 0 — the pattern left the block, so
# examples/ now carries full global enforcement) and scripts.* (split into its
# own block below with the narrower list it actually earns).
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false  # too noisy for fixture helpers
warn_unused_ignores = false  # tests use # type: ignore liberally for mocks
disable_error_code = ["method-assign", "type-var", "misc", "arg-type"]

[[tool.mypy.overrides]]
# Scripts — same body-level-checking rationale as tests.*, split out 2026-08-09
# because scripts earn a NARROWER disable list: type-var measured 0 here, so it
# is enforced (a code a pattern doesn't earn only stands to eat its first real
# violation). The other leniencies inherit the global table; only the ignore
# leniency is carried over.
# Measured (`./dev health-mypy`, 2026-08-09): arg-type 154, misc 2,
# method-assign 1.
module = ["scripts.*"]
warn_unused_ignores = false  # one-shot scripts mock and ignore liberally
disable_error_code = ["method-assign", "misc", "arg-type"]

# ============================================================================
# PYDANTIC-MYPY PLUGIN CONFIGURATION
# ============================================================================
# The plugin is loaded in [tool.mypy] above (`plugins = ["pydantic.mypy"]`).
# Without this section `init_typed` defaults to False, and the plugin
# synthesises every `BaseModel.__init__` with `Any` for every field — which
# means NOT ONE constructor call to ANY Pydantic model is type-checked
# anywhere in the tree. The plugin was carrying only half its weight: it
# silenced the ~400 false-positive "missing argument" errors on
# `Field(default=...)` while silently disabling argument checking on the very
# models it was loaded to help.
#
# Enabled 2026-08-03. Measured cost of the flip: exactly ONE error tree-wide
# across 2043 source files (tests/unit/test_search_visibility_scoping.py, a
# deliberate raw-string boundary probe — suppressed in place with a reason).
# Positive control, proving the setting is not inert (run 2026-08-03, both
# directions): injecting `title=12345` into the `HabitCreateRequest(...)` call
# in core/services/dsl/activity_domain_converters.py is CAUGHT with
# init_typed=true (arg-type) and is completely INVISIBLE with it false. The
# false run reports "Success: no issues found in 2043 source files" with the
# bad literal sitting in core/ — that is what this codebase looked like before
# this section existed. Re-run that flip before ever relaxing this setting;
# a green mypy alone is not evidence the plugin is checking anything.
#
# Scope note: `arg-type` is disabled for tests/examples/scripts (block above),
# so init_typed's reach there is limited to codes that survive that disable
# (list-item, call-arg, ...). Full enforcement is on the four first-party trees.
[tool.pydantic-mypy]
init_typed = true

# ============================================================================
# PYRIGHT CONFIGURATION
# ============================================================================
# Complements MyPy. The differentiator is reportAttributeAccessIssue +
# reportPossiblyUnboundVariable — pyright catches missing protocol attributes
# and branch-bound variables that mypy's defaults let through. `arg-type` is now
# enforced by mypy on `core/` (per-module override above, re-enabled 2026-05-29)
# but remains globally disabled for the un-swept trees (adapters/ui/
# services_bootstrap/tests/scripts); pyright's reportArgumentType is the
# cross-tree backstop for argument-type mismatches outside core/.
#
# Mode is "basic" + selectively-elevated rules. Strict mode floods on Result[T]
# inference (12k+ reportUnknown* warnings); basic mode + targeted rules is
# what actually pays for itself on this codebase.
#
# Invoke: `./dev quality` (gating) or `./dev typecheck-strict` (pyright alone).
# Baseline as of 2026-05-19: 0 errors, ~872 warnings — entirely reportArgumentType
# from MonsterUI / FastHTML missing-py.typed framework noise. All other warning
# categories (reportCallIssue, reportReturnType, reportAssignmentType, etc.) are
# at 0; the 78 real-signal warnings present on 2026-05-18 were resolved by
# fixing the underlying type issues, not by suppression.
# See: docs/patterns/linter_rules.md § Pyright

[tool.pyright]
include = ["core", "adapters", "main.py", "services_bootstrap", "ui"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scripts",
    "**/archive/**",
    "z_archives",
    "**/_old.py",
]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportMissingImports = "none"   # mypy owns import resolution

# Errors — high-value, low-noise (pyright catches what mypy misses)
reportAttributeAccessIssue = "error"
reportPossiblyUnboundVariable = "error"
reportInvalidStringEscapeSequence = "error"
reportInvalidTypeArguments = "error"

# Warnings — useful signal but framework-noisy (MonsterUI Button etc.)
reportArgumentType = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalOperand = "warning"
reportUnusedExpression = "warning"
reportRedeclaration = "warning"

# Silenced — Result[T] noise + FastHTML/MonsterUI lack py.typed markers
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedClassDecorator = "none"
reportUntypedBaseClass = "none"
reportPrivateUsage = "none"
reportGeneralTypeIssues = "none"          # mypy owns the catch-all
reportTypedDictNotRequiredAccess = "none" # noisy on intentional .get() patterns

# ============================================================================
# PYTEST CONFIGURATION - Enhanced for type safety testing
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add project root to Python path (for package-mode = false projects)
pythonpath = ["."]

# Coverage configuration
# Note: --cov-fail-under removed because different test types have different coverage expectations
# - Integration tests: Focus on core/services (high coverage expected)
# - Service tests: Include core + adapters (medium coverage expected)
# - Full suite: Includes ui/ + services_bootstrap/ (measured since 2026-07; lower
#   coverage there is expected — render code is exercised via the smoke test)
addopts = [
    "--cov=core",
    "--cov=adapters",
    "--cov=ui",
    "--cov=services_bootstrap",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # Coverage thresholds enforced per test type in run_tests.py, not globally
    "--strict-markers",
    "--strict-config",
    "-v",
    # Uncomment to enforce formatting before tests run:
    # "--ruff-format-check"
]

# Test markers for type safety testing
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "type_safety: Type safety validation tests",
    "slow: Slow running tests",
    "asyncio: Async tests"
]

# Async test configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Warning filters - suppress third-party deprecation warnings
filterwarnings = [
    # Testcontainers library uses deprecated internal patterns (as of v4.13.2)
    # These warnings come from the library itself, not SKUEL code
    # Will be fixed when testcontainers migrates to structured wait strategies
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
    "ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning:testcontainers",
    # Suppress AsyncMock internal cleanup warnings (false positives from unittest.mock)
    "ignore::RuntimeWarning:unittest.mock",
]

# ============================================================================
# COVERAGE CONFIGURATION - Track type safety coverage
# ============================================================================

[tool.coverage.run]


source = ["."]
omit = [
    "*/back_ups/*",
    "*/backup/*",
    "*/.backup/*",
    "*/backups/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/site-packages/*",
    "*/.pytest_cache/*",
    "*/tests/*",
    "*/test_*",
    "*/.git/*",
    "*/.tox/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


# ============================================================================
# RUFF CONFIGURATION - Fast linter with type checking support
# ============================================================================

[tool.ruff]
# Matches requires-python (3.14). TC002/TC003/UP037 are explicitly suppressed
# in the ignore list below to keep their deferred sweeps isolated: the TC moves
# are runtime-risky (Pydantic/FastHTML resolve annotations at runtime) and UP037
# is a ~890-site annotation-modernization sweep that belongs in its own change.
target-version = "py314"
line-length = 100
include = ["*.py", "*.pyi"]
exclude = [
    # These are DEFENSIVE: a bare name here matches at any depth, and most of these
    # directories are absent from a clean checkout by design (Docker volumes, gitignored
    # local archives). Absent-from-disk is NOT evidence an entry is dead — verified by
    # materialising each path with a file ruff must flag and re-running with the entry
    # removed. `.gitignore` covers the gitignored ones during traversal; the exclude is
    # what holds under `--no-respect-gitignore`.
    #
    # ⚠ SCOPE LIMIT: `force-exclude` is NOT set, and ruff applies `exclude` only to files
    # it discovers by traversal — NOT to paths passed explicitly on the command line. CI
    # (`ruff check .`) traverses, so it honours this list; the installed pre-commit hook
    # (scripts/git-hooks/pre-commit) pipes staged filenames through `xargs uv run ruff
    # check`, so it does NOT. A new .py added under an excluded tree would therefore block
    # a commit while passing CI. Latent today: all 12 tracked .py under these trees lint
    # clean either way. Set `force-exclude = true` if that ever bites.
    ".venv",
    "backup_archive",  # Local backup dir; shared vocabulary in scripts/quality_discovery.py —
                       # overlap + divergences pinned by tests/unit/scripts/test_quality_discovery.py
    "neo4j-import",  # Neo4j Docker container data directory (permission denied)
    "docs/archive",  # Archived/deprecated code - not actively maintained (.gitignore: **/archive/)
    "zarchives",     # Archived code - not actively maintained (.gitignore: zarchives/)
    "__pycache__",
    "migrations",    # LIVE: a bare name matches at any depth, so this covers scripts/migrations/
                     # (8 tracked .py) and tests/integration/migrations/ (4) — there is no
                     # root-level migrations/ dir. lint_skuel.py excludes only the FIRST of
                     # those, via EXCLUDED_PATH_PREFIXES ("Migration scripts document old
                     # patterns"); the two linters' exclusion sets are not identical here.
    "*.egg-info",
    ".claude/skills",  # Claude Code skills templates (documentation, not production code)
]

[tool.ruff.lint]
select = [
    # Core Python quality
    "F",     # Pyflakes - syntax errors, undefined names
    "E",     # pycodestyle (errors) - PEP 8 violations
    "W",     # pycodestyle (warnings) - PEP 8 warnings

    # Code organization
    "I",     # isort - import sorting
    "N",     # pep8-naming - naming conventions
    "UP",    # pyupgrade - modern Python syntax

    # Bug prevention
    "B",     # flake8-bugbear - likely bugs and design problems
    "SIM",   # flake8-simplify - unnecessary complexity
    "RET",   # flake8-return - return statement issues (NEW!)

    # Performance
    "PERF",  # Perflint - performance anti-patterns (NEW!)

    # Modernization
    "FURB",  # refurb - modernization suggestions (NEW!)

    # Type safety
    "TCH",   # flake8-type-checking - TYPE_CHECKING imports
    "ANN",   # flake8-annotations - type hints

    # Code quality
    "ARG",   # flake8-unused-arguments - unused function arguments
    "PTH",   # flake8-use-pathlib - prefer pathlib over os.path
    "ASYNC", # flake8-async - async/await issues
    "LOG",   # flake8-logging-format - logging best practices

    # Ruff-specific
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Type annotation flexibility (strict mode via mypy instead)
    # Note: ANN101 and ANN102 were removed from Ruff (deprecated - self/cls annotations not recommended)
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    # ANN401 (`Any` in a signature) is deliberately NOT ignored here. The default is
    # ENFORCE; trees that still carry debt buy out per-tree in the counted ledger under
    # [tool.ruff.lint.per-file-ignores]. See docs/patterns/ANY_USAGE_POLICY.md § Enforcement.

    # Complexity rules (handled by code review)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison

    # Formatting (handled by ruff format)
    "E501",    # Line too long - handled by formatter

    # Return statement rules (selective ignoring)
    "RET505",  # Unnecessary `elif` after `return` - sometimes clearer
    "RET506",  # Unnecessary `elif` after `raise` - sometimes clearer

    # Performance rules (selective ignoring)
    # None currently - all PERF rules are valuable for SKUEL

    # FURB rules (selective ignoring)
    "FURB103", # `open` and `read` can be replaced by `Path.read_text()` - sometimes less clear
    "FURB110", # `if` statement can be replaced with `any()` - sometimes less readable
    "FURB113", # `try`-`except` can be replaced with `contextlib.suppress()` - explicit better

    # Async rules (SKUEL uses asyncio, not trio/anyio)
    "ASYNC240", # Blocking pathlib in async - trivial local FS ops, no anyio dependency
    "ASYNC250", # Blocking input() in async - only in interactive scripts

    # SKUEL-specific ignores (January 2026)
    "RUF022",  # __all__ sorting - we use semantic grouping with comments
    "TC001",   # TYPE_CHECKING imports - false positives for runtime imports
    "TC002",   # move third-party import into TYPE_CHECKING — deferred py314 sweep (runtime-risky w/ Pydantic/FastHTML)
    "TC003",   # move stdlib import into TYPE_CHECKING — deferred py314 sweep (runtime-risky w/ Pydantic/FastHTML)
    "UP037",   # remove quotes from type annotations — deferred py314 sweep (~890 sites, own change)
    "UP046",   # Generic[T] syntax - keep existing pattern for compatibility
    "UP047",   # TypeVar in function signatures - keep existing pattern for consistency with UP046
]

# ============================================================================
# SKUEL ARCHITECTURE ENFORCEMENT (January 2025)
# ============================================================================
# Lambda functions: E731 is ENABLED - enforces SKUEL "no lambda" policy
# Additional SKUEL-specific rules enforced via custom scripts (see scripts/lint_skuel.py):
#   - SKUEL003: Deprecated .is_err usage (use .is_error instead)
#   - SKUEL011: hasattr() in production code (use explicit type checks)
#   - SKUEL007: String-based Result.fail() (use Errors factory)

fixable = ["ALL"]

# ============================================================================
# PHASE 8.1: SKUEL ARCHITECTURE ENFORCEMENT (October 3, 2025)
# ============================================================================
# Custom linting rules to enforce SKUEL architectural patterns:
# - Phase 5: No APOC in domain services
# - Phase 7: Semantic-first development
