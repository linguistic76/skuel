description: |
  Non-attachment — not detachment, not coldness, not giving up. Vairagya is engaging fully with life while not being owned by outcomes. You study hard but don't let the grade define you. You love deeply but don't cling. This is one of yoga's most misunderstood concepts: it's not about caring less, it's about not being controlled by what you care about.
