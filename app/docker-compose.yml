# docker-compose.yml — Unified SKUEL Development Stack
# =====================================================
# Single command to start everything: docker compose up
#
# Services: Neo4j -> SKUEL App -> Prometheus -> Grafana
#
# WORKFLOWS:
#   Full stack (Docker):     docker compose up
#   Full stack (detached):   docker compose up -d
#   Neo4j only (local dev):  docker compose up neo4j -d
#                            uv run python main.py
#   With monitoring:         docker compose --profile monitoring up
#
# Neo4j config extends infrastructure/docker-compose.yml (single source
# of truth). This file overrides only what differs for the app stack:
#   - No GenAI plugin (SKUEL uses HuggingFace Python-side per ADR-049)
#   - Memory defaults for dev environments
#   - skuel-network for inter-container communication
#
# For production deployment, see docker-compose.production.yml
# =====================================================

services:
  # --------------------------------------------------------------------------
  # Neo4j Graph Database
  # --------------------------------------------------------------------------
  # Extends infrastructure/docker-compose.yml — overrides only the deltas.
  # Volume paths resolve relative to the base file (infrastructure/neo4j/).
  # --------------------------------------------------------------------------
  neo4j:
    extends:
      file: ../infrastructure/docker-compose.yml
      service: neo4j
    environment:
      # Override: APOC only — no GenAI plugin (SKUEL uses HuggingFace Python-side)
      NEO4J_PLUGINS: '["apoc"]'
      # Override: dev-friendly memory defaults
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1500M}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      # Override: APOC meta only — no GenAI procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.meta.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.meta.*"
      # Override: clear GenAI API key (not needed without GenAI plugin)
      OPENAI_API_KEY: ""
    networks:
      - skuel-network

  # --------------------------------------------------------------------------
  # SKUEL Application
  # --------------------------------------------------------------------------
  skuel-app:
    build: .
    container_name: skuel-app
    environment:
      # Neo4j — use Docker service name, overrides .env bolt://localhost:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      # Application
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      APP_DEBUG: ${APP_DEBUG:-false}

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}

      # Paths
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-./vault}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - .:/app
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - skuel-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Prometheus — Metrics Collection
  # --------------------------------------------------------------------------
  # Scrapes /metrics from skuel-app:8000 every 15s
  # UI: http://localhost:9090
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: skuel-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - skuel-network

  # --------------------------------------------------------------------------
  # Grafana — Metrics Visualization
  # --------------------------------------------------------------------------
  # UI: http://localhost:3000 (default: admin/admin)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.0
    container_name: skuel-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - skuel-network
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  skuel-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
