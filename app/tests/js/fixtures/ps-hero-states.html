<div x-data='pathstep({"uid": "ps.test.hero", "progress_state": "mastered"})'>
  <div class="border-t border-border bg-muted/40 px-8 py-4">
    <div role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="progressPct" class="h-[5px] rounded-full bg-border overflow-hidden mb-3.5">
      <div :style="'width:' + progressPct + '%'" class="h-full rounded-full bg-strength-core transition-[width] duration-350 ease-out"></div>
    </div>
    <div class="flex items-center justify-between gap-3.5 flex-wrap">
      <div class="flex items-center gap-2">
<span x-show="status === 'not_started'" class="inline-flex items-center gap-1.5 text-13 font-semibold text-muted-foreground whitespace-nowrap"><span class="w-2 h-2 rounded-full bg-muted-foreground/50"></span> Not started</span><span x-show="status === 'learning'" class="inline-flex items-center gap-1.5 text-13 font-semibold text-warning whitespace-nowrap"><span class="w-2 h-2 rounded-full bg-warning"></span> Learning</span><span x-show="status === 'read'" class="inline-flex items-center gap-1.5 text-13 font-semibold text-foreground/80 whitespace-nowrap"><svg class="w-[15px] h-[15px]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg> Read</span><span x-show="status === 'mastered'" class="inline-flex items-center gap-1.5 text-13 font-semibold text-priority-low whitespace-nowrap"><svg class="w-[15px] h-[15px]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Completed</span>      </div>
      <div class="flex items-center gap-2.5">
<button type="button" x-show="status === 'not_started' || status === 'learning'" @click="advance()" class="inline-flex items-center gap-2 px-[18px] py-[9px] rounded-lg bg-primary text-primary-foreground text-13 font-semibold hover:opacity-90 focus:outline-hidden focus:shadow-focus whitespace-nowrap"><span x-text="status === 'learning' ? 'Mark as read' : 'Start learning'"></span><svg class="w-[15px] h-[15px]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button><button type="button" x-show="status === 'read' || status === 'mastered'" @click="reviewAgain()" class="inline-flex items-center gap-1.5 px-4 py-[9px] rounded-lg border border-border bg-card text-13 font-semibold text-foreground/80 hover:bg-muted focus:outline-hidden focus:shadow-focus"><svg class="w-3.5 h-3.5" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Review again</button>      </div>
    </div>
  </div>
</div>
