description: |
  Study of the self, through the self. This means two things at once: study texts and teachings that illuminate who you are, and study your own patterns — reactions, habits, triggers, stories. Journaling is svadhyaya. Reflection is svadhyaya. The moment you ask "why did I do that?" you're practicing it.
