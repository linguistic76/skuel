content: |
  ## The Outward Turn

  Self-awareness and self-management are inward skills. Social awareness is where you turn outward — toward other people.

  Social awareness answers one question: *What is it like to be that person right now?*

  You don't need to agree with someone to understand them. Understanding is not approval. It's information.

  ## Empathy

  Empathy has two layers:

  **Cognitive empathy** — understanding what someone else is thinking or feeling. "She's probably frustrated because the deadline moved again."

  **Affective empathy** — actually feeling a version of what they feel. Your stomach tightens when you see someone embarrassed. You smile when a stranger's kid laughs.

  Both matter. Cognitive empathy without affect can feel cold and calculating. Affect without cognition can overwhelm you — you absorb everyone's emotions without understanding them.

  The balance: *understand* what others feel (cognitive) while *resonating* just enough to stay connected (affective) without drowning in it.

  ## Perspective-Taking

  Perspective-taking is empathy's practical tool. It's the deliberate act of imagining yourself in someone else's situation.

  This is harder than it sounds because your brain defaults to your own perspective. You see the world through your experiences, your values, your culture — and you assume everyone else does too.

  Try this reframe when someone does something that confuses or frustrates you:

  > "What would have to be true about their situation for this behavior to make sense?"

  Usually the answer reveals something you didn't know: they're under pressure you can't see, they have different information, or they're operating from different values — not wrong values, just different ones.

  ## Cultural Awareness

  Culture is the invisible water we swim in. It shapes:
  - What we consider polite or rude
  - How we express emotions (or don't)
  - What we value (independence vs. community, directness vs. harmony)
  - How we relate to authority, time, and conflict

  Cultural awareness starts with noticing your *own* cultural lens. Before you judge someone else's behavior as strange, ask: "Is this actually strange, or is it just different from what I'm used to?"

  This doesn't mean all cultural practices are equally healthy. It means your first response should be curiosity, not judgment.

  ## Compassion

  Empathy says: "I see your pain."
  Compassion says: "I see your pain, and I want to help."

  The difference is action. Compassion is empathy with legs.

  Compassion doesn't require grand gestures. It can be:
  - Asking "How are you?" and actually waiting for the answer
  - Noticing someone struggling and offering specific help ("Can I carry that?") instead of vague help ("Let me know if you need anything")
  - Giving someone the benefit of the doubt before assuming the worst

  ## Practice

  Pick one of these for today:

  1. **The perspective question:** When someone does something that annoys you, silently ask: "What would have to be true for this to make sense?"
  2. **The cultural check:** Notice one moment where your reaction to someone is shaped by your cultural expectations, not by what they actually did
  3. **Micro-compassion:** Do one small, specific thing to make someone's day slightly easier — without being asked

  ## What's Next

  Understanding others is the foundation. Building and maintaining actual relationships with them — that's the next skill.

