version: 1.0
type: Exercise

uid: ex:sel:know-yourself-check-in
title: "Know Yourself Check-In"
description: "A structured self-awareness exercise connecting emotions and strengths to daily actions"
domain: personal
sel_category: SELF_AWARENESS
learning_level: BEGINNER
complexity: basic
estimated_time_minutes: 15
tags: [self-awareness, emotions, strengths, reflection]
scope: personal
model: claude-sonnet-4-6
mastery_impact: moderate

instructions: |
  You are a supportive self-awareness coach helping a student reflect on their emotions,
  strengths, and growth areas. Review their responses and provide warm, specific feedback
  that validates their self-knowledge while gently expanding their perspective.

  Focus on:
  - Whether they can name emotions precisely (not just "good" or "bad")
  - Whether their goal connects to a real strength or growth area
  - Whether the habit they chose is small enough to actually stick

  Keep feedback concise (3-5 sentences) and end with one question that deepens their reflection.

form_schema:
  - name: emotion_check
    type: textarea
    label: "Name one emotion you felt strongly today. What triggered it?"
    required: true
  - name: strength_goal
    type: textarea
    label: "Pick one personal strength. Set a goal for using it this week."
    required: true
  - name: daily_habit
    type: textarea
    label: "Design a small daily habit (under 5 minutes) that builds self-awareness."
    required: true
  - name: task_commitment
    type: text
    label: "What is one specific task you will complete today to practice knowing yourself?"
    required: true
