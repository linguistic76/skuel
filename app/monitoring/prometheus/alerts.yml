# Prometheus Alerting Rules for SKUEL
# =====================================
# Critical alerts for production monitoring and incident response.
#
# Alert Severity Levels:
# - critical: Immediate action required (service down, high error rate)
# - warning:  Attention needed (degraded performance, queue backlog)
#
# Testing Alerts:
#   promtool check rules /monitoring/prometheus/alerts.yml
#   curl http://localhost:9090/api/v1/rules
#
# See: .claude/skills/prometheus-grafana/ALERTING.md

groups:
  - name: skuel_critical
    interval: 30s
    rules:
      # ==================================================================
      # HTTP / API Health
      # ==================================================================

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(skuel_http_errors_total[5m]))
            /
            sum(rate(skuel_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate (>5%)"
          description: "Error rate is {{ $value | humanizePercentage }} over last 5 minutes"
          runbook: "Check /logs for errors, verify Neo4j connection, review recent deployments"

      - alert: SlowHttpRequests
        expr: |
          histogram_quantile(0.95,
            rate(skuel_http_request_duration_seconds_bucket[5m])
          ) > 5.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile HTTP latency >5s"
          description: "p95 latency is {{ $value }}s (threshold: 5s)"
          runbook: "Check slow queries in Grafana, review database indexes"

      # ==================================================================
      # Database Health
      # ==================================================================

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            rate(skuel_neo4j_query_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile database query latency >2s"
          description: "p95 query latency is {{ $value }}s (threshold: 2s)"
          runbook: "Check slow queries in Neo4j Browser, review indexes, check APOC usage"

      - alert: HighDatabaseErrorRate
        expr: |
          (
            sum(rate(skuel_neo4j_errors_total[5m]))
            /
            sum(rate(skuel_neo4j_queries_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database error rate >10%"
          description: "{{ $value | humanizePercentage }} of database queries failing"
          runbook: "Check Neo4j logs, verify schema constraints, review recent migrations"

      # ==================================================================
      # Event Processing
      # ==================================================================

      - alert: HighEventHandlerErrorRate
        expr: |
          (
            sum(rate(skuel_event_handler_errors_total[5m]))
            /
            sum(rate(skuel_event_handler_calls_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event handler error rate >10%"
          description: "{{ $value | humanizePercentage }} of event handlers failing"
          runbook: "Check event handler logs, verify service dependencies"

      - alert: SlowEventHandlers
        expr: |
          histogram_quantile(0.95,
            rate(skuel_event_handler_duration_seconds_bucket[5m])
          ) > 5.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Event handlers p95 latency >5s"
          description: "Event handlers taking {{ $value }}s at p95"
          runbook: "Check for blocking operations in handlers, review async patterns"

      # ==================================================================
      # Graph Health
      # ==================================================================

      - alert: HighOrphanedEntityCount
        expr: skuel_orphaned_entities_count > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} orphaned entities detected"
          description: "Entities with no relationships (isolated nodes)"
          runbook: "Review entity creation logic, check relationship service"

      # AuraDB Free caps: 200k nodes / 400k relationships (Neo4j Aura FAQ,
      # verified 2026-07-24; the 50k/175k figures still on the product page are
      # the stale 2021 launch limits). Thresholds fire at 80% of cap — writes
      # start failing AT the cap, so 80% is the act-now line: prune telemetry
      # (./dev telemetry-retention) or trim the graph before growth resumes.
      # Gauges are set by the 5-min graph-health poller (scripts/dev/bootstrap.py).
      # These rules evaluate only in dev; the PRODUCTION evaluator is the in-app
      # check fed by the same poller (core/infrastructure/monitoring/aura_cap_check.py,
      # thresholds in core/constants.py AuraDBCaps — drift-pinned to these exprs
      # by tests/unit/test_metric_reference_drift.py).
      - alert: AuraNodeCapApproaching
        expr: skuel_total_entities > 160000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Graph at {{ $value }} nodes — >80% of the AuraDB Free 200k cap"
          description: "AuraDB Free rejects writes at the cap; headroom is running out"
          runbook: "Run ./dev telemetry-retention, review growth with ./dev knowledge-health, consider the invite gate / paid tier"

      - alert: AuraRelationshipCapApproaching
        expr: skuel_total_relationships > 320000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Graph at {{ $value }} relationships — >80% of the AuraDB Free 400k cap"
          description: "AuraDB Free rejects writes at the cap; headroom is running out"
          runbook: "Run ./dev telemetry-retention, review growth with ./dev knowledge-health, consider the invite gate / paid tier"

      # The 16 relationship/knowledge gauges freeze at their last values when the
      # poller can't reach Neo4j — this alert makes that staleness visible.
      # Baseline is set at task start, so "never succeeded since boot" also fires.
      # 900s = 3 missed 5-min cycles.
      - alert: GraphHealthPollerStale
        expr: time() - skuel_graph_health_poll_last_success_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Graph-health poller last succeeded {{ $value | humanizeDuration }} ago"
          description: "Relationship/knowledge gauges are frozen at stale values"
          runbook: "Check app logs for graph-health errors (docker logs skuel-app | grep -i 'graph health'), verify Neo4j via /health/ready"

      # ==================================================================
      # AI Services
      # ==================================================================

      - alert: HighAIErrorRate
        expr: |
          (
            sum(rate(skuel_ai_errors_total[5m]))
            /
            sum(rate(skuel_ai_requests_total[5m]))
          ) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI API error rate >20%"
          description: "{{ $value | humanizePercentage }} of AI API calls failing"
          runbook: "Check OPENAI_API_KEY (wired provider for chat + embeddings, ADR-068; BGE/HF adapter staged, not selectable), verify rate limits, check provider status pages"

      - alert: EmbeddingQueueBacklog
        expr: skuel_embedding_queue_size > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Embedding queue has {{ $value }} pending items"
          description: "Background worker may be falling behind or stalled"
          runbook: "Check embedding worker logs, verify OpenAI API availability, consider increasing batch size"

      # status="skipped" (content-hash idempotency, ADR-074 §8) is excluded from
      # the denominator: force syncs/backfills produce large benign skip volumes
      # that would dilute the real failure ratio exactly when it matters most.
      - alert: HighEmbeddingFailureRate
        expr: |
          (
            sum(rate(skuel_embeddings_processed_total{status="failed"}[5m]))
            /
            sum(rate(skuel_embeddings_processed_total{status=~"success|failed|dropped"}[5m]))
          ) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Embedding failure rate >20%"
          description: "{{ $value | humanizePercentage }} of embeddings failing to generate"
          runbook: "Check OpenAI API status, review error logs, verify text preprocessing"

      - alert: SlowAICalls
        expr: |
          histogram_quantile(0.95,
            rate(skuel_ai_duration_seconds_bucket[5m])
          ) > 30.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI API calls p95 latency >30s"
          description: "AI API responses taking {{ $value }}s at p95"
          runbook: "Check provider status pages, review batch sizes, verify network latency"

  # ==================================================================
  # Service Level Objectives (SLOs)
  # ==================================================================
  # Optional: Uncomment after defining SLOs in /docs/observability/SLO.md
  # ==================================================================

