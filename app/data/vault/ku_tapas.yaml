description: Inner fire. The willingness to do the hard thing because it matters, not because someone is watching. Tapas literally means "heat" — the friction of practice burning away what doesn't serve you. Cold showers, consistent study, showing up when you don't feel like it. Discipline is not punishment. It's the investment that compounds.
