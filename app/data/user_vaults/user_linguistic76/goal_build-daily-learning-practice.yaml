version: 1.0
type: Goal

uid: goal:build-daily-learning-practice
title: Build a Sustainable Daily Learning Practice

description: |
  Establish a consistent daily learning rhythm — 25 minutes of focused study
  at least 5 days per week for the next month. The aim is not volume but
  reliability. Once the rhythm is automatic, depth and duration can grow.

goal_type: process
domain: personal
timeframe: monthly
measurement_type: numeric
target_value: 20.0
current_value: 0.0
unit_of_measurement: completed sessions
status: active
priority: high

connections:
  aligned_with_principle:
    - principle:consistency-over-intensity
  supporting_habits:
    - habit:daily-focused-study

why_important: |
  Learning is the engine of personal growth, but without a reliable practice
  it stays aspirational. This goal turns learning from "something I want to do"
  into "something I do every day."

success_criteria: |
  Complete 20 focused 25-minute study sessions within 30 days,
  with no more than 2 consecutive days missed.

potential_obstacles:
  - Evening fatigue making it easy to skip
  - Unclear what to study on a given day
  - Perfectionism — feeling 25 minutes isn't enough

strategies:
  - Anchor study to a fixed time (morning, right after coffee)
  - Keep a running list of 3 study topics so there's no decision fatigue
  - Celebrate the streak, not the content volume

tags:
  - learning
  - daily-practice
  - discipline
