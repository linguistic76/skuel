# Accepted CVE findings — the ONE dispositions file for BOTH ecosystems
# (Python uv.lock + JS package-lock.json), consumed by
# scripts/audit_dependencies.sh via `osv-scanner --config`.
#
# Policy (ADR-067 § 6e, ruled 2026-08-07): ALL severities are reported in both
# ecosystems. Every finding is either fixed or accepted here with a reason and
# an ignoreUntil expiry — the scanner re-raises the finding the day it lapses,
# so acceptance is a dated decision, not a permanent exemption.
#
#   - Every entry documents WHY it is unfixable today and what unblocks it.
#   - Delete the entry the moment an upgrade path exists (One Path Forward).
#   - One entry per advisory: osv-scanner suppresses alias IDs (the GHSA/PYSEC
#     twins) automatically (measured 2026-08-07, v2.5.0).
#
# ── braces (JS, build-time only). @tailwindcss/cli → @parcel/watcher 2.5.1 →
#    micromatch 4.0.8 → braces ^3.0.3; 3.0.3 is the LATEST release and the
#    advisory covers "through 3.0.3" — no fixed release exists. braces
#    expands the glob patterns of Tailwind's own @source lines in
#    static/css/input.css inside the CSS build; no user input reaches it, and
#    the production image has no Node — it serves the tracked, pre-compiled
#    static/css/output.css. The way out: @parcel/watcher 2.6.0
#    drops micromatch for picomatch, but @tailwindcss/cli 4.3.3 (latest) pins
#    @parcel/watcher to exactly 2.5.1 — an `overrides` contradicting that pin
#    is rejected (ADR-067 § 6). Re-check: `npm view @tailwindcss/cli
#    dependencies` for a watcher >= 2.6, and `npm view braces versions`, then
#    ./dev audit-deps.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-22
reason = "braces 3.0.3 — stack-exhaustion DoS on nested patterns; no fixed release published (re-checked 2026-10-22); build-time Tailwind CLI only, patterns from our own @source lines; unblocked when @tailwindcss/cli moves to @parcel/watcher >= 2.6"
