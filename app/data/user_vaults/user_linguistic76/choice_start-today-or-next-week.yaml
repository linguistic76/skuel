version: 1.0
type: Choice

uid: choice:start-today-or-next-week
title: Start the Daily Study Practice Today

description: |
  The classic moment of truth — do you begin today with whatever time
  remains, or wait for the "perfect" Monday start? Starting imperfectly
  today beats a perfect plan that never launches.

choice_type: binary
status: pending
priority: high
domain: personal

decision_criteria:
  - Is there 25 minutes available today?
  - Do I have at least one topic I could study?
  - Am I overthinking the "right" time to start?

constraints:
  - Requires 25 uninterrupted minutes
  - Requires willingness to start imperfectly

outcomes:
  - Build immediate momentum
  - Prove to yourself that starting is the hardest part
  - First data point for your streak

connections:
  guided_by_principle:
    - principle:consistency-over-intensity
  affects_goal:
    - goal:build-daily-learning-practice
  impacts_habit:
    - habit:daily-focused-study

tags:
  - momentum
  - start-now
  - decision
