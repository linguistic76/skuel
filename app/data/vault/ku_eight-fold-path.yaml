description: Patanjali's eight limbs — a complete system for living, not just a workout plan. Yamas (how you treat others), Niyamas (how you treat yourself), Asana (body), Pranayama (breath), Pratyahara (withdrawing senses), Dharana (concentration), Dhyana (meditation), Samadhi (integration). Most people only see limb three. SKUEL works all eight.
