# ============================================================================
# SKUEL Infrastructure - Neo4j Graph Database (standalone)
# ============================================================================
# Production-ready Neo4j configuration with APOC (meta only).
#
# NOTE: The primary dev workflow now uses the unified compose in app/:
#   cd ~/skuel/app && docker compose up        # Full stack
#   cd ~/skuel/app && docker compose up neo4j   # Neo4j only
#
# This file remains functional for running Neo4j independently.
# Both composes share the same data directory (infrastructure/neo4j/).
#
# Last Updated: 2026-02-15
# ============================================================================

services:
  neo4j:
    image: neo4j:2026.06.0
    container_name: skuel-neo4j
    restart: unless-stopped

    ports:
      # Localhost-only binding for security
      - "127.0.0.1:7474:7474"  # HTTP (Neo4j Browser)
      - "127.0.0.1:7687:7687"  # Bolt (Application connection)

    environment:
      # ============================================
      # PLUGINS
      # ============================================
      # APOC only — embeddings are generated Python-side via BGE / HuggingFace
      # (ADR-049), so the GenAI procedures are unused. Loading the genai jar
      # also tied us to a Java-21 image; sticking to apoc keeps the choice open.
      NEO4J_PLUGINS: '["apoc"]'

      # ============================================
      # AUTHENTICATION
      # ============================================
      NEO4J_AUTH: "${NEO4J_AUTH}"

      # ============================================
      # MEMORY CONFIGURATION (Phase 6.3 tuned)
      # ============================================
      # Heap memory settings
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INIT}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX}"

      # Page cache (graph traversal performance)
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE}"

      # ============================================
      # TRANSACTION CONFIGURATION (Neo4j 5.26+)
      # ============================================
      # Database transaction timeout (for large queries)
      NEO4J_db_transaction_timeout: 600s

      # ============================================
      # QUERY OPTIMIZATION (Phase 5 Pure Cypher)
      # ============================================
      # Query cache size (parameterized queries) - Neo4j 5.26+ syntax
      # server.memory.query_cache.per_db_cache_num_entries → NEO4J_server_memory_query__cache_per__db__cache__num__entries
      NEO4J_server_memory_query__cache_per__db__cache__num__entries: "2000"

      # Cypher planner (cost-based optimization) - Neo4j 5.26+ syntax
      NEO4J_dbms_cypher_planner: COST

      # Note: Query plan caching is enabled by default in Neo4j 5.x

      # ============================================
      # LOGGING CONFIGURATION (Neo4j 5.26+)
      # ============================================
      # Note: Neo4j 5.x uses 'db.logs.*' prefix instead of 'dbms.logs.*'
      # Query log rotation is now managed automatically by Neo4j

      # Log slow queries (> 1 second)
      NEO4J_db_logs_query_enabled: INFO
      NEO4J_db_logs_query_threshold: 1s
      NEO4J_db_logs_query_parameter__logging__enabled: "true"

      # ============================================
      # SECURITY CONFIGURATION
      # ============================================
      # APOC meta procedures only (SKUEL001 — domain services use pure Cypher)
      NEO4J_dbms_security_procedures_unrestricted: "apoc.meta.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.meta.*"

      # ============================================
      # JVM CONFIGURATION
      # ============================================
      # Enable the Java Vector API (SIMD) for the vector indexes SKUEL relies on
      # (Entity/ContentChunk/ReferenceChunk/Goal/Task embeddings — semantic search,
      # canon retrieval, ZPD). Without it 2026.x warns "Java vector incubator module
      # is not readable ... For optimal vector performance". Purely additive — the
      # image sets no other server.jvm.additional lines (heap comes from the memory
      # settings above), so this does not clobber GC/heap flags.
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"

      # ============================================
      # NETWORK CONFIGURATION
      # ============================================
      NEO4J_server_bolt_enabled: "true"
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_enabled: "true"
      NEO4J_server_http_listen__address: 0.0.0.0:7474

    volumes:
      # Persistent data storage
      # NEO4J_DATA_DIR: absolute path to data directory (set in .env).
      # Default ./neo4j is relative to this file's directory — works for local
      # dev but set an absolute path in .env to avoid CWD-dependent resolution.
      - ${NEO4J_DATA_DIR:-./neo4j}/data:/data
      - ${NEO4J_DATA_DIR:-./neo4j}/logs:/logs
      - ${NEO4J_DATA_DIR:-./neo4j}/conf:/conf
      - ${NEO4J_DATA_DIR:-./neo4j}/plugins:/plugins
      - ${NEO4J_DATA_DIR:-./neo4j}/import:/import
      - ${NEO4J_DATA_DIR:-./neo4j}/backups:/backups

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
