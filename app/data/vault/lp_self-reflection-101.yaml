uid: lp:self-reflection-101
name: Self-Reflection 101 — See Yourself Clearly
goal: Build the practice of observing your patterns, emotions, and values without judgment
description: |
  The natural next step after mindfulness. Once you can notice your breath
  and label your wandering mind, turn that same skill toward your life.

  This path teaches you to see your behavioral patterns, understand your
  emotional landscape, and discover the values that actually drive your
  decisions. No navel-gazing — just clear-eyed observation that leads
  to better choices.

path_type: structured
difficulty: beginner
domain: personal

connections:
  contains_steps:
    - ls:self-reflection-101:step-1
    - ls:self-reflection-101:step-2

prerequisites:
  - lp:mindfulness-101

outcomes:
  - Identify recurring trigger-feeling-response patterns in daily life
  - Develop precise emotional vocabulary beyond "good" and "bad"
  - Discover 2-3 core personal values from lived experience
  - Build a daily self-observation practice that feeds ongoing growth

estimated_hours: 1.5

