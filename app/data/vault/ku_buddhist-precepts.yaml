description: Five basic training rules for ethical living — refrain from harming living beings, taking what isn't given, sexual misconduct, false speech, and intoxicants that cloud the mind. Notice how similar these are to the yamas. Every serious tradition converges on the same fundamentals. The precepts aren't commands from an authority. They're observations about what causes suffering and what doesn't.
