name: File audit issue
description: >
  Open, update, or close a marker-keyed issue for a scheduled audit. Idempotent by
  content: an unchanged finding set does not generate a new comment, so a daily job
  does not produce 365 comments on one stale issue. `mode: resolve` CLOSES the marker's
  issue — required, because this action only ever looks at OPEN issues, so an issue left
  open with a stale digest would silently suppress the report of a recurrence.

inputs:
  mode:
    description: >
      `report` (default) opens/updates the marker's issue. `resolve` closes it because the
      audit no longer reports this condition. In resolve mode `body`/`digest` are ignored.
    required: false
    default: report
  marker:
    description: Unique HTML-comment key identifying this audit's issue. Must be stable.
    required: true
  title:
    description: Issue title used when creating a new issue.
    required: false
    default: ''
  body:
    description: Issue body (markdown). Must not assert more than the audit measured.
    required: false
    default: ''
  digest:
    description: >
      Fingerprint of the current finding set. Stored in the marker so an unchanged
      result is silent and a CHANGED result still comments on the open issue. It must key
      on advisory IDENTITY, not just affected package names — a new advisory against an
      already-listed package must change it.
    required: false
    default: ''
  token:
    description: GITHUB_TOKEN with issues:write.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const mode    = ${{ toJSON(inputs.mode) }}
          const marker  = ${{ toJSON(inputs.marker) }}
          const title   = ${{ toJSON(inputs.title) }}
          const body    = ${{ toJSON(inputs.body) }}
          const digest  = ${{ toJSON(inputs.digest) }}

          // The marker carries the digest so "is this the same finding set?" is answered
          // from the issue itself — no external state to drift.
          const stamp  = `<!-- ${marker}:${digest} -->`
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          const issueBody = [stamp, body, '', `[Audit run](${runUrl})`].join('\n')

          // Search open issues for this marker, ignoring the digest suffix.
          const open = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100,
          })
          const prior = open.find(i => i.body && i.body.includes(`<!-- ${marker}:`))

          if (mode === 'resolve') {
            // The condition cleared. Close the issue rather than leaving it open with a
            // stale digest: this action only ever inspects OPEN issues, so a stale-open
            // issue whose stamp happens to match a future recurrence would make that
            // recurrence silent — the audit would go red with nothing explaining why.
            if (!prior) {
              core.info(`Nothing open for ${marker} — nothing to resolve.`)
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prior.number,
              body: `The audit no longer reports this condition as of [this run](${runUrl}). Closing.`,
            })
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prior.number,
              state: 'closed',
            })
            core.info(`Closed #${prior.number}`)
            return
          }

          if (!prior) {
            const created = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body: issueBody,
            })
            core.info(`Opened #${created.data.number}`)
            return
          }

          if (prior.body.includes(stamp)) {
            // Same findings as last time. Saying so again adds nothing.
            core.info(`#${prior.number} already reports this exact result — staying quiet.`)
            return
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: prior.number,
            body: ['The audit result **changed** since this issue was last updated.', '', issueBody].join('\n'),
          })
          // Re-stamp the issue body so the next run compares against the current result.
          await github.rest.issues.update({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: prior.number,
            body: issueBody,
          })
          core.info(`Updated #${prior.number} with a changed result.`)
