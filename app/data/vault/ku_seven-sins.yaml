description: |
  Pride, greed, lust, envy, gluttony, wrath, sloth — seven patterns that erode a life from the inside. Not punishments from above, but descriptions of how humans get stuck. Every one of these is a natural impulse taken too far. Hunger becomes gluttony. Confidence becomes pride. Rest becomes sloth. The seven sins are a diagnostic tool: where is your energy leaking?
