description: |
  The ability to recognize, understand, and work with emotions — your own and other people's. EQ isn't a soft skill. It's the skill that makes all other skills usable. You can be brilliant and still destroy relationships if you can't read a room or regulate yourself under pressure. EQ is nervous system literacy: knowing what you feel, why you feel it, and what to do about it.
