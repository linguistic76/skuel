# SKUEL Skills Metadata Registry
#
# Central registry for all Claude skills with dependencies,
# related documentation, and keywords.
#
# Skills are organized by foundation layer (base dependencies).
#
# `related_adrs` grammar: a bare `ADR-NNN` is resolved to its file under
# docs/decisions/ by glob. Some numbers were reused across ADRs, so a bare number
# there matches several files and the resolver refuses to choose — write the full
# filename instead (three entries below do). See scripts/adr_links.py.
#
# New 2026-05-21 (registry hardening):
# - Registered 5 previously-unregistered skills: docker, learning-loop, prompt-templates,
#   ui-orchestrator, zpd (skill dirs existed but were missing from this registry).
# - Validator now checks registry completeness (dir -> metadata) + related_skills references
#   (doc -> real skill), and nudges oversized monolithic SKILL.md files toward progressive
#   disclosure instead of demanding specifically-named QUICK_REFERENCE.md / PATTERNS.md files.
#
# New in Phase 2.2 (2026-02-02):
# - Added 8 missing skills; added related_adrs and patterns fields for bidirectional linking
#
# New in Phase 2.4 (2026-03-01):
# - Consolidated 9 UI skills into 3: ui-css (Tailwind+DaisyUI), ui-browser (Alpine+HTMX), skuel-ui (all SKUEL patterns)
# - Deleted: tailwind-css, daisyui, js-alpine, html-htmx, html-navigation, base-page-architecture, custom-sidebar-patterns,
#   skuel-component-composition, skuel-form-patterns
# - Total: 31 → 25 skills
# - Added last_reviewed field to all skills for staleness detection
#
# New in Phase 2.3 (2026-02-02):
# - Added library_package and library_version fields for library upgrade detection
# - Added @docs-skills-evolution meta-skill for documentation/skills evolution workflow
# - Implemented post-merge hook for library change detection

