uid: habit:pause-and-name
name: Pause and Name One Reaction
description: Once per day, catch a reaction in real time — pause for one second and name the feeling.

polarity: build
category: self-reflection
difficulty: easy

recurrence_pattern: daily
target_days_per_week: 5
preferred_time: anytime
duration_minutes: 0

