sel_category: self_awareness
description: |
  The most powerful way to change your habits is to change your identity. Don't say "I'm trying to quit smoking." Say "I'm not a smoker." Every action you take is a vote for the type of person you want to become. Identity-based habits work from the inside out — decide who you want to be, then prove it to yourself with small wins. This is where habits meet yoga: both are about becoming, not just doing.
