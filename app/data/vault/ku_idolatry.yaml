  - misplaced devotion
source: research
sel_category: self_awareness
description: |
  Placing anything — money, status, a person, an image of yourself — above what is ultimately real. In Islam, shirk is the gravest error. But you don't have to be Muslim to understand the warning: when you worship the temporary as if it were permanent, you lose yourself. Social media followers as self-worth. GPA as identity. Brand logos as belonging. These are modern forms of idolatry.
