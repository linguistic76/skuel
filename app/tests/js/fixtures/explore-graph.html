<div x-data="exploreGraph('hub', '', '')" class="px-2 pt-2">
  <div class="relative border border-border rounded-lg bg-muted/30 overflow-hidden w-full" style="height: 260px">
    <div id="explore-graph-container" class="w-full h-full"><svg id="explore-graph-skeleton" width="100%" height="100%" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="text-muted-foreground/20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1='200' y1='130' x2='100' y2='75'/><line x1='200' y1='130' x2='305' y2='68'/><line x1='200' y1='130' x2='88' y2='188'/><line x1='200' y1='130' x2='312' y2='185'/><line x1='100' y1='75' x2='305' y2='68'/></g><g class="text-muted-foreground/30 animate-pulse" fill="currentColor"><circle cx='200' cy='130' r='12'/><circle cx='100' cy='75' r='8'/><circle cx='305' cy='68' r='8'/><circle cx='88' cy='188' r='8'/><circle cx='312' cy='185' r='8'/></g></svg></div>
<button type="button" aria-label="Expand graph view" @click="expandGraph()" x-show="!expanded" x-ref="expandButton" class="absolute top-2 right-2 w-11 h-11 md:w-7 md:h-7 flex items-center justify-center rounded-md bg-background/80 border border-border hover:bg-accent transition-colors cursor-pointer z-10"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></svg></button>    <div x-show="loading" x-cloak class="absolute inset-0 flex items-center justify-center">
      <div class="flex items-center">
<span aria-live="polite" class="sr-only"></span><span class="animate-spin inline-block w-5 h-5 border-2 border-primary border-t-transparent rounded-full"></span>      </div>
    </div>
    <div x-show="error &amp;&amp; !loading" x-cloak class="absolute inset-0 flex items-center justify-center">
<span x-text="error" class="text-xs text-destructive"></span>    </div>
    <div x-show="!loading &amp;&amp; !error &amp;&amp; isEmpty" x-cloak class="absolute inset-0 flex flex-col items-center justify-center text-muted-foreground/40">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg><span class="text-xs text-muted-foreground mt-2">Start exploring to see your graph</span>    </div>
  </div>
  <div class="flex gap-1.5 px-2 py-2">
<button type="button" :class="filter === 'all' ? 'bg-primary text-primary-foreground border-primary' : 'bg-background text-muted-foreground border-border hover:bg-accent'" @click="setFilter('all')" class="px-2.5 py-1 text-xs rounded-full border transition-colors cursor-pointer">All</button><button type="button" :class="filter === 'learning' ? 'bg-primary text-primary-foreground border-primary' : 'bg-background text-muted-foreground border-border hover:bg-accent'" @click="setFilter('learning')" class="px-2.5 py-1 text-xs rounded-full border transition-colors cursor-pointer">Learning</button><button type="button" :class="filter === 'saved' ? 'bg-primary text-primary-foreground border-primary' : 'bg-background text-muted-foreground border-border hover:bg-accent'" @click="setFilter('saved')" class="px-2.5 py-1 text-xs rounded-full border transition-colors cursor-pointer">Saved</button>  </div>
</div>
