version: 1.0
type: Principle

uid: principle:consistency-over-intensity
name: Consistency Over Intensity
statement: Small daily efforts compound into mastery faster than occasional bursts of intensity

principle_category: personal
principle_source: scientific
strength: core
current_alignment: mostly_aligned

description: |
  Research on skill acquisition and habit formation consistently shows that
  distributed practice outperforms massed practice. Twenty minutes daily for
  a month beats a single eight-hour marathon. This principle applies to
  learning, fitness, creative work, and relationship building alike.

supported_knowledge_domains:
  - personal
  - professional

example_applications:
  - Study for 25 minutes daily rather than cramming for 3 hours on weekends
  - Write one paragraph every morning instead of waiting for inspiration
  - Practice a musical instrument for 15 minutes daily

measurement_criteria: |
  You are living this principle when:
  - You have a streak of 5+ consecutive days on at least one habit
  - You choose "a little today" over "a lot someday"
  - You feel steady progress rather than guilt from missed marathons

tags:
  - learning
  - discipline
  - compound-growth
