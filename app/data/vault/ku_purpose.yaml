description: |
  Not a destination you arrive at — a direction you move in. Purpose isn't found in a single flash of insight. It emerges when you pay attention to what energizes you, what you can't stop thinking about, what the world needs that you're positioned to give. Purpose connects your daily actions to something larger than yourself. Without it, discipline becomes grinding. With it, discipline becomes fuel.
