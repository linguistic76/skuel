description: |
  You don't receive knowledge — you build it. Constructivism says learning happens when you actively construct understanding through experience, reflection, and connecting new ideas to what you already know. A teacher can't pour knowledge into your head. They can only create conditions where you build it yourself. That's why SKUEL emphasizes practice, journaling, and projects over lectures.
