description: The basis of all teachings. Not a slogan — a practice. Your mind lives in the past (regret, nostalgia) or the future (anxiety, fantasy). The only place life actually happens is now. Every practice in SKUEL — breath, asana, journaling, reflection — is training this one skill. Be here. Now.
