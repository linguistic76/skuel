description: |
  Your brain's emotional engine — the amygdala (alarm system), hippocampus (memory), and connected structures that process feelings before your thinking brain even knows what happened. When you react before you think, that's your limbic system. Understanding this isn't about excusing behavior — it's about knowing the machinery so you can work with it instead of being hijacked by it.
