    - habit:pause-and-name

related_principle_uids:
  - principle:small-steps
  - principle:attention-over-intensity

key_behaviors:
  - Watch a pattern for at least a week before trying to change it
  - Name what you see without adding "and I need to stop doing that"
  - Trust that clear observation shifts behavior on its own

decision_criteria:
  - When tempted to "fix" a behavior immediately, first observe it for three occurrences
  - When journaling, describe what happened before evaluating it
  - When feeling self-critical, redirect toward curiosity

current_alignment: mostly_aligned
last_review_date: 2026-03-29

why_important: |
  Skipping observation leads to a cycle of self-improvement plans that
  don't stick. The plans fail not because of weak willpower but because
  they're based on a shallow understanding of what's actually happening.

origin_story: |
  Learned after repeatedly setting goals to "be more patient" or
  "stop procrastinating" without ever understanding what triggered
  the impatience or avoidance in the first place.

