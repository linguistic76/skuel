title: Choose Your First Three Study Topics

description: |
  Pick three specific topics for your first week of focused study sessions.
  Having topics pre-selected eliminates decision fatigue at study time.

  Guidelines:
  - Each topic should fit in a 25-minute session
  - Mix familiar and slightly challenging material
  - Write them down somewhere visible

