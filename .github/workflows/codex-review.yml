name: Codex Auto-Review

# ============================================================================
# ⏸️  DISABLED 2026-05-22 — this comment-bot trigger is off (Codex itself works).
#
# Why off: when `@codex review` is posted by `github-actions[bot]`, Codex replies
# with only the cosmetic "create a Codex account / connect to github" line and NO
# real review — a bot-posted comment isn't attributed to the connected Codex
# account. Meanwhile Codex's CLOUD AUTO-REVIEW (on PR open, attributed to the
# connected `linguistic76` account) DOES post real reviews — verified on PR #15
# (2026-05-22). So this workflow added cosmetic noise without producing reviews;
# cloud auto-review is the path that works and is left ON. (This inverts the
# PR #11-era assumption that the bot-comment was the reliable trigger.)
#
# Caveat: Codex draws from a weekly shared usage limit; cloud reviews may go quiet
# when it's exhausted (resets weekly, or upgrade to Plus), then resume.
#
# Kody (Kodus) is the gating reviewer; CI Gate is the required check; Codex is
# advisory either way, so nothing is blocked.
#
# TO RE-ENABLE this comment-bot path (e.g. if cloud auto-review proves flaky):
# uncomment the `pull_request:` trigger below; verify with the throwaway-PR test
# in ./README.md -> "Verifying / re-enabling a reviewer".
# ============================================================================
#
# Original rationale (kept for re-enablement): Codex's cloud "auto-review on
# open" is unreliable — across PRs #1-#10 it fired on only 3, and 6 merged with
# no review. The `@codex review` *comment* worked every time, so this workflow
# posts that comment automatically. Codex posts PR reviews/comments, never a
# status check, so it is a fire-and-forget trigger — nothing to mark required in
# branch protection (that remains "CI Gate"). See ./README.md.

on:
  # ⏸️ DISABLED: comment-bot trigger off — it produced only cosmetic responses;
  #    Codex cloud auto-review does the real reviewing (see header). Re-enable by
  #    uncommenting the two lines below.
  # pull_request:
  #   types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

# One review per burst: a newer push cancels the older run while it is still in
# its debounce sleep, so a flurry of commits collapses to a single trigger.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # post the `@codex review` issue comment

jobs:
  request-codex-review:
    name: Request Codex review
    # Stay quiet on drafts; the `ready_for_review` event covers draft -> ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Debounce burst pushes
        # A newer push to the same PR cancels this run before it posts (see the
        # concurrency block above), so rapid commits yield one review, not many.
        run: sleep 30

      - name: Comment @codex review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@codex review',
            });
