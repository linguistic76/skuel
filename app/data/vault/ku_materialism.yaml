description: |
  The belief that having more stuff equals a better life. Materialism isn't just about greed — it's a worldview that reduces everything to the physical and measurable. SKUEL acknowledges material needs are real, but the evidence is clear: beyond basic security, more possessions don't increase wellbeing. The question isn't "how much can I get?" but "how much do I actually need to live well?"
