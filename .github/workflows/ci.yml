name: CI

# Single CI workflow for SKUEL. Replaces the former quality.yml + docs.yml.
#
# Why one workflow with a gate: branch protection requires a check that runs on
# EVERY PR. The heavy jobs (mypy, docs) are path-scoped, so on their own they
# would never report on an unrelated PR and would deadlock a required check.
# The `gate` job always runs and aggregates their results, so "CI Gate" is the
# one safe required status check.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # PR comments (mypy failures, docs results)

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      cypher: ${{ steps.filter.outputs.cypher }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so paths-filter can resolve the pre-push commit on
          # push events (base below); shallow clones can miss it.
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3.0.3 (pinned: third-party action)
        with:
          # On push, diff only the pushed commits (ignored on pull_request,
          # where the PR base is used). Without this, pushes to any long-lived
          # branch would diff against main and over-trigger the jobs.
          base: ${{ github.ref }}
          filters: |
            py:
              - 'app/**/*.py'
              - 'app/pyproject.toml'
              - 'app/uv.lock'
              - '.github/workflows/ci.yml'
            docs:
              - 'app/docs/**'
              - 'app/.claude/skills/**'
              - 'app/scripts/docs_*.py'
              - 'app/scripts/skills_validator.py'
              - '.github/workflows/ci.yml'
            ui:
              # Client-side render surface: static assets, UI render code, the
              # smoke test itself, and dependency pins. A JS-only change (e.g. the
              # skuel.js infinite-loop bug) must still trigger the render smoke test.
              - 'app/static/**'
              - 'app/ui/**'
              - 'app/scripts/smoke_test.py'
              - 'app/pyproject.toml'
              - 'app/uv.lock'
              - '.github/workflows/ci.yml'
            cypher:
              # Executable Cypher outside .py files: migrations and index DDL are
              # loaded and exercised by integration tests, so a Cypher-only PR
              # must still trigger the integration suite (Codex review, PR #701).
              - 'app/**/*.cypher'
              - '.github/workflows/ci.yml'

  mypy:
    name: MyPy Type Check
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      - name: Cache MyPy incremental state
        uses: actions/cache@v4
        with:
          path: app/.mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-${{ github.ref_name }}-
            mypy-${{ runner.os }}-py3.14-

      - name: Run MyPy
        id: mypy
        working-directory: app
        run: |
          set -o pipefail
          uv run mypy . | tee mypy_output.txt

      - name: Upload MyPy output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-output
          path: app/mypy_output.txt
          retention-days: 14

      - name: Comment on PR if MyPy failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('app/mypy_output.txt', 'utf8');
            } catch (e) {
              output = '(MyPy output unavailable)';
            }
            // Trim to fit within PR comment limits (~64KB)
            const MAX = 50000;
            if (output.length > MAX) {
              output = output.slice(0, MAX) + '\n\n... (truncated — see "mypy-output" artifact for full log)';
            }

            const body = [
              '## ❌ MyPy Type Check Failed',
              '',
              'The zero-error MyPy baseline regressed on this PR.',
              '',
              'Run locally to reproduce:',
              '```bash',
              'cd app',
              'uv run mypy .',
              '```',
              '',
              '<details><summary>MyPy output</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              'See [`docs/patterns/mypy_pragmatic_strategy.md`](../blob/main/app/docs/patterns/mypy_pragmatic_strategy.md) for the suppression / fix playbook.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  # Lint — the mechanical rule set ./dev quality runs locally, minus MyPy
  # (its own job above): Ruff format + check, the SKUEL architecture linter,
  # the Cypher linter, and the route-security audit. Before this job existed
  # none of these ran in CI, so a PR authored without a local ./dev lint
  # merged with zero lint coverage.
  lint:
    name: Lint
    needs: changes
    # cypher too (Codex, PR #701): keeps a Cypher-only PR inside the lint job.
    # cypher_linter.py lints standalone .cypher files (indexes, migrations,
    # bulk-upsert templates) since 2026-07, so this filter is load-bearing.
    if: needs.changes.outputs.py == 'true' || needs.changes.outputs.cypher == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      # The checks below keep running after one fails (but not if setup itself
      # failed — `steps.fmt.outcome == 'skipped'` in that case), so a PR author
      # sees every category of violation in a single run.
      - name: Ruff format check
        id: fmt
        working-directory: app
        run: uv run ruff format --check

      - name: Ruff lint
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run ruff check

      - name: SKUEL architecture linter
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/lint_skuel.py --strict --quiet

      - name: Cypher linter
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/cypher_linter.py --errors-only --strict

      - name: Route security audit
        if: ${{ !cancelled() && steps.fmt.outcome != 'skipped' }}
        working-directory: app
        run: uv run python scripts/audit_route_security.py

  validate_documentation:
    name: Validate Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # allow the "Comment on PR" step to post results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate freshness checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      - name: Check documentation freshness (critical only)
        id: freshness
        working-directory: app
        run: |
          echo "Running documentation freshness check..."
          uv run python scripts/docs_freshness.py --critical-only || echo "freshness_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Validate skills metadata
        id: skills
        working-directory: app
        run: |
          echo "Running skills metadata validation..."
          uv run python scripts/skills_validator.py || echo "skills_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for broken documentation links (optional)
        id: broken_links
        working-directory: app
        run: |
          echo "Checking for broken links..."
          # Count missing references in freshness output
          MISSING=$(uv run python scripts/docs_freshness.py --json | python -c "import sys, json; data = json.load(sys.stdin); print(data.get('missing_refs_count', 0))")
          echo "Found $MISSING broken link(s)"

          if [ "$MISSING" -gt 10 ]; then
            echo "⚠️ Warning: $MISSING broken documentation links found"
            echo "broken_links_warning=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Generate review schedule
        id: review
        working-directory: app
        run: |
          echo "Generating documentation review schedule..."
          OVERDUE=$(uv run python scripts/docs_review_scheduler.py --json | python -c "import sys, json; data = json.load(sys.stdin); print(data.get('overdue_docs', 0))")
          echo "Found $OVERDUE overdue documentation(s)"

          if [ "$OVERDUE" -gt 0 ]; then
            echo "📅 $OVERDUE document(s) are overdue for review"
            uv run python scripts/docs_review_scheduler.py
          fi
        continue-on-error: true

      - name: Comment on PR with results
        # Only comment when there is something to report — a clean docs PR is
        # covered by the green check, no comment needed (avoids per-push spam).
        if: >-
          github.event_name == 'pull_request' &&
          (steps.freshness.outputs.freshness_failed == 'true' ||
          steps.skills.outputs.skills_failed == 'true' ||
          steps.broken_links.outputs.broken_links_warning == 'true')
        continue-on-error: true  # never red the job if commenting is unavailable (e.g. fork PRs)
        uses: actions/github-script@v7
        with:
          script: |
            const freshnessStatus = '${{ steps.freshness.outputs.freshness_failed }}' === 'true' ? '❌' : '✅';
            const skillsStatus = '${{ steps.skills.outputs.skills_failed }}' === 'true' ? '❌' : '✅';
            const brokenLinksWarning = '${{ steps.broken_links.outputs.broken_links_warning }}' === 'true';

            let comment = `## Documentation Quality Checks\n\n`;
            comment += `${freshnessStatus} **Documentation Freshness** (critical issues only)\n`;
            comment += `${skillsStatus} **Skills Metadata Validation**\n`;

            if (brokenLinksWarning) {
              comment += `\n⚠️ **Warning**: More than 10 broken documentation links found\n`;
            }

            comment += `\n---\n`;
            comment += `<details>\n<summary>View detailed results</summary>\n\n`;
            comment += `Run \`uv run python scripts/docs_freshness.py\` locally for full freshness report.\n`;
            comment += `Run \`uv run python scripts/skills_validator.py\` locally for validation details.\n`;
            comment += `</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if critical issues found
        # Blocks on documentation-freshness OR skills-validation errors. Both
        # steps run with continue-on-error so the PR-comment step above can
        # report them first; this step is the single chokepoint that reds the
        # job. The validator exits non-zero only on errors (not soft warnings),
        # so the 500-line monolith cap etc. still pass — same errors-vs-warnings
        # split as ./dev quality.
        if: >-
          steps.freshness.outputs.freshness_failed == 'true' ||
          steps.skills.outputs.skills_failed == 'true'
        run: |
          freshness_failed="${{ steps.freshness.outputs.freshness_failed }}"
          skills_failed="${{ steps.skills.outputs.skills_failed }}"
          echo "Documentation freshness: $([ "$freshness_failed" == "true" ] && echo '❌ FAILED' || echo '✅ passed')"
          echo "Skills validation:       $([ "$skills_failed" == "true" ] && echo '❌ FAILED' || echo '✅ passed')"
          echo ""
          if [ "$freshness_failed" == "true" ]; then
            echo "::error::Critical documentation freshness issues found"
            echo "  Run locally: uv run python scripts/docs_freshness.py --critical-only"
          fi
          if [ "$skills_failed" == "true" ]; then
            echo "::error::Skills validation errors found (.claude/skills/*/SKILL.md)"
            echo "  Run locally: uv run python scripts/skills_validator.py"
          fi
          exit 1

  # Documentation metrics — main pushes only (skipped on PRs, as before).
  documentation_metrics:
    name: Generate Metrics
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: app
        run: uv sync --no-install-project

      - name: Generate documentation metrics
        working-directory: app
        run: |
          echo "# Documentation Metrics" > docs_metrics.md
          echo "" >> docs_metrics.md
          echo "Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> docs_metrics.md
          echo "" >> docs_metrics.md

          # Freshness metrics
          echo "## Freshness Status" >> docs_metrics.md
          uv run python scripts/docs_freshness.py --json > freshness.json
          python -c "
          import json
          with open('freshness.json') as f:
              data = json.load(f)
          print(f'- Total docs tracked: {data[\"total_docs\"]}')
          print(f'- Stale docs: {data[\"stale_docs\"]}')
          print(f'- Fresh docs: {data[\"fresh_docs\"]}')
          print(f'- Code-based: {data[\"code_based_docs\"]}')
          print(f'- Conceptual: {data[\"conceptual_docs\"]}')
          print(f'- Hybrid: {data[\"hybrid_docs\"]}')
          " >> docs_metrics.md
          echo "" >> docs_metrics.md

          # Skills metrics
          echo "## Skills Status" >> docs_metrics.md
          uv run python scripts/skills_validator.py --json > skills.json
          python -c "
          import json
          with open('skills.json') as f:
              data = json.load(f)
          print(f'- Total skills: {data[\"total_skills\"]}')
          print(f'- Checks passed: {data[\"passed_checks\"]}/{data[\"total_checks\"]}')
          print(f'- Errors: {len([e for e in data[\"errors\"] if e[\"severity\"] == \"error\"])}')
          print(f'- Warnings: {data[\"warnings\"]}')
          " >> docs_metrics.md
          echo "" >> docs_metrics.md

          # Review schedule
          echo "## Review Schedule" >> docs_metrics.md
          uv run python scripts/docs_review_scheduler.py --json > review.json
          python -c "
          import json
          with open('review.json') as f:
              data = json.load(f)
          print(f'- Total tracked docs: {data[\"total_tracked_docs\"]}')
          print(f'- Overdue: {data[\"overdue_docs\"]}')
          print(f'- Upcoming (30 days): {data[\"upcoming_docs\"]}')
          print(f'- Current: {data[\"current_docs\"]}')
          " >> docs_metrics.md

          cat docs_metrics.md

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-metrics
          path: app/docs_metrics.md
          retention-days: 90

  unit_tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      - name: Run unit tests
        working-directory: app
        run: uv run pytest tests/unit/ -x --tb=short -q

  # Integration tests — the only tier that executes real Cypher against Neo4j
  # (unit tests mock the driver). Runs the same command as ./dev test-integration:
  # testcontainers spins up the pinned neo4j image via the runner's Docker daemon
  # (preinstalled on ubuntu-latest). addopts is cleared to skip coverage collection,
  # matching scripts/run_tests.py — pass rate is the quality metric here.
  integration_tests:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.py == 'true' || needs.changes.outputs.cypher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25  # testcontainer startup can hang on daemon issues; suite itself is ~2-4 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      - name: Run integration tests
        working-directory: app
        run: uv run pytest tests/integration/ -x --tb=short -q --override-ini=addopts=

  smoke:
    name: Render Smoke Test
    needs: changes
    if: needs.changes.outputs.py == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      # google-chrome-stable is preinstalled on GitHub ubuntu-latest runners.
      - name: Show Chrome version
        run: google-chrome-stable --version

      # Renders the unauthenticated pages (no server / no Neo4j) and loads them in
      # headless Chrome — fails if any page never reaches idle (infinite JS loop /
      # runaway sync work, e.g. the lucide MutationObserver freeze).
      - name: Run render smoke test
        working-directory: app
        run: uv run python scripts/smoke_test.py

  # Deliberately NOT gated by the `changes` path filter: a content-only PR (e.g.
  # a force-added app/docs/content/*.md or app/data/user_vaults/*.md, with no
  # Python change) would skip the py-gated jobs, so the boundary must be checked
  # unconditionally on every PR. Stdlib + git only — no venv/uv install needed.
  content_boundary:
    name: Content Boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Content boundary guard
        working-directory: app
        run: python scripts/audit_content_boundary.py

  # Always-on aggregator. This is the single status to mark required in branch
  # protection. Passes when required jobs succeeded OR were legitimately skipped
  # (path not touched); fails only on a real failure/cancellation.
  gate:
    name: CI Gate
    needs: [changes, mypy, lint, validate_documentation, unit_tests, integration_tests, smoke, content_boundary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          changes_result="${{ needs.changes.result }}"
          mypy_result="${{ needs.mypy.result }}"
          lint_result="${{ needs.lint.result }}"
          docs_result="${{ needs.validate_documentation.result }}"
          unit_tests_result="${{ needs.unit_tests.result }}"
          integration_tests_result="${{ needs.integration_tests.result }}"
          smoke_result="${{ needs.smoke.result }}"
          content_boundary_result="${{ needs.content_boundary.result }}"
          echo "changes=$changes_result  mypy=$mypy_result  lint=$lint_result  docs=$docs_result  unit_tests=$unit_tests_result  integration_tests=$integration_tests_result  smoke=$smoke_result  content_boundary=$content_boundary_result"
          # 'success' and 'skipped' pass; 'failure' and 'cancelled' fail the gate.
          for r in "$changes_result" "$mypy_result" "$lint_result" "$docs_result" "$unit_tests_result" "$integration_tests_result" "$smoke_result" "$content_boundary_result"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required CI job did not pass (result=$r)"
              exit 1
            fi
          done
          echo "CI Gate passed — all required jobs succeeded or were skipped."
