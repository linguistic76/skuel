<div x-data="{ sidebarOpen: window.matchMedia('(min-width: 1024px)').matches &amp;&amp; localStorage.getItem('journal-sidebar') !== 'false' }" class="flex">
  <div class="relative shrink-0 w-[62px] lg:w-auto">
    <div :style="{ width: sidebarOpen ? '274px' : '62px' }" :class="sidebarOpen ? 'max-lg:shadow-xl' : ''" @click.outside="if (sidebarOpen &amp;&amp; !window.matchMedia('(min-width: 1024px)').matches) sidebarOpen = false" @keydown.escape.window="if (sidebarOpen &amp;&amp; !window.matchMedia('(min-width: 1024px)').matches) sidebarOpen = false" class="[--chat-sidebar-w:62px] lg:[--chat-sidebar-w:274px] h-full bg-background border-r border-muted overflow-hidden transition-[width] duration-300 max-lg:absolute max-lg:inset-y-0 max-lg:left-0 max-lg:z-30" style="width: var(--chat-sidebar-w);">
      <div x-show="sidebarOpen" class="flex flex-col h-full bg-muted/50">
<button type="button" aria-label="Collapse sidebar" @click="sidebarOpen = false; if (window.matchMedia('(min-width: 1024px)').matches) localStorage.setItem('journal-sidebar', 'false')">close</button>      </div>
      <div x-show="!sidebarOpen" x-cloak class="flex flex-col items-center gap-3 py-3 px-2 h-full bg-muted/50">
<button type="button" aria-label="Expand sidebar" @click="sidebarOpen = true; if (window.matchMedia('(min-width: 1024px)').matches) localStorage.setItem('journal-sidebar', 'true')">open</button>      </div>
    </div>
  </div>
  <div id="chat">chat</div>
</div>
