<div x-data="{ open: true }" id="item-details-modal">
  <div x-show="open" x-cloak x-data="alpineModal" x-effect="modalToggled(!!(open))">
    <div x-transition="" x-on:click="open = false; $nextTick(() =&gt; document.getElementById('item-details-modal')?.remove())" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
      <div role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="item-details-title" @click.stop="" x-on:keydown.escape.stop="open = false; $nextTick(() =&gt; document.getElementById('item-details-modal')?.remove())" x-on:keydown.tab="modalTrapTab($event)" class="bg-background rounded-lg shadow-lg w-full max-w-2xl p-6 relative max-h-[80vh] overflow-y-auto">
        <div class="flex justify-between items-start gap-3 mb-3">
          <div class="flex items-center gap-2.5">
<span class="flex-none w-2.5 h-2.5 rounded-full" style="background-color: #3B82F6"></span><span class="inline-flex items-center px-[9px] py-0.5 rounded-full text-10 font-semibold uppercase tracking-[0.04em]" style="background-color: #3B82F61f; color: #3B82F6">Habit</span>          </div>
<button aria-label="Close" x-on:click="open = false; $nextTick(() =&gt; document.getElementById('item-details-modal')?.remove())" class="inline-flex items-center justify-center font-medium transition-colors focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 h-8 px-3 text-sm rounded-md hover:bg-accent hover:text-accent-foreground text-muted-foreground hover:text-foreground"><svg class="w-5 h-5" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>        </div>
        <h2 id="item-details-title" class="text-2xl font-bold leading-tight mb-4">Meditate</h2>
        <div class="bg-muted/60 p-4 rounded-lg mb-4">
          <p class="text-10 font-bold uppercase tracking-[0.08em] text-muted-foreground mb-1.5">Schedule</p>
          <p id="item-schedule-text" class="text-sm text-foreground">Aug 01, 12:00 PM - Aug 01, 12:00 PM</p>
        </div>
        <div class="bg-success/5 p-4 rounded-lg mb-4">
          <p class="text-sm font-semibold text-success">
<svg class="w-4 h-4 inline-block mr-1.5 align-[-3px]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg>Current streak: 4 days          </p>
        </div>
        <div class="flex pt-4 border-t border-border">
<button x-on:click="open = false; $nextTick(() =&gt; document.getElementById('item-details-modal')?.remove())" class="inline-flex items-center justify-center font-medium transition-colors focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 h-9 px-4 py-2 rounded-md text-sm hover:bg-accent hover:text-accent-foreground">Close</button>        </div>
      </div>
    </div>
  </div>
</div>
