name: Codex Auto-Review

# ============================================================================
# ⏸️  This comment-bot is DISABLED — and as of 2026-05-25 it is also REDUNDANT,
#     because Codex CLOUD AUTO-REVIEW is now ON in the dashboard. Kept only for
#     reference / possible future use. This repo is gated by CI Gate (+ Kody).
#
# 1. THIS comment-bot (still off). When `@codex review` is posted by
#    `github-actions[bot]`, Codex replies with only the cosmetic "create a Codex
#    account / connect to github" line and NO real review — a bot-posted comment
#    isn't attributed to the connected account. So it added noise without
#    producing reviews; its `pull_request:` trigger stays commented out. (If ever
#    needed, the fix is to post with a PAT secret so the author is `linguistic76`,
#    not the bot — but auto-review below makes that unnecessary.)
#
# 2. Codex CLOUD AUTO-REVIEW (the dashboard feature) is now ON (2026-05-25, on a
#    paid ChatGPT plan): at chatgpt.com/codex/cloud/settings/code-review the
#    "Personal Review Trigger Preference" = "On PR open" and `linguistic76/skuel`'s
#    "Auto code review" = "Review my PRs", so Codex auto-reviews every PR you open.
#    A manual `@codex review` (posted by the human account, e.g. via `gh`) also
#    works — that's the re-review path after pushing more commits.
#
# Codex posts PR reviews/comments, never a status check, so nothing here is
# required in branch protection (that remains "CI Gate"). To turn auto-review
# OFF, change the dashboard trigger preference / repo option. See ./README.md ->
# "One-time dashboard steps" and "Manually requesting a Codex review".
# ============================================================================

on:
  # ⏸️ DISABLED: comment-bot trigger off — it produced only cosmetic responses
  #    (see header), and Codex cloud auto-review (dashboard, "On PR open") now
  #    covers PR-open reviews, so this bot is redundant. Re-enable (with a PAT, not
  #    GITHUB_TOKEN) by uncommenting the two lines below only if ever needed.
  # pull_request:
  #   types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

# One review per burst: a newer push cancels the older run while it is still in
# its debounce sleep, so a flurry of commits collapses to a single trigger.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # post the `@codex review` issue comment

jobs:
  request-codex-review:
    name: Request Codex review
    # Only run on real PR events. The only active trigger is `workflow_dispatch`
    # (the `pull_request:` trigger is commented out), and on a manual dispatch
    # there is no `pull_request` / issue context — so guard explicitly rather than
    # rely on the ambiguous `github.event.pull_request.draft == false` null-compare.
    # Also stay quiet on drafts; the `ready_for_review` event covers draft -> ready.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Debounce burst pushes
        # A newer push to the same PR cancels this run before it posts (see the
        # concurrency block above), so rapid commits yield one review, not many.
        run: sleep 30

      - name: Comment @codex review
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@codex review',
            });
