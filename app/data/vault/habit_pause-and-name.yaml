cue: Any moment of strong reaction — frustration, excitement, anxiety, irritation
routine: |
  1. Notice you're reacting
  2. Pause for one second
  3. Silently name the feeling ("defensive", "anxious", "impatient")
  4. Continue with whatever you were doing
reward: Growing awareness of your patterns / Sense of agency

