description: Five ethical restraints — how you relate to the world around you. Non-violence, truthfulness, non-stealing, wise use of energy, non-possessiveness. The yamas aren't about being "good." They're about reducing the harm that creates noise in your life. When you stop lying, cheating, and grasping, something quieter and more real emerges.
