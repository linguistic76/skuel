type: Task

uid: task:track-one-pattern
title: Track one behavioral pattern for three days
description: |
  Choose one pattern (phone checking, saying yes, procrastinating)
  and observe it for three days. Each evening, write one sentence:
  "When [trigger], I felt [feeling] and I [response]."

  Three days gives you enough data to see if it's a real pattern
  or a one-off. Don't try to change it — just see it clearly.

