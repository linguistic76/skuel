# Kodus (Kody) code-review configuration — config-as-code, schema v2.
#
# Kody reviews the semantic risks SKUEL's mechanical CI cannot prove: incorrect
# behaviour, security boundaries, consequential performance defects, business-logic
# mistakes, and the dashboard-managed Kody Rules. CI stays authoritative for every
# deterministic check (format, lint, types, tests, doc validation, generated-artifact
# freshness, dependency audit) — Kody does not duplicate them.
#
# ⚠️ This file is IGNORED unless the repository-level setting
# `kodusConfigFileOverridesWebPreferences` is ON in app.kodus.io (Settings → Code
# Review → linguistic76/skuel → General). Kodus reads that switch from the web config
# only — declaring it here has no effect, so it is not declared. When ON, Kodus reads
# this file from the default branch (`main`) and merges it over the web settings; keys
# not declared here keep their web value. Top-level keys outside the current schema are
# silently dropped.
#
# Kody Rules are dashboard-only.
# Schema: https://docs.kodus.io/how_to_use/en/code_review/configs/general
# Canonical defaults: https://github.com/kodustech/kodus-ai/blob/main/default-kodus-config.yml

version: 2.0
codeReviewVersion: 'v2'

# On demand only: Kody reviews when a human comments `@kody start-review`, for the
# first review and for every follow-up — mirroring Codex's `@codex review`. The
# mechanical CI Gate is the only automatic gate.
automatedReviewActive: false
reviewCadence:
  type: manual

# Keep Kody's check-run: `./dev pre-merge` reads its conclusion as the verdict signal
# of a clean run, which posts no review object.
showStatusFeedback: true

# No bot approvals (false confidence on a solo repo), but a real CHANGES_REQUESTED on
# critical findings, so a summoned Kody holds the merge.
pullRequestApprovalActive: false
isRequestChangesActive: true
runOnDraft: false

baseBranches:
  - main

# Generated, vendored, secret, or mechanically drift-checked artifacts. Ordinary
# Markdown and Claude skills stay reviewable on purpose.
ignorePaths:
  - '**/*.lock'
  - 'app/package-lock.json'
  - '**/.env'
  - 'app/static/vendor/**'
  - '**/*.min.js'
  - 'app/static/css/output.css'
  - 'app/docs/reference/GRAPH_CONTRACT.yaml'
  - 'app/docs/reference/BASESERVICE_METHOD_INDEX.md'

# The four v2 analysis categories. Kody Rules are not a category — they always run.
reviewOptions:
  bug: true
  security: true
  performance: true
  business_logic: true

# General findings below `high` are dropped; explicit Kody Rules are exempt.
suggestionControl:
  severityLevelFilter: high
  applyFiltersToKodyRules: false

# PR descriptions are written deliberately; Kody adds no generated summary.
summary:
  generatePRSummary: false

# Memories Kody learns from review interactions wait for approval before they
# become persistent guidance.
kodyKnowledgeApproval:
  enabled: true
