description: |
  Six levels of cognitive complexity — from remembering facts to creating something new. Remember, Understand, Apply, Analyze, Evaluate, Create. Most school stops at level two. SKUEL pushes toward the top. Memorizing the niyamas is level one. Applying santosha when you don't get what you want is level three. Evaluating your own patterns of attachment is level five. Creating a personal practice is level six.
