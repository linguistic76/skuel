description: |
  Stories are how humans have always learned about life. Not textbooks — stories. Parables, myths, personal narratives, films, novels. A good story teaches you what a lecture can't: how it feels to be in someone else's situation. SKUEL uses stories as learning tools because the brain processes narrative differently than facts. Stories stick. They change you.
