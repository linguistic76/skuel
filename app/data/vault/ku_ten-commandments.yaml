description: One of the oldest ethical codes — ten principles for living in relationship with the sacred and with each other. Don't kill. Don't steal. Don't lie. Honor your parents. Rest. Whether you're religious or not, these resonate because they address universal human challenges. Every culture has some version. SKUEL studies them as part of understanding how humans have always tried to codify what matters.
