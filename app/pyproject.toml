[tool.ruff.lint.per-file-ignores]
# ============================================================================
# ANN401 DEBT LEDGER — `Any` in a signature is ENFORCED, except where bought out
# ============================================================================
# ANN401 is selected globally (via "ANN" above) and is NO LONGER in the `ignore`
# list. The default is now enforce; each tree below buys its way out explicitly.
# `core/ports/` is the one tree with debt-free enforcement by design: an `Any` in a
# protocol signature propagates to every implementer, which is the defect class the
# SoC arc was chasing. It has no entry, and `ruff check --select ANN401 core/ports`
# is 0 (PR #851 deleted 15 sites, PR #852 tightened the surviving 39).
#
# This is a LEDGER, not a policy. Drive an entry to 0 and DELETE it — same shape as
# the SKUEL023 facade allowlist, driven to empty twice and then deleted (#828, #838).
# Consequently a tree that is ALREADY clean gets no ANN401 exemption and is enforced
# too. Probing all 209 directories that hold tracked `.py` files shows ANN401 fires in
# exactly five places: `core/ports/` (the target, and it is flat — no subdirectories),
# `core/ingestion/`, `core/prompts/`, loose files directly under `core/` other than
# `core/errors.py`, and the app root (`main.py`, `vulture_whitelist.py`). Adding an
# `Any` signature in any of them fails CI, deliberately.
# `tests/`, `ui/` and `examples/` never reach this ledger — they are exempt from the
# whole `ANN` linter in their own entries below. (A `templates/` entry sat alongside
# them until it was swept out: no root-level `templates/` tree exists. The pattern was
# root-anchored — measured — so it never covered the six nested `templates/`
# directories either. Three of those six hold tracked `.py`: `core/models/templates/`
# (23) and `core/services/templates/` (1) are ANN-enforced and reach this ledger via
# their parent `core/models/**` and `core/services/**` entries; `tests/templates/` (1)
# is ANN-exempt under `tests/**/*.py`. The other three hold no Python at all.)
#
# `core/` is enumerated one subtree at a time because any pattern rooted at `core/`
# alone also covers `core/ports/`. `core/services/**/*.py` and friends are safe: the
# literal prefix anchors them. No companion `core/services/*.py` entry is needed —
# ruff's `**` matches ZERO path components, so `X/**/*.py` already covers `X/child.py`
# (measured: `core/**/*.py` suppresses `core/errors.py`).
#
# ⚠ MEASURED GLOB TRAP: in ruff 0.15.22 a `*` in a per-file-ignores pattern CROSSES
# `/`. `"core/*.py"` therefore matches every `.py` anywhere under `core/`, `core/ports/`
# included, silently exempting the one tree this ledger exists to enforce. That is why
# the loose files under `core/` are named individually — never widen them to a glob.
# The first draft of this ledger shipped `"core/*.py"` and enforced nothing; only
# injecting an `Any` into `core/ports/` and demanding ANN401 fire caught it.
#
# Counts measured 2026-07-28 on `15be165c5`; total 1564.
#
# ⚠ TO RE-COUNT AN ENTRY YOU MUST OVERRIDE THIS TABLE. `--select` enables a rule; it
# does NOT override `per-file-ignores`, so a bare `ruff check --select ANN401 <tree>`
# applies the very exemption you are measuring and reports 0:
#   cd app && uv run ruff check --select ANN401 \
#       --config 'lint.per-file-ignores = {}' core/services      # -> 380
# Clearing the table is safe for these counts: no ledger tree carries any other
# ANN exemption, and both measurement methods agree entry for entry.
#
# 1564 is the SUM of the entries below, not the output of one tree-wide command —
# clearing the table also drops the blanket `ANN` exemption on tests/, ui/, examples/
# and templates/, which takes a tree-wide run to 2536.
#
# NOTE: ANN401 sees only *top-level* `Any` in a parameter or return annotation — a
# nested `dict[str, Any]` is invisible to it (measured), so these counts are a floor
# on the real `Any` debt, not the whole of it.
"adapters/**/*.py" = ["ANN401"]                # 853
"core/services/**/*.py" = ["ANN401"]           # 380
"core/utils/**/*.py" = ["ANN401"]              # 110
"services_bootstrap/**/*.py" = ["ANN401"]      # 72
"core/models/**/*.py" = ["ANN401"]             # 66
"scripts/**/*.py" = ["ANN401"]                 # 53
"core/errors.py" = ["ANN401"]                  # 6  (core/constants.py is clean -> enforced)
"core/auth/**/*.py" = ["ANN401"]               # 3
"core/config/**/*.py" = ["ANN401"]             # 3
"core/events/**/*.py" = ["ANN401"]             # 3
"agent/**/*.py" = ["ANN401"]                   # 3
"core/orchestrator/**/*.py" = ["ANN401"]       # 1
# + "core/infrastructure/**/*.py" (11) — that key already exists further down with
#   six other codes, so its ANN401 is appended there rather than duplicated here
#   (a repeated key is a TOML error). 853+380+110+72+66+53+11+6+3+3+3+3+1 = 1564.

# Standard test/example ignores
"tests/**/*.py" = ["ANN", "ARG001", "ARG002", "S101", "E731", "RUF012", "SIM117", "B017", "PTH110"]  # Tests: fixtures, mocking, os.path allowed
"tests/integration/**/*.py" = ["ANN", "ARG002", "S101", "RUF012", "SIM117", "B017"]  # Integration tests: unused fixtures + broad exceptions
"main.py" = ["T201"]                                          # Main entry point can use print

# FastHTML UI files - star imports are intentional design pattern
"adapters/inbound/*ui*.py" = ["F405", "RUF001", "ARG001", "ARG004", "ANN202"]  # UI components + request param + no return types
"adapters/inbound/*_routes.py" = ["F405", "ARG001", "ANN202", "F811"]  # Route handlers + FastHTML + duplicate imports
"adapters/inbound/*_api.py" = ["RUF003", "ARG001", "ARG005", "ANN202"]  # API routes + unused params (incl lambda) + no return types

# UI component files - PascalCase function names are intentional (FastHTML convention)
"ui/*.py" = ["N802", "RUF001", "RUF002"]              # Shared UI components use PascalCase + Unicode icons
"ui/**/*.py" = ["F405", "N802", "RUF001", "RUF002", "RUF012", "ARG001", "ARG002", "ANN", "PERF401"]  # UI: PascalCase + Unicode + class defaults

# Examples are documentation (Phase 8.1)
"examples/**/*.py" = ["ANN", "T201", "ARG", "E731", "RUF001"]  # Examples can use lambdas + Unicode

# Core utilities with special import patterns
"core/utils/result_simplified.py" = ["E402"]  # Has from __future__ import before docstring (correct per PEP 8)

# Standalone scripts — the narrow, justified set (pruned 2026-07 from a broad
# 11-code list that also masked E999 syntax errors):
#   E402 — scripts run directly and require setup before imports
#           (sys.path.insert() for core.* imports, load_dotenv() before
#           core.config). Standard standalone-script practice.
#   ARG  — unused interface/callback parameters (argparse handlers, protocol
#           conformance); scripts are utilities, not API contracts.
#   RUF001/002/003 — intentional Unicode/emoji in CLI output (✅⚠️→×), same
#           precedent as the targeted infra-file ignores above.
"scripts/*.py" = ["E402", "ARG", "RUF001", "RUF002", "RUF003"]  # Scripts: setup imports, CLI emoji

# Infrastructure files - intentional Unicode in documentation
"adapters/inbound/auth/session.py" = ["RUF001"]  # Session management uses Unicode indicators

# Files with intentional unused parameters (protocols, future implementation, or framework requirements)
"core/models/validation_rules.py" = ["ARG001", "ARG002"]  # Pydantic field_validators require cls but may not use it
"core/services/dsl/*.py" = ["ARG002", "SIM116"]   # DSL visitor pattern + if/elif chains for mapping
"core/services/intelligence/*.py" = ["ARG001", "ARG002"]  # Calculator methods reserve params for future
"adapters/persistence/neo4j_adapter.py" = ["ARG002"]  # Adapter method signatures
"adapters/vault/*.py" = ["ARG002"]  # Filesystem adapter implements VaultBridgePort; user_uid unused in single-user local impl
"core/services/*_service.py" = ["ARG002", "PERF401"]  # Service method signatures implement protocols
"core/services/*/[!_]*.py" = ["ARG002", "ARG004", "RUF012", "PERF401", "SIM102", "SIM108", "SIM116"]  # Nested service modules + class config
"core/services/infrastructure/*.py" = ["ARG002"]  # Infrastructure helpers
"core/infrastructure/**/*.py" = ["ARG001", "ARG002", "PERF401", "SIM116", "RUF002", "B021", "ANN401"]  # Route factories + batch helpers; ANN401 (11) belongs to the debt ledger at the top of this table
"core/services/relationships/*.py" = ["ARG002", "PERF401", "SIM108"]  # Relationship services + patterns
"core/services/user/*.py" = ["ARG002", "PERF", "F822"]  # User services implement protocols + complex context ops
"core/models/search/*.py" = ["ARG001", "ARG002", "RUF012", "E741"]  # Search scoring methods + class config + var names

# NOTE: "core/services/**/*.py" and "adapters/**/*.py" used to sit here as empty
# lists carrying APOC comments. They ignored nothing — APOC placement is SKUEL001 in
# scripts/lint_skuel.py, not a ruff rule — and both keys now live in the ANN401 debt
# ledger at the top of this table.

# ============================================================================
# DEFERRED IMPLEMENTATIONS — intentionally unused parameters
# ============================================================================
# The previous header cited docs/reference/DEFERRED_IMPLEMENTATIONS.md, which does not
# exist. The LIVE register for this class of debt is docs/reference/PLACEHOLDER_INDEX.md
# ("Placeholder Parameter Index", Groups A–J) — that is where a deferred parameter gets
# recorded, not here. Of the four tag families the old header named, only FUTURE-IMPL-*
# survives in code (6 sites in goal_event_handler_service.py, goals_progress_service.py
# and lp_progress_service.py, repointed at PLACEHOLDER_INDEX.md § Groups E/I in 2026-07).
#
# ⚠ MOST OF THIS BLOCK WAS DEAD, for a reason worth keeping: SKUEL marks a deferred
# parameter by UNDERSCORE-PREFIXING it (`_user_uid`), and ruff's ARG rules already skip
# underscore-prefixed args. A per-file ARG002 exemption is therefore a hand-rolled
# duplicate of a convention that already handles it. Measured with the whole table
# cleared, three such entries reported ZERO violations and were deleted
# (askesis/context_retriever.py, askesis/query_processor.py, lp/lp_progress_service.py —
# the last also named `newly_mastered_ku`, a parameter absent from the file). Before
# adding an entry here, check whether underscore-prefixing is the real fix.

# Future personalization (FUTURE-IMPL-008) — `current_streak` is genuinely unused and NOT
# underscore-prefixed, so this is the one entry in the block with a live violation behind
# it. (Three broader keys also suppress it, so it is documentation more than mechanism.)
"core/services/goals/goals_progress_service.py" = ["ARG002"]       # FUTURE-IMPL-008: current_streak

# FastHTML route handlers — request/current_user injected by decorators
"adapters/inbound/_pathstep_template_routes_helpers.py" = ["ARG001"]

# ============================================================================
# SKUEL PATTERN EXCEPTIONS (January 2025)
# ============================================================================
# Lambda exceptions: E731 (Do not assign a lambda expression, use a def)
"core/utils/sort_functions.py" = ["F811"]     # Named sort functions, duplicate defs for backwards compat

# hasattr() exceptions: Checked via custom SKU002 rule
# Allowed in: core/utils/sort_functions.py (duck typing for generic utilities)

[tool.ruff.lint.isort]
known-first-party = [
    "adapters", "config", "database",
    "events", "models", "monitoring", "ports", "services",
    "tests", "utils"
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["rt", "ft", "Div", "H1", "P", "Button", "Form", "Input"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "fasthtml.common.ft"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80
