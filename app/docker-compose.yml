# docker-compose.yml — Unified SKUEL Development Stack
# =====================================================
# Single command to start everything: docker compose up
#
# Services: Neo4j -> SKUEL App -> Prometheus -> Grafana
#
# WORKFLOWS:
#   Full stack (Docker):     docker compose up
#   Full stack (detached):   docker compose up -d
#   Neo4j only (local dev):  docker compose up neo4j -d
#                            uv run python main.py
#   With monitoring:         docker compose --profile monitoring up
#
# Neo4j config extends infrastructure/docker-compose.yml (single source
# of truth). This file overrides only what differs for the app stack:
#   - No GenAI plugin (embeddings are OpenAI Python-side per ADR-068)
#   - Memory defaults for dev environments
#   - skuel-network for inter-container communication
#
# For production deployment, see docker-compose.production.yml
# =====================================================

services:
  # --------------------------------------------------------------------------
  # Neo4j Graph Database
  # --------------------------------------------------------------------------
  # Extends infrastructure/docker-compose.yml — overrides only the deltas.
  # Volume paths resolve relative to the base file (infrastructure/neo4j/).
  # --------------------------------------------------------------------------
  neo4j:
    extends:
      file: ../infrastructure/docker-compose.yml
      service: neo4j
    environment:
      # Override: APOC only — no GenAI plugin (embeddings are OpenAI Python-side)
      NEO4J_PLUGINS: '["apoc"]'
      # Override: dev-friendly memory defaults
      # AURA-TEMPORARY: self-host-only — AuraDB sizes memory by instance tier.
      # See docs/deployment/AURADB_MIGRATION_GUIDE.md § 6.2.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INIT:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1500M}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-2G}"
      # Override: APOC meta only — no GenAI procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.meta.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.meta.*"
    networks:
      - skuel-network

  # --------------------------------------------------------------------------
  # SKUEL Application
  # --------------------------------------------------------------------------
  skuel-app:
    build: .
    container_name: skuel-app
    environment:
      # Neo4j — use Docker service name, overrides .env bolt://localhost:7687
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      # Application
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8000}
      APP_DEBUG: ${APP_DEBUG:-false}
      # The app's default time zone — blank when unset, which the app reads as
      # its own default (America/Vancouver)
      SKUEL_TIMEZONE: ${SKUEL_TIMEZONE:-}

      # AI Services — no HF_API_TOKEN passthrough: the BGE/HuggingFace
      # provider is staged, not selectable via create_embedding_client()
      # (ADR-068 — OpenAI now, BGE later)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - .:/app
      # Keep the container's venv OFF the host bind mount. The image builds
      # .venv at /app/.venv (Dockerfile `uv sync`); without this anonymous
      # volume the `.:/app` mount masks it, so `uv run` re-syncs onto the host
      # as root — clobbering the host .venv and breaking host-side `uv`/tests.
      - /app/.venv
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - skuel-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Firefly III — accounting ledger (expenses, budgets, reporting)
  # --------------------------------------------------------------------------
  # ADR-052: SKUEL delegates accounting to Firefly III (AGPL-v3 Laravel app).
  # Its one planned SKUEL write is the revenue sync (ChargeKeep payment →
  # a deposit in the skuel book). Invoicing is ChargeKeep's (ADR-062), not
  # Firefly's and not SKUEL's.
  #
  # UI: http://localhost:8081
  # API: http://firefly:8080 (inside skuel-network)
  #
  # Two user accounts live on this single instance — one for Mike's personal
  # finances, one for SKUEL business finances — each with its own Personal
  # Access Token. SKUEL's client reads FIREFLY_PAT_SKUEL / FIREFLY_PAT_PERSONAL
  # through get_credential() (the configured credential backend, .env
  # fallback); the revenue sync needs only the skuel-book PAT. Everything in
  # ${...} below is Compose interpolation from the environment, and the
  # secrets live in the keychain — start these through scripts/dev/with-secrets.
  #
  # Images are pinned by tag AND digest and bumped by hand — Renovate leaves
  # the app compose images manual (renovate.json). A Firefly bump runs Laravel
  # migrations on start: docs/domains/finance.md
  # § Pinned images and upgrading Firefly.
  # --------------------------------------------------------------------------
  firefly-db:
    image: mariadb:11.8.6@sha256:f5644a292224cdf4b6514aca38b3b4436f0b0443d54170a472cd14261f31402d
    container_name: skuel-firefly-db
    profiles: ["finance"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly-local-dev}
      MYSQL_DATABASE: firefly
    volumes:
      - firefly-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - skuel-network

  firefly:
    image: fireflyiii/core:version-6.7.9@sha256:a2b53539338d1cd04d341b229c3806cb178cf64c72459060e3ed34bec4167bd8
    container_name: skuel-firefly
    profiles: ["finance"]
    ports:
      - "8081:8080"
    environment:
      APP_ENV: local
      APP_KEY: ${FIREFLY_APP_KEY}              # MUST start with "base64:" — generate with: printf "base64:%s\n" "$(head -c 32 /dev/urandom | base64)"
      DB_CONNECTION: mysql
      DB_HOST: firefly-db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly-local-dev}
      APP_URL: http://localhost:8081
      TRUSTED_PROXIES: "**"
      DEFAULT_LANGUAGE: en_US
      TZ: ${TZ:-UTC}
    volumes:
      - firefly-upload:/var/www/html/storage/upload
    depends_on:
      firefly-db:
        condition: service_healthy
    # No healthcheck here: the image ships its own (curl → $HEALTHCHECK_PATH,
    # /healthcheck), which firefly-importer's service_healthy waits on. An
    # override must use curl or php — the image has no wget.
    restart: unless-stopped
    networks:
      - skuel-network

  # Firefly Data Importer — optional CSV/bank import tool
  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: skuel-firefly-importer
    profiles: ["finance"]
    ports:
      - "8082:8080"
    environment:
      FIREFLY_III_URL: http://firefly:8080
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_PAT_SKUEL:-}
      TZ: ${TZ:-UTC}
    depends_on:
      firefly:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skuel-network

  # --------------------------------------------------------------------------
  # Prometheus — Metrics Collection
  # --------------------------------------------------------------------------
  # Scrapes /metrics from skuel-app:8000 every 15s
  # UI: http://localhost:9090
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: skuel-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - skuel-network

  # --------------------------------------------------------------------------
  # Grafana — Metrics Visualization
  # --------------------------------------------------------------------------
  # UI: http://localhost:3000 (default: admin/admin)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.0
    container_name: skuel-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - skuel-network
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  skuel-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  firefly-db-data:
  firefly-upload:
