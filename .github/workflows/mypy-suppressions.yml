name: MyPy Suppression Audit

# Finds mypy suppressions that suppress nothing — the SKUEL026 analogue for
# `disable_error_code` entries and `[[tool.mypy.overrides]]` blocks. See
# app/scripts/health/mypy_suppressions.py for the measurement and the reasoning.
#
# WHY THIS IS SCHEDULED AND NOT A PR CHECK
#
# The audit needs one mypy run per (block, code) pair plus a baseline — ~80s —
# which is affordable but not free, and none of its findings are urgent: a
# vacuous suppression is inert until someone writes the first violation it would
# eat. So there is nothing for it to block.
#
# Path-scoping a PR job to app/pyproject.toml would also only catch half the
# drift. The dangerous half is the other half: source gets fixed, the last error
# of some code disappears, and an entry that was load-bearing yesterday becomes a
# silent trap — with pyproject.toml untouched, so no path filter fires. Only a
# run that is not gated on the config file catches that, and drift here accrues
# over months (#876's finds had been dead a long time). Weekly is the right
# cadence.
#
# It stays OUT of ci.yml deliberately: that workflow's path-scoped jobs all feed
# the `gate` job that branch protection requires, and this check is advisory.
#
# The failure path opens an issue on purpose. mypy has been printing
# `unused section(s)` on every run for months and nobody read it — a red
# scheduled run that lands nowhere would reproduce exactly that failure.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit mypy suppressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.14-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --frozen --no-install-project

      # The audit's own exit code is the finding signal, and it is captured rather
      # than allowed to fail the step. The script's contract is exactly:
      #   0 — clean
      #   1 — CONFIRMED findings, and nothing else
      #   2 — the instrument could not measure (a mypy run that did not complete,
      #       a malformed pyproject.toml, any unexpected exception)
      # `failure()` cannot tell those apart — under it, a broken checkout or a
      # failed `uv sync` would open an issue asserting that suppressions had gone
      # dead (Codex #883). Note the script must never leak Python's default
      # exit-1-on-uncaught-exception into this gate; `run_cli` maps every
      # non-finding outcome to 2 for that reason. The job is still failed at the
      # end, by the last step.
      - name: Run the suppression audit
        id: audit
        working-directory: app
        run: |
          # Actions runs this under `bash -e`, so capture with `|| rc=$?` rather
          # than a `| tee` pipeline: piping would make the step's status tee's,
          # and reading the real code back out depends on PIPESTATUS surviving
          # the -e semantics. Redirect-then-cat has neither subtlety.
          rc=0
          uv run python scripts/health/mypy_suppressions.py --census > audit_output.txt 2>&1 || rc=$?
          cat audit_output.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Audit exited $rc"

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-suppression-audit
          path: app/audit_output.txt
          retention-days: 30

      - name: Open an issue when suppressions have gone dead
        if: steps.audit.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('app/audit_output.txt', 'utf8');
            } catch (e) {
              body = 'The audit failed before producing output — see the run log.';
            }
            // Strip ANSI so the issue body is readable.
            body = body.replace(/\x1b\[[0-9;]*m/g, '');

            const title = 'MyPy suppressions have gone dead';
            const marker = '<!-- mypy-suppression-audit -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueBody = [
              marker,
              'The weekly [mypy suppression audit](' + runUrl + ') found suppressions that suppress nothing.',
              '',
              'A `disable_error_code` entry measuring 0 errors will silently eat the FIRST real',
              'violation of that code in its scope. An unused override section matches no module',
              'at all. Both should be deleted — see `app/scripts/health/mypy_suppressions.py`.',
              '',
              '```',
              body.trim(),
              '```',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const prior = existing.data.find(i => i.body && i.body.includes(marker));

            if (prior) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body: 'Still failing as of the latest run.\n\n' + issueBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
              });
            }

      # Fail the job for BOTH real findings and an aborted instrument — an audit
      # that could not measure must not read as a green week.
      - name: Fail the job on findings or an aborted audit
        if: steps.audit.outputs.exit_code != '0'
        run: |
          rc='${{ steps.audit.outputs.exit_code }}'
          if [ "$rc" = '1' ]; then
            echo "::error::Dead mypy suppressions found — see the issue and the audit artifact."
          elif [ "$rc" = '2' ]; then
            echo "::error::The audit aborted before measuring (a mypy run did not complete). No findings are implied."
          else
            echo "::error::The audit did not run to completion (exit '$rc')."
          fi
          exit 1
