name: Codex Auto-Review

# ============================================================================
# ⏸️  DISABLED 2026-05-22 — comment-bot trigger off, AND Codex auto-review is
#     intentionally OFF in the dashboard. This repo is gated by Kody + CI Gate.
#
# Two separate things are off, for two different reasons:
#
# 1. THIS comment-bot. When `@codex review` is posted by `github-actions[bot]`,
#    Codex replies with only the cosmetic "create a Codex account / connect to
#    github" line and NO real review — a bot-posted comment isn't attributed to
#    the connected account. So this workflow added noise without producing
#    reviews; its `pull_request:` trigger is commented out.
#
# 2. Codex CLOUD AUTO-REVIEW (the dashboard feature). Intentionally set to OFF
#    on 2026-05-22: at chatgpt.com/codex/cloud/settings/code-review the "Personal
#    auto review preferences" toggle is OFF and `linguistic76/skuel` is set to
#    "Follow personal preferences" (which resolves to off). There is no per-repo
#    hard-off in that UI — the personal toggle is the switch. Codex now reviews
#    ONLY when a human posts `@codex review` on a PR.
#
# Why off rather than on: cloud auto-review was always best-effort — it fired on
# only ~1 of 4 PRs historically and draws from a weekly shared usage limit. Kody
# (Kodus) is the dependable gating reviewer and CI Gate is the required check, so
# Codex was never part of the gate. Off keeps the signal clean.
#
# TO RE-ENABLE Codex auto-review: flip the "Personal auto review preferences"
# toggle ON (or set the repo to "Review all PRs") in the dashboard. To re-enable
# THIS comment-bot instead: uncomment the `pull_request:` trigger below. Either
# way, verify with the throwaway-PR test in ./README.md -> "Verifying /
# re-enabling a reviewer". Codex posts PR reviews/comments, never a status check,
# so nothing here is required in branch protection (that remains "CI Gate").
# ============================================================================

on:
  # ⏸️ DISABLED: comment-bot trigger off — it produced only cosmetic responses
  #    (see header). Codex auto-review is also intentionally off in the dashboard,
  #    so Codex reviews only on a manual `@codex review`. Re-enable this bot by
  #    uncommenting the two lines below.
  # pull_request:
  #   types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

# One review per burst: a newer push cancels the older run while it is still in
# its debounce sleep, so a flurry of commits collapses to a single trigger.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # post the `@codex review` issue comment

jobs:
  request-codex-review:
    name: Request Codex review
    # Stay quiet on drafts; the `ready_for_review` event covers draft -> ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Debounce burst pushes
        # A newer push to the same PR cancels this run before it posts (see the
        # concurrency block above), so rapid commits yield one review, not many.
        run: sleep 30

      - name: Comment @codex review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@codex review',
            });
