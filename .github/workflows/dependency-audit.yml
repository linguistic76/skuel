name: Scheduled Dependency Audit

# Runs the dependency CVE audit on a clock, independent of any diff.
#
# WHY A SCHEDULE AND NOT A PR CHECK
#
# A dependency audit's input changes on someone else's clock. An advisory is
# published against a lockfile nobody touched, so there is no diff to trigger on
# and no PR to attach to. ci.yml's `dep_audit` job (required) audits both locked
# ecosystems, but it is gated on the `py`/`audit` path filters — a quiet stretch
# with no matching changes is an unwatched stretch.
#
# That is not hypothetical. undici 7.28.0 sat in package-lock.json accruing five
# high advisories with zero file changes, and surfaced only because someone ran
# ./dev quality by hand (PR #929, ADR-067 § 5). Path-scoping an audit into the
# js_tests job would NOT have caught it: the `js` filter needs one of
# static/js/**, tests/js/**, package*.json or vitest.config.js to change, and
# none did. Only a run that is not gated on a diff catches this class.
#
# WHY IT OPENS AN ISSUE
#
# Same reason mypy-suppressions.yml does: a red scheduled run that lands nowhere
# is indistinguishable from no check at all.
#
# There is ONE always-open status issue, never closed. Every run — clean,
# findings, or could-not-measure — writes the current state through the same
# path, and a comment is raised only when the reported content changes, so daily
# cadence does not mean 365 comments. An earlier design closed the issue on a
# clean run; four review rounds found defects in that one seam, all of them
# caused by "clean" being a special path that REMOVED state. See the action.
#
# (Historical: before the osv-scanner consolidation this workflow ran two jobs —
# pip-audit and npm audit — with one issue per ecosystem. Those markers,
# scheduled-dependency-audit-python and scheduled-dependency-audit-js, are
# retired; their issues were closed by hand when this landed.)
#
# WHY IT STAYS OUT OF ci.yml
#
# ci.yml's jobs feed the `gate` job that branch protection requires, and a
# required check needs a PR to attach to — this class of finding has none. The
# PR-side gate already exists (`dep_audit`, same script, required); this
# workflow is the diff-independent backstop. The historical second reason —
# "npm audit has no per-advisory accept mechanism, so a no-fix advisory would
# wedge every merge" — was retired with npm audit itself: osv-scanner.toml
# accepts findings per-advisory, with a reason and an ignoreUntil expiry, for
# both ecosystems (ADR-067 § 6e).
#
# WHAT A RUN CAN PROVE
#
# audit_dependencies.sh carries an explicit three-state exit contract —
# 0 measured-clean, 1 measured-findings, anything else NOT measured (stale
# lock, missing tool, package-count mismatch, scanner failure) — and asserts
# that the number of packages scanned equals the number the lockfiles declare,
# so a partial scan cannot read as clean. The old npm-audit JSON probe existed
# to reconstruct exactly this distinction from the outside; the script now
# states it directly, and this workflow just renders it.

on:
  schedule:
    # Daily. Advisories land continuously; weekly would mean up to 7 days of
    # unseen exposure. Offset from mypy-suppressions.yml (Mondays 06:00).
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Marker-issue mutation is read-then-write, so two overlapping runs (a manual
# dispatch racing the cron, or two dispatches) can both complete the lookup before
# either writes — creating duplicate marker issues, or letting an older findings run
# reopen state a newer clean run just resolved. Serialize every run of this workflow.
# cancel-in-progress is FALSE on purpose: cancelling mid-run could leave an issue
# half-updated, and a cancelled audit is a silently skipped audit.
concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency CVE audit (both ecosystems)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Ordering key for the marker issue. Concurrency serializes runs but does not
      # order them, so a result must carry the revision it describes.
      - name: Record the revision this result describes
        id: rev
        run: echo "ts=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      # continue-on-error on BOTH tool installs, because a failure there must
      # still be REPORTED. Subsequent steps carry an implicit success() check,
      # so an unguarded download blip would abort the job before the audit ran
      # and skip the Report step entirely — landing only in the Actions log,
      # which is the exact failure mode this workflow exists to prevent. The
      # audit script checks for each tool itself and exits 3 (could-not-measure)
      # with an honest message, which routes the failure through the issue.
      - name: Install uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install osv-scanner
        continue-on-error: true
        uses: ./.github/actions/install-osv-scanner

      # The same script ci.yml's dep_audit job and ./dev quality check 8 run —
      # one path, so a finding here and a finding there can never disagree.
      # Captured with `|| rc=$?` rather than a pipeline: Actions runs this under
      # `bash -e`, and piping would make the step's status belong to the last
      # command in the pipe.
      - name: Audit locked dependencies
        id: audit
        working-directory: app
        run: |
          rc=0
          bash scripts/audit_dependencies.sh > audit.txt 2>&1 || rc=$?
          cat audit.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # Render the exact text the issue will show, then hash THAT: "the
          # result changed" and "what we display changed" must be the same
          # statement. ANSI is stripped because colour is not part of the
          # finding; the output is capped so a pathological run cannot blow the
          # 65536-character issue-body limit, and the cap is applied BEFORE
          # hashing so the digest continues to describe exactly what is
          # rendered. Strip and truncate as two steps, not a pipeline —
          # `sed | head -c` is a SIGPIPE trap under pipefail (see PR #931).
          sed 's/\x1b\[[0-9;]*m//g' audit.txt > audit-stripped.txt
          head -c 30000 audit-stripped.txt > audit-clean.txt
          if [ "$(wc -c < audit-stripped.txt)" -gt 30000 ]; then
            echo "" >> audit-clean.txt
            echo "_Truncated at 30000 characters. The full report is in the audit-output artifact on this run._" >> audit-clean.txt
          fi
          # Build the COMPLETE issue body here — prose included — so the digest
          # covers everything the reader sees. The three states mirror the
          # script's exit contract; this block adds prose, never a verdict of
          # its own.
          {
            if [ "$rc" -eq 0 ]; then
              # NOT "no known vulnerabilities": the scanner exits zero when
              # every finding matches an accepted entry in app/osv-scanner.toml,
              # and this repo currently accepts several. The captured output
              # names each accepted finding and the earliest ignoreUntil expiry.
              echo "**No unaccepted findings** across both locked ecosystems"
              echo "(\`app/uv.lock\` + \`app/package-lock.json\`, all severities, OSV)."
              echo "Accepted findings in \`app/osv-scanner.toml\` may still be present —"
              echo "the output below names them and their expiries. Package counts were"
              echo "verified against the lockfiles, so this is a measured result."
            elif [ "$rc" -eq 1 ]; then
              echo "**Unaccepted findings.** osv-scanner reported advisories not"
              echo "dispositioned in \`app/osv-scanner.toml\` (or an accepted entry's"
              echo "\`ignoreUntil\` has lapsed — re-examine it rather than re-dating it"
              echo "reflexively)."
              echo ""
              echo "- Upgrade the dependency (triage order: **ADR-067 § 6a** — \`npm ls\` /"
              echo "  \`uv tree\` for the parent, then a patched release *inside the declared"
              echo "  range* before any bump or override), or"
              echo "- Accept it in \`app/osv-scanner.toml\` with a reason and an \`ignoreUntil\`."
            else
              echo "**The audit could not measure** (\`scripts/audit_dependencies.sh\`"
              echo "exited \`$rc\`). **No claim is made about whether vulnerabilities"
              echo "exist.** The script's exit contract reserves this state for: a stale"
              echo "\`uv.lock\`, a missing tool (uv / osv-scanner), a package-count"
              echo "mismatch (partial scan), or a scanner/API failure — the output below"
              echo "says which. Transient network failures clear on a re-run."
            fi
            echo ""
            echo '```'
            cat audit-clean.txt
            echo '```'
            echo ""
            echo "Policy: \`app/docs/decisions/ADR-067-dependency-upgrade-policy.md\`."
          } > audit-body.md
          digest=$(sha256sum audit-body.md | cut -c1-16)
          {
            echo "digest=$digest"
            echo "report<<__AUDIT_REPORT_EOF__"
            cat audit-body.md
            echo "__AUDIT_REPORT_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Audit exited $rc"

      # ONE write, every state — clean / findings / could-not-measure all travel
      # the same path, which is what keeps the clean revision stamped and the
      # ordering guard fed (see the action for why there is no resolve path).
      # Default-branch only: workflow_dispatch accepts --ref, and a branch run
      # would otherwise stamp the repo-wide marker with that ref's commit
      # timestamp. A branch dispatch still RUNS the audit — it just does not
      # write issues.
      - name: Report
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./.github/actions/file-audit-issue
        with:
          marker: scheduled-dependency-audit
          title: 'Dependency audit'
          digest: ${{ steps.audit.outputs.digest }}
          revision_ts: ${{ steps.rev.outputs.ts }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.audit.outputs.report }}

      # Deliberately AFTER Report. Steps carry an implicit success() check, so a
      # transient artifact-service failure ahead of Report would skip it and
      # leave the status issue stale — the artifact is a convenience, the issue
      # is the promise.
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-output
          path: app/audit.txt
          retention-days: 30

      # Fail for BOTH findings and an aborted instrument — an audit that could
      # not measure must not read as a green day.
      # env, not interpolation: a `${{ }}` expression is pasted in BEFORE bash
      # parses, so any backtick or $( ) in a value would execute as code. This
      # value is numeric today, but the rule is the mechanism, not the contents.
      - name: Fail the job
        if: steps.audit.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          echo "::error::Dependency audit exited $EXIT_CODE — see the issue and the artifact."
          exit 1
