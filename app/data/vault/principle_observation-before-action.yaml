version: 1.0
type: Principle

uid: principle:observation-before-action
name: Observation Before Action
statement: I observe my patterns before trying to change them
description: |
  Understanding comes before change. Trying to fix a pattern you
  haven't clearly seen leads to brute-force willpower that burns out.
  Trying to fix a pattern you have clearly seen often resolves on its own —
  awareness changes behavior without needing a plan.

category: personal
source: personal
strength: strong

tradition: Contemplative Psychology / Acceptance and Commitment Therapy
original_source: Jon Kabat-Zinn, Russ Harris, Tara Brach
personal_interpretation: |
  In self-reflection, the impulse to fix yourself is the biggest trap.
  You see a pattern you don't like and immediately try to override it.
  But the pattern exists for a reason. Observing it — really seeing
  the trigger, the feeling, the response — often changes the pattern
  naturally, without force.

connections:
  grounded_in_knowledge:
    - ps:self-reflection:noticing-patterns
    - ps:self-reflection:emotional-awareness
  guides_goal:
    - goal:self-reflection-beginner
  inspires_habit:
