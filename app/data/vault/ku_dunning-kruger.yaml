# When you know a little, you think you know a lot.

version: 1.0
type: Ku

uid: ku:mind:dunning-kruger
title: Dunning-Kruger Effect
namespace: mind
ku_category: concept
heading: "### Cognitive Biases"
aliases:
  - overconfidence effect
  - competence illusion
source: research
sel_category: self_awareness
description: |
  When you know a little, you think you know a lot. When you know a lot, you realize how little you know. Beginners overestimate their competence because they can't see what they're missing. Experts underestimate theirs because they see the full complexity. The cure is the same in both directions: stay humble, keep learning, seek feedback.
