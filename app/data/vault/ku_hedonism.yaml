description: |
  "Pleasure is the highest good" — but which kind? Crude hedonism says consume everything. The deeper version says enjoy being alive without being owned by appetite. Epicurus said the best pleasures are moderate, intelligent, and sustainable. The yoga perspective adds: enjoy life, but don't be ruled by enjoyment. SKUEL's position is life-affirming — celebrate being alive, but know the difference between savoring and craving.
