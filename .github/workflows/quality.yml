name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**/*.py'
      - 'app/pyproject.toml'
      - 'app/uv.lock'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**/*.py'
      - 'app/pyproject.toml'
      - 'app/uv.lock'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: MyPy Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: app/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('app/uv.lock') }}

      - name: Install dependencies
        if: steps.cached-uv-dependencies.outputs.cache-hit != 'true'
        working-directory: app
        run: uv sync --no-install-project

      - name: Cache MyPy incremental state
        uses: actions/cache@v4
        with:
          path: app/.mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-${{ github.ref_name }}-
            mypy-${{ runner.os }}-py3.12-

      - name: Run MyPy
        id: mypy
        working-directory: app
        run: |
          set -o pipefail
          uv run mypy . | tee mypy_output.txt

      - name: Upload MyPy output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-output
          path: app/mypy_output.txt
          retention-days: 14

      - name: Comment on PR if MyPy failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('app/mypy_output.txt', 'utf8');
            } catch (e) {
              output = '(MyPy output unavailable)';
            }
            // Trim to fit within PR comment limits (~64KB)
            const MAX = 50000;
            if (output.length > MAX) {
              output = output.slice(0, MAX) + '\n\n... (truncated — see "mypy-output" artifact for full log)';
            }

            const body = [
              '## ❌ MyPy Type Check Failed',
              '',
              'The zero-error MyPy baseline regressed on this PR.',
              '',
              'Run locally to reproduce:',
              '```bash',
              'cd app',
              'uv run mypy .',
              '```',
              '',
              '<details><summary>MyPy output</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              'See [`docs/patterns/mypy_pragmatic_strategy.md`](../blob/main/app/docs/patterns/mypy_pragmatic_strategy.md) for the suppression / fix playbook.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
