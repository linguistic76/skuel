# docker-compose.production.yml — SKUEL droplet stack
# ====================================================
# Two containers on the droplet: the SKUEL app + Caddy (auto-TLS reverse
# proxy). Neo4j is NOT here — production talks to AuraDB over neo4j+s://
# (NEO4J_URI in .env.production; boot refuses plaintext schemes).
#
# Config layering:
#   .env.production          non-secret droplet config (copy .env.production.example)
#   /opt/skuel/secrets.env   secrets, mode 0600 (NEO4J_PASSWORD, OPENAI_API_KEY, ...)
#
# Deploy via `./dev deploy` (scripts/deploy.sh) — rsync + build + health gate.
# Local rehearsal: SKUEL_DOMAIN=localhost serves https://localhost via Caddy's
# internal CA (browser warning expected).
#
# For local development, use docker-compose.yml instead:
#   docker compose up                          # Neo4j + App
#   docker compose --profile monitoring up     # + Prometheus + Grafana
#   docker compose up neo4j                    # Neo4j only, then: uv run python main.py
# ====================================================

services:
  skuel-app:
    build:
      context: .
      dockerfile: Dockerfile.production
    # Explicit tag so deploy.sh can retag the previous image as
    # skuel-app:rollback before each build.
    image: skuel-app:latest
    container_name: skuel-app
    env_file:
      - .env.production
      - /opt/skuel/secrets.env
    environment:
      # Hard invariants of this stack — not tunable via env files. The app must
      # bind all container interfaces on 5001 (Caddy proxies to skuel-app:5001,
      # Dockerfile.production healthchecks it) and this file IS the production
      # environment (turns on the encrypted-NEO4J_URI boot guard).
      APP_HOST: 0.0.0.0
      APP_PORT: 5001
      SKUEL_ENVIRONMENT: production
    ports:
      # Loopback only — Caddy fronts the world; the deploy health gate and
      # droplet-side curl use 127.0.0.1:5001 directly.
      - "127.0.0.1:5001:5001"
    volumes:
      # Content vault (curriculum, INGESTION_PATH) — synced by `./dev deploy
      # --content`, read-only to the app.
      - /opt/skuel/content-vault:/app/content-vault:ro
      # Primary personal vault (VAULT_ROOT, owner-bound) — read-write.
      - /opt/skuel/personal-vault:/app/personal-vault
      # Per-user personal vault roots (SKUEL_USER_VAULTS_ROOT).
      - user_vaults:/app/data/user_vaults
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: skuel-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy reads SKUEL_DOMAIN / ACME_EMAIL from its container environment via
    # the {$VAR} placeholders in the Caddyfile — no compose-level interpolation,
    # so plain `docker compose -f docker-compose.production.yml up` works
    # without exporting anything. Secrets are NOT mounted here on purpose.
    env_file:
      - .env.production
    depends_on:
      - skuel-app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  user_vaults:
  caddy_data:
  caddy_config:
