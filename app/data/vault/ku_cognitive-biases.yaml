description: |
  Systematic shortcuts your brain takes that lead you astray. Cognitive biases aren't stupidity — they're how human minds are wired. Confirmation bias makes you see what you already believe. Negativity bias makes threats louder than opportunities. The Dunning-Kruger effect makes beginners overconfident and experts doubtful. Recognizing these patterns is the first step to thinking more clearly. Yoga calls it the same thing: seeing past your conditioning.
