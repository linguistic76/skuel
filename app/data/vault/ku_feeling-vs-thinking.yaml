source: research
sel_category: self_awareness
description: |
  Two different systems, two different kinds of knowing. Thinking happens in the prefrontal cortex — logic, language, planning. Feeling happens in the limbic system — emotion, intuition, body sense. Neither is better. But most education only trains thinking. SKUEL trains both. The skill is knowing which one you're using right now: "Am I feeling this or thinking this?" That question changes everything.
